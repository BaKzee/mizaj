/* =======================================================================
   STORAGE LAYER
   One adapter, three backends — chosen at runtime:
     1. window.storage   (Claude artifact preview)
     2. IndexedDB        (real browser / installed PWA — the production path)
     3. memory           (last resort, never silently pretends to persist)
   Everything above this line is unaware of which one is in use.
   ======================================================================= */
const SCHEMA = 1;
const KEY = 'mizaj:state';

const Backend = (() => {
  /* --- 1. artifact host --- */
  if (typeof window !== 'undefined' && window.storage && window.storage.get) {
    return {
      name: 'artifact',
      async load() {
        try { const r = await window.storage.get(KEY); return r ? JSON.parse(r.value) : null; }
        catch { return null; }
      },
      async save(o) { await window.storage.set(KEY, JSON.stringify(o)); },
    };
  }

  /* --- 2. IndexedDB --- */
  if (typeof indexedDB !== 'undefined') {
    const open = () => new Promise((res, rej) => {
      const r = indexedDB.open('mizaj', 1);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      // a stale connection (old tab / suspended Home-Screen instance) can leave
      // this request neither resolving nor rejecting — without this handler the
      // whole app hangs silently forever waiting on it.
      r.onblocked = () => rej(new Error('indexedDB blocked by another open connection'));
    });
    return {
      name: 'indexeddb',
      async load() {
        try {
          const db = await open();
          return await new Promise((res, rej) => {
            const q = db.transaction('kv').objectStore('kv').get(KEY);
            q.onsuccess = () => res(q.result || null);
            q.onerror = () => rej(q.error);
          });
        } catch { return null; }
      },
      async save(o) {
        const db = await open();
        await new Promise((res, rej) => {
          const tx = db.transaction('kv', 'readwrite');
          tx.objectStore('kv').put(o, KEY);
          tx.oncomplete = res; tx.onerror = () => rej(tx.error);
        });
      },
    };
  }

  /* --- 3. memory --- */
  let mem = null;
  return { name: 'memory', async load() { return mem; }, async save(o) { mem = o; } };
})();

/* ---------- state shape + migrations ---------- */
function freshState() {
  const inv = {};
  DATA.flavors.forEach(f => {
    inv[f.id] = { packG: f.defaultPack || 200, remG: f.defaultPack || 200, usedG: 0, uses: 0, firstUsed: null, lastUsed: null, purchases: [] };
  });
  return {
    schema: SCHEMA,
    // bowlG   = the bowl's nominal capacity (15 / 20 / 25)
    // overfill = extra % of tobacco needed to actually fill it to the rim.
    //            12% of a 20g bowl is 2.4g — matching what BaKzee measures.
    settings: { bowlG: 20, overfillPct: 12, lowPct: 15, defaultPackG: 200,
                sessionCapMin: 90, sound: true },
    inventory: inv,
    draft: null,
    sessions: [],
    myRecipes: [],
    meta: { created: Date.now(), lastBackup: null, saves: 0 },
  };
}

const MIGRATIONS = {
  // 1: (v) => { ...; v.schema = 2; return v; }
};

function migrate(s) {
  if (!s || typeof s !== 'object') return freshState();
  while (s.schema < SCHEMA && MIGRATIONS[s.schema]) s = MIGRATIONS[s.schema](s);
  if (s.schema !== SCHEMA) return freshState();
  const base = freshState();
  // any flavour added to the library since the last save gets an inventory row
  DATA.flavors.forEach(f => {
    if (!s.inventory[f.id]) s.inventory[f.id] = base.inventory[f.id];
    else s.inventory[f.id] = Object.assign({}, base.inventory[f.id], s.inventory[f.id]);
  });
  s.settings = Object.assign(base.settings, s.settings || {});
  /* وصفاتك المحفوظة تحمل خطة الفحم يوم حفظها. الخطة القديمة («ثلاث فحمات»،
     «ارفع إلى ثلاث خلال عشر دقائق») ناقضها سجلك، فتُعاد كتابتها هنا مرة واحدة.
     البول الذي اخترته يبقى كما هو. */
  (s.myRecipes || []).forEach(r => {
    if (r.setup && COAL_PLAN.some(c => r.setup.includes(c))) return;
    const items = (r.items || []).map(i => ({ f: flavorById(i.id), pct: i.pct })).filter(i => i.f);
    if (items.length < 2) return;
    const inf = inferBowl(items);
    r.setup = inf.setup; r.minLo = inf.minLo; r.minHi = inf.minHi;
    if (!r.bowl) r.bowl = inf.bowl;
  });
  return s;
}

let STATE = freshState();

/* ---------- debounced autosave with a visible status ---------- */
let saveTimer = null, saveStatus = 'idle';
function setStatus(s) {
  saveStatus = s;
  const el = document.getElementById('saveDot');
  if (!el) return;
  el.className = 'save-dot ' + s;
  el.title = s === 'saving' ? 'جارٍ الحفظ' : s === 'saved' ? 'محفوظ' : s === 'error' ? 'فشل الحفظ' : '';
}

function save(now) {
  clearTimeout(saveTimer);
  const run = async () => {
    setStatus('saving');
    try {
      STATE.meta.saves++;
      await Backend.save(STATE);
      setStatus('saved');
      setTimeout(() => { if (saveStatus === 'saved') setStatus('idle'); }, 1600);
    } catch (e) { console.error(e); setStatus('error'); }
  };
  now ? run() : (saveTimer = setTimeout(run, 400));
}

async function bootStorage() {
  const loaded = await Backend.load();
  Object.assign(STATE, migrate(loaded));   // in place: never invalidate a held reference
  if (!loaded) save(true);
  // ask the OS to keep this data even under storage pressure
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch {}
}

/* أنواع البول عندك. الخلط السابق كان يعامل Cosmo كنوع ثالث مستقل بينما هو
   وظيفياً بول تركي — فرقه صناعة لا هندسة. التمييز الحقيقي هو بين قاع مفتوح
   (تركي) وقاع بمدخنة مركزية (فينل)، وبين قاع مسطح ومنحنٍ داخل التركي نفسه. */
const BOWL_TYPES = [
  { id: 'turkish-flat',   name: 'Turkish — مسطح القاع', kind: 'turkish',
    note: 'قاع مستوٍ يوزّع الحرارة بالتساوي — الأنسب للنكهات منخفضة السقف الحراري.' },
  { id: 'turkish-curved', name: 'Turkish — منحني أو مائل', kind: 'turkish',
    note: 'الجدار المائل يجمع النكهة نحو المركز — يعطي كثافة أعلى في منتصف الجلسة.' },
  { id: 'cosmo-phunnel',  name: 'Cosmo Phunnel', kind: 'phunnel',
    note: 'مدخنة مركزية تحبس العسل — الأنسب للنكهات الرطبة وللجلسات الطويلة.' },
  { id: 'oblako-trio',    name: 'Oblako Trio Line', kind: 'phunnel',
    note: 'فينل بثقوب موزّعة — سحب أخف من الفينل المفرد مع احتفاظ مشابه بالعسل.' },
];
const bowlTypeOf = id => BOWL_TYPES.find(b => b.id === id) || BOWL_TYPES[0];

/* ---------- bowl maths ----------
   The percentages describe the blend; the weights describe the bowl.
   Nominal capacity alone always comes up short, so every gram figure is
   taken from the real charge = capacity + overfill. ----------------------*/
function bowlTotal() {
  const s = STATE.settings;
  return +(s.bowlG * (1 + s.overfillPct / 100)).toFixed(1);
}
function overfillG() { return +(bowlTotal() - STATE.settings.bowlG).toFixed(1); }
function gramsFor(pct) { return +(bowlTotal() * pct / 100).toFixed(1); }

/* ---------- inventory ---------- */
function invOf(id) { return STATE.inventory[id]; }
function invPct(id) { const i = invOf(id); return i ? Math.round(i.remG / i.packG * 100) : 0; }
function isLow(id) { return invPct(id) <= STATE.settings.lowPct; }

/* a one-glance stock mark for the flavor pickers. The generator already
   refuses to reach for a flavor that isn't in stock; building by hand had
   no such signal, so a mix could be finished before noticing a tin is
   empty. Returns '' when stock is healthy — no noise on the common case. */
function stockMark(id) {
  const i = invOf(id);
  if (!i || i.remG <= 0) return '<span class="stock-mark out">نفدت</span>';
  if (isLow(id)) return `<span class="stock-mark low">تقارب النفاد · ${i.remG}غ</span>`;
  return '';
}

/* ─── قاعدة مشتركة: التوفّر، التكلفة، والإهمال ─── */
const NEGLECT_DAYS = 120;
const TIN_STALE_DAYS = 90;   // من هنا: راقبها
const TIN_OLD_DAYS = 150;    // من هنا: افحصها قبل الإشعال — الجفاف مرجَّح

// عمر العلبة منذ أول استخدام — أدقّ تقريب متاح لتاريخ الفتح الفعلي
function tinAgeDays(fid) {
  const i = invOf(fid); if (!i || !i.firstUsed) return null;
  return daysSince(i.firstUsed);
}
function tinAgeLabel(fid) {
  const d = tinAgeDays(fid); if (d == null) return null;
  if (d >= TIN_OLD_DAYS) return { d, level: 'old', txt: `مفتوحة منذ ${d} يوماً — الجفاف مرجَّح، افحصها قبل الحشو` };
  if (d >= TIN_STALE_DAYS) return { d, level: 'stale', txt: `مفتوحة منذ ${d} يوماً — راقب الملمس` };
  return { d, level: 'ok', txt: `مفتوحة منذ ${d} يوماً` };
}

// الوصفات التي تستعمل نكهة بعينها — الرابط العكسي الذي كان مفقوداً
function recipesUsing(fid) {
  return allRecipes().filter(r => liveItems(r).some(i => i.f.id === fid));
}

// هل يكفي المخزون فعلاً لتنفيذ الوصفة كاملة في بول واحد؟
function canMakeNow(r) {
  const missing = [];
  liveItems(r).forEach(i => {
    const need = gramsFor(i.pct), inv = invOf(i.f.id);
    if (!inv || inv.remG < need) missing.push({ f: i.f, need, have: inv ? inv.remG : 0 });
  });
  return { ok: !missing.length, missing };
}

// تكلفة الجلسة = مجموع (غرامات كل نكهة × سعر الغرام). تُحسب فقط لما تُدخل الأسعار.
const gramCost = id => { const i = invOf(id); return (i && i.price && i.packG) ? i.price / i.packG : null; };
function recipeCost(r) {
  let total = 0, known = 0, all = liveItems(r).length;
  liveItems(r).forEach(i => { const c = gramCost(i.f.id);
    if (c !== null) { total += c * gramsFor(i.pct); known++; } });
  return { total, known, all, complete: known === all && all > 0 };
}

// نكهة لم تُلمس منذ أربعة أشهر — أو لم تُفتح أصلاً
function isNeglected(fid) {
  const i = invOf(fid); if (!i) return false;
  if (!i.lastUsed) return true;
  return (Date.now() - i.lastUsed) / 864e5 >= NEGLECT_DAYS;
}

function consume(items) {           // [{flavorId, grams}]
  items.forEach(({ flavorId, grams }) => {
    const i = invOf(flavorId); if (!i) return;
    i.remG = Math.max(0, +(i.remG - grams).toFixed(1));
    i.usedG = +((i.usedG || 0) + grams).toFixed(1);
    i.uses = (i.uses || 0) + 1;
    if (!i.firstUsed) i.firstUsed = Date.now();
    i.lastUsed = Date.now();
  });
  save();
}

function refill(id, packG) {
  const i = invOf(id); if (!i) return;
  const addG = packG || i.packG;           // كمية العلبة الجديدة المضافة فعلياً
  i.remG = +(i.remG + addG).toFixed(1);    // تُجمع على الرصيد الحالي — لا سقف عند 100%
  i.packG = packG || i.packG;              // آخر حجم عبوة مُشترى، لعرض النسبة فقط
  i.purchases = i.purchases || [];
  i.purchases.push({ ts: Date.now(), g: addG });
  save();
}

/* ---------- backup ---------- */
function exportBackup() {
  const blob = new Blob([JSON.stringify(STATE, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `mizaj-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  STATE.meta.lastBackup = Date.now();
  save(true);
  updateBackupBadge();
}

function importBackup(file, done) {
  const r = new FileReader();
  r.onload = () => {
    try {
      Object.assign(STATE, migrate(JSON.parse(r.result)));
      try { applyMeasured(); } catch (e) { console.error('applyMeasured', e); }
      save(true); done(true);
    } catch { done(false); }
  };
  r.readAsText(file);
}

function daysSinceBackup() {
  if (!STATE.meta.lastBackup) return Infinity;
  return Math.floor((Date.now() - STATE.meta.lastBackup) / 864e5);
}
function backupOverdue() { const d = daysSinceBackup(); return d === Infinity || d >= 30; }
function updateBackupBadge() {
  const dot = document.getElementById('backupDot');
  if (dot) dot.style.display = backupOverdue() ? 'block' : 'none';
}

/* =======================================================================
   BUILD ENGINE — constraint solver
   Picks propagate: every selection narrows what can come next and clips
   the percentage ranges of everything remaining.
   ======================================================================= */
const BUILD = { picks: [], genSeed: null, genMeta: null };            // [{f, pct}], genSeed: {type,label,f?,key?}|null
const STEP = 5;                          // every percentage is a multiple of 5

const banPairs = new Set(), wastePairs = new Set(), banReason = {};
DATA.bans.forEach(b => {
  const k1 = b.a + '||' + b.b, k2 = b.b + '||' + b.a;
  (b.kind === 'waste' ? wastePairs : banPairs).add(k1);
  (b.kind === 'waste' ? wastePairs : banPairs).add(k2);
  banReason[k1] = banReason[k2] = b.reason;
});

/* قانون التكديس يُطبَّق على التشابه الطعمي الحقيقي لا على اسم العائلة وحده:
   التوت والحمضيات والأزهار والمبرّدات متجانسة (توتان = ضبابية)، أما الكريمية
   والأساسية والعشبية والاستوائية فعائلات واسعة: القهوة لا تُكدَّس مع الفانيلا،
   والكرز لا يُكدَّس مع الكولا — فيُقارن جذر العائلة الطعمية. والجسر بجانب قائد
   من عائلته داعمٌ له لا منافس، فلا يُقصّ. */
const HOMO_FAMS = new Set(['berry', 'citrus', 'floral', 'cooling']);
/* نكهات قيمها (المحاور والسلوك) مستنتجة لا مجرّبة ولا موثّقة — تبقى كما هي حتى تجرّبها بنفسك */
const UNTESTED_VALUES = ['chai-masala', 'spiced-oolong', 'red-wine',
  'feijoa-jam', 'pear-lemonade', 'tarhun', 'black-vanilla', 'manila-malina', 'grapple', 'ruby-grapes', 'old-school-orange',
  'cranberry-shock', 'pineapple', 'ext-honey', 'ext-strawberry', 'ext-lemon', 'bonche-mango', 'bonche-lychee', 'bonche-coconut', 'bonche-rum', 'bonche-whiskey', 'bonche-lavender', 'bonche-vanilla', 'pinkman', 'rocketman', 'ext-melon', 'strawberry-lychee', 'moroccan-tea', 'cinnamon-buns', 'mango-passion-lychee-rose', 'satyr-california-cola', 'satyr-lotus', 'falling-star', 'fruity-dust', 'piki'];
/* «تقديرية» حتى تقيسها أنت — بعدها تسقط الشارة */
const isEstimated = f => !!f && UNTESTED_VALUES.includes(f.id) && !f.measured;

/* =======================================================================
   المكتبة تتصحّح من جلساتك — سؤال الدقيقة 15 و40 «أي نكهة تسمع الآن؟».
   نموذج اختيار: احتمال أن تسمع النكهة i = (حصتها² × وزنها) ÷ مجموع الخلطة.
   الأس 2 هو الأنسب لإجاباتك (حصة القائدة تطغى أكثر من نسبتها). الوزن يُقدَّر
   بتكرار MM مع مسبق = فحص واحد عند 1، ثم يصير «القوة» على 1–5:
   3 = تُسمع بقدر حصتها، وكل مضاعفة = درجة. لا يُطبَّق إلا بفرصة كافية — لو
   كانت النكهات متساوية لتوقّعنا سماعها 3 مرات على الأقل — وإلا تبقى قيمة
   الكتاب. المبرّدات لا تُقاس بهذا السؤال.
   ======================================================================= */
const MEASURE = { alpha: 2, prior: 1, minOpp: 3, minChecks: 10 };
function phaseCheckRows() {
  const out = [];
  (STATE.sessions || []).forEach(s => {
    if (!s.phaseChecks || !s.phaseChecks.length) return;
    const r = allRecipes().find(x => RKEY(x) === s.key); if (!r) return;
    const items = itemsAt(r, s.start).filter(i => i.f && i.f.id).map(i => ({ id: i.f.id, pct: i.pct }));
    if (items.length < 2) return;
    s.phaseChecks.forEach(c => { if (c.id && items.some(i => i.id === c.id)) out.push({ at: c.at, heard: c.id, items }); });
  });
  return out;
}
function fitPresence(rows) {
  const A = MEASURE.alpha, L = MEASURE.prior;
  const ids = [...new Set(rows.flatMap(c => c.items.map(i => i.id)))];
  const w = Object.fromEntries(ids.map(i => [i, 1]));
  const sh = rows.map(c => { const t = c.items.reduce((a, i) => a + i.pct, 0) || 100;
    return c.items.map(i => [i.id, Math.pow(i.pct / t, A)]); });
  for (let it = 0; it < 150; it++) {
    const num = {}, den = {};
    rows.forEach((c, k) => {
      const Z = sh[k].reduce((a, [i, v]) => a + v * w[i], 0);
      num[c.heard] = (num[c.heard] || 0) + 1;
      sh[k].forEach(([i, v]) => { den[i] = (den[i] || 0) + v / Z; });
    });
    ids.forEach(i => { w[i] = ((num[i] || 0) + L) / ((den[i] || 0) + L); });
    const g = Math.exp(ids.reduce((a, i) => a + Math.log(w[i]), 0) / ids.length);
    ids.forEach(i => { w[i] /= g; });
  }
  const opp = {}, n = {}, heard = {};
  rows.forEach((c, k) => {
    const Z0 = sh[k].reduce((a, [, v]) => a + v, 0);
    sh[k].forEach(([i, v]) => { opp[i] = (opp[i] || 0) + v / Z0; n[i] = (n[i] || 0) + 1; });
    heard[c.heard] = (heard[c.heard] || 0) + 1;
  });
  return { w, opp, n, heard };
}
function measureFlavors() {
  const rows = phaseCheckRows(); if (rows.length < MEASURE.minChecks) return {};
  const all = fitPresence(rows);
  const early = rows.filter(c => c.at === 15), late = rows.filter(c => c.at === 40);
  const fe = early.length >= 8 ? fitPresence(early) : null, fl = late.length >= 8 ? fitPresence(late) : null;
  const out = {};
  Object.keys(all.w).forEach(id => {
    const ok = fe && fl && (fe.opp[id] || 0) >= MEASURE.minOpp && (fl.opp[id] || 0) >= MEASURE.minOpp;
    out[id] = { w: all.w[id], power: Math.max(1, Math.min(5, Math.round(3 + Math.log2(all.w[id])))),
      opp: all.opp[id] || 0, n: all.n[id] || 0, heard: all.heard[id] || 0, lateRatio: ok ? fl.w[id] / fe.w[id] : null };
  });
  return out;
}
function applyMeasured() {
  const m = measureFlavors();
  DATA.flavors.forEach(f => {
    if (f._bookPower !== undefined) f.power = f._bookPower;
    delete f.measured;
    const x = m[f.id];
    if (!x || f.family === 'cooling' || (f.roles || []).includes('pureCool') || x.opp < MEASURE.minOpp) return;
    if (f._bookPower === undefined) f._bookPower = f.power;
    f.measured = x; f.power = x.power;
  });
}
const sfRoot = f => (f.subfamily || '').split(' ')[0];
function stacksWith(a, b) {
  if (!a || !b || a.family !== b.family) return false;
  const ba = (a.roles || []).includes('bridge'), bb = (b.roles || []).includes('bridge');
  if (ba !== bb) return false;
  if (HOMO_FAMS.has(a.family)) return true;
  if ((a.subfamily || '').includes('مشكّل') || (b.subfamily || '').includes('مشكّل')) return true;
  return sfRoot(a) === sfRoot(b);
}

const total = () => BUILD.picks.reduce((s, p) => s + p.pct, 0);
const remaining = () => 100 - total();
const anchor = () => BUILD.picks.reduce((a, p) => (!a || p.pct > a.pct) ? p : a, null);

/* ---------- evaluate one candidate against the current selection ---------- */
function evaluate(cand) {
  const issues = [];
  let hard = false;

  for (const p of BUILD.picks) {
    const f = p.f;
    if (f.name === cand.name) return { blocked: true, hard: true, issues: [{ sev: 'r', t: 'مختارة بالفعل' }], score: 0 };

    // absolute prohibitions from the book
    const key = f.name + '||' + cand.name;
    if (banPairs.has(key)) { hard = true; issues.push({ sev: 'r', t: `ممنوع مع ${f.name} — ${banReason[key]}` }); }
    else if (wastePairs.has(key)) issues.push({ sev: 'o', t: `هدر: ${f.name} تؤدي نفس الدور — ${banReason[key]}` });

    // duplicates / redundancy
    if (cand.subfamily === f.subfamily) {
      issues.push({ sev: 'o', t: `نفس العائلة الطعمية (${cand.subfamily}) مع ${f.name} — تكرار بلا فائدة` });
    } else if (cand.subfamily.split(' ')[0] === f.subfamily.split(' ')[0]) {
      // تداخل جزئي (كرزان مختلفان، توت مع مبرّد توتي) — معلومة لا مخالفة: وصفاتك المجرّبة ★ فيها مثله
      issues.push({ sev: 'y', t: `تداخل طعمي مع ${f.name} — كلتاهما ${cand.subfamily.split(' ')[0]}` });
    }

    // law 1 — sensory curdling, graded
    const acidCream = (a, b) => a.acid >= 4 && b.family === 'creamy' && b.density >= 4;
    if (acidCream(cand, f) || acidCream(f, cand)) {
      const hi = (cand.acid === 5 || f.acid === 5) && (cand.density === 5 || f.density === 5);
      issues.push({ sev: hi ? 'o' : 'y', t: `القانون 1: حموضة مع كريمة كثيفة (${f.name})` });
    }

    // law 5 — heat ceiling and volatility gaps
    // الأدنى يحكم الحرارة، والأعلى سقفاً يعمل دون طاقته فقط — لا ضرر (وصفاتك ★4–5 مثل #3 و#9 و#31 فيها هذا الفارق)
    if (Math.abs(cand.ceiling - f.ceiling) >= 3)
      issues.push({ sev: 'y', t: `سقف حراري متباعد مع ${f.name} — الحرارة تُضبط على الأدنى` });
    if (Math.abs(cand.volatility - f.volatility) >= 3)
      issues.push({ sev: 'y', t: `فجوة تطايُر مع ${f.name} — قد تموت إحداهما قبل أن تستيقظ الأخرى` });
  }

  // law 2 — stacking within one family
  const sameFam = BUILD.picks.filter(p => stacksWith(p.f, cand));
  if (sameFam.length === 1)
    issues.push({ sev: 'y', t: `نكهة ثانية من عائلة ${FAM_AR[cand.family]} — قانون التكديس يقصّها عند 15%` });
  if (sameFam.length >= 2)
    issues.push({ sev: 'o', t: `ثلاث نكهات من عائلة ${FAM_AR[cand.family]} — ضبابية لا عمق` });

  // generic rule: three berries together
  if (cand.family === 'berry' && BUILD.picks.filter(p => p.f.family === 'berry').length >= 2)
    issues.push({ sev: 'r', t: 'ممنوع: ثلاثة أنواع توت معاً' });

  // law 6 — cooling budget
  const coolLoad = BUILD.picks.filter(p => p.f.cool >= 2).reduce((s, p) => s + p.pct, 0);
  if (cand.family === 'cooling' && cand.roles.includes('pureCool')) {
    const banned = BUILD.picks.filter(p =>
      ['creamy', 'floral'].includes(p.f.family) ||
      ['قهوة', 'شوكولاتة وبندق', 'شوكولاتة مخبوزة'].includes(p.f.subfamily));
    if (banned.length)
      issues.push({ sev: 'r', t: `التبريد ممنوع نهائياً مع ${banned.map(b => b.f.name).join('، ')}` });
  }
  if (cand.cool >= 2 && coolLoad >= 15)
    issues.push({ sev: 'o', t: 'تراكم تبريد — عدة نكهات تحمل تبريداً ذاتياً' });

  // base score from the family matrix, taken as the weakest link
  let score = 5;
  BUILD.picks.forEach(p => { score = Math.min(score, DATA.familyMatrix[p.f.family][cand.family]); });
  if (!BUILD.picks.length) score = 5;
  issues.forEach(i => { if (i.sev === 'r') score = 0; else if (i.sev === 'o') score -= 1.5; else score -= 0.5; });
  score = Math.max(0, Math.min(5, score));

  return { blocked: hard, hard, issues, score };
}

/* ---------- RECOMMENDED percentage window — advice, never a wall ----------
   BaKzee's call: the numbers are hypotheses. Sessions will prove or
   disprove them, and the notes will earn the exceptions. So the engine
   states its reasoning and gets out of the way. ---------------------------*/
const HARD_MIN = 5, HARD_MAX = 95;

/* top/heart/base phase model — moved up here (ahead of renderBuild's very
   first call) because a `const` isn't hoisted: defining it after the code
   that already calls phaseTagFor() throws "Cannot access before
   initialization" and aborts the whole script's startup. */
const PHASES = [
  { from: 0,  to: 15,  name: 'الطبقة المتطايرة', fams: ['citrus', 'cooling', 'floral'],
    hint: 'الحمضيات · المنعشات · الأزهار · التبريد — أقصر عمراً.' },
  { from: 15, to: 40,  name: 'القلب', fams: ['berry', 'tropical', 'base', 'herbal'],
    hint: 'هنا تُحكم على الخلطة فعلاً.' },
  { from: 40, to: 999, name: 'القاع', fams: ['creamy'],
    hint: 'الكريمات والقهوة — الفرق بين خلطة تنتهي وخلطة تنطفئ بهدوء.' },
];

/* المرحلة تُقاس بسلوك النكهة لا بعائلتها وحدها: كولا كثيفة طويلة العمر تصنع
   قاعاً حقيقياً مثل الكريمة، ونكهة سريعة التطايُر تخدم الطبقة الأولى مهما كانت
   عائلتها. هذا يصحّح إنذارات "مرحلة بلا بطل" التي كانت تظهر على وصفات سليمة. */
function servesPhase(f, idx) {
  if (idx === 0) return PHASES[0].fams.includes(f.family) || f.volatility <= 2;
  if (idx === 1) return PHASES[1].fams.includes(f.family);
  return f.family === 'creamy' || (f.density >= 4 && f.duration >= 4);
}

/* one-glance answer to "does this flavor build the top, the heart, or the
   base?" — surfaced wherever a flavor is offered for picking, so phase
   balance can be judged before adding it rather than after the fact. */
function phaseTagFor(f) {
  const names = [];
  if (servesPhase(f, 0)) names.push('الطبقة الأولى');
  if (servesPhase(f, 1)) names.push('القلب');
  if (servesPhase(f, 2)) names.push('القاع');
  return names.join(' + ') || 'محايدة';
}

const PHASE_SHORT = ['الطبقة الأولى', 'القلب', 'القاع'];
// cool → gold → warm: the same arc the session itself travels
const PHASE_DOT = ['var(--note)', 'var(--ember)', 'var(--warn)'];

/* the same answer as phaseTagFor, drawn as its own quiet line under the
   flavour name rather than a badge beside it. */
function phaseLineHTML(f) {
  const parts = [];
  for (let i = 0; i < 3; i++) {
    if (servesPhase(f, i)) parts.push(
      `<span class="ph"><i style="background:${PHASE_DOT[i]}"></i>${PHASE_SHORT[i]}</span>`);
  }
  if (!parts.length) parts.push('<span class="ph muted"><i></i>محايدة</span>');
  return `<span class="phase-line">${parts.join('')}</span>`;
}

function windowFor(cand, excludeSelf) {
  let lo = cand.minPct, hi = cand.maxPct;
  const reasons = { lo: `دورها ${cand.role} — دون ${cand.minPct}% تفقد حضورها في الخلطة`, hi: null };

  const others = excludeSelf ? BUILD.picks.filter(p => p.f.id !== cand.id) : BUILD.picks;

  const mine = BUILD.picks.find(p => p.f.id === cand.id);
  if (others.some(p => stacksWith(p.f, cand) && (!mine || p.pct >= mine.pct)) && hi > 15) {
    hi = 15; reasons.hi = `قانون التكديس — نكهة ثانية من عائلة ${FAM_AR[cand.family]} تبقى تحت 15%`;
  }
  if (cand.roles.includes('pureCool') && hi > 5) {
    hi = 5; reasons.hi = 'القانون السادس — التبريد النقي لا يتجاوز 5%';
  }
  const a = others.reduce((x, p) => (!x || p.pct > x.pct) ? p : x, null);
  // القائد نفسه لا يُقصّ تحت من هو أصغر منه — كان هذا يجعل قائد كل وصفة يظهر «خارج النطاق» في المحرّر
  const leading = mine && a && mine.pct >= a.pct;
  // إن كان القائد عند سقفه ولا يمكن رفعه، يُسمح للشريك بمساواته (50/50 نسبة معتمدة) بدل حشو 5% لسدّ الفجوة
  const aCap = a ? Math.min(a.f.maxPct, a.f.hardCap || 999) : 0;
  const room = a ? (a.pct >= aCap ? a.pct : a.pct - STEP) : 0;
  if (a && !leading && hi > room) {
    hi = room; reasons.hi = room === a.pct
      ? `قانون الهيمنة — لا تتجاوز ${a.f.name} (${a.pct}%) وهي عند سقفها`
      : `قانون الهيمنة — يجب أن تبقى دون ${a.f.name} (${a.pct}%) بفارق واضح`;
  }
  if (cand.hardCap && hi > cand.hardCap) {
    hi = cand.hardCap; reasons.hi = `سقف موثّق عند ${cand.hardCap}% — تجاوزه يغيّر طعمها`;
  }
  if (!reasons.hi) reasons.hi = `دورها ${cand.role} — فوق ${cand.maxPct}% قد تبتلع بقية الخلطة`;

  lo = Math.max(HARD_MIN, Math.ceil(lo / STEP) * STEP);
  hi = Math.floor(hi / STEP) * STEP;

  // A law can cap lower than the flavour's own role minimum — e.g. a second
  // berry is held to 15% while its role asks for 25%. The law wins, and the
  // clash is reported rather than quietly smoothed over.
  if (hi < lo) {
    reasons.clash = `تعارض: دورها ${cand.role} يطلب ${cand.minPct}% على الأقل، لكن ${reasons.hi}`;
    lo = Math.max(HARD_MIN, hi);
  }
  return { lo, hi, reasons, ok: true };
}

/* why a given percentage sits outside the recommendation */
function outOfRange(cand, pct, excludeSelf) {
  const w = windowFor(cand, excludeSelf);
  if (pct < w.lo) return { dir: 'low', t: w.reasons.lo };
  if (pct > w.hi) return { dir: 'high', t: w.reasons.hi };
  return null;
}

/* ---------- weighted eight-axis profile of the current mix ---------- */
const AX8 = [
  ['power', 'القوة', 5], ['sweet', 'الحلاوة', 5], ['acid', 'الحموضة', 5],
  ['cool', 'التبريد', 5], ['density', 'الكثافة', 5], ['ceiling', 'السقف', 5],
  ['volatility', 'التطايُر', 4], ['duration', 'الاستمرارية', 4],
];
function profile() {
  const t = total() || 1;
  return AX8.map(([k, , max]) =>
    BUILD.picks.reduce((s, p) => s + p.f[k] * p.pct, 0) / t / max);
}

function radarSVG() {
  const vals = profile(), R = 62, C = 78, n = 8;
  const pt = (i, r) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n;
    return [C + Math.cos(a) * r, C + Math.sin(a) * r];
  };
  let g = '';
  [0.25, 0.5, 0.75, 1].forEach(s => {
    const p = Array.from({ length: n }, (_, i) => pt(i, R * s).join(',')).join(' ');
    g += `<polygon points="${p}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  });
  for (let i = 0; i < n; i++) {
    const [x, y] = pt(i, R);
    g += `<line x1="${C}" y1="${C}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
  }
  const shape = vals.map((v, i) => pt(i, Math.max(3, R * v)).join(',')).join(' ');
  g += `<polygon points="${shape}" fill="var(--ember)" fill-opacity=".26" stroke="var(--ember)" stroke-width="2" stroke-linejoin="round"/>`;
  vals.forEach((v, i) => {
    const [x, y] = pt(i, Math.max(3, R * v));
    g += `<circle cx="${x}" cy="${y}" r="2.6" fill="var(--ember)"/>`;
  });
  let labels = '';
  AX8.forEach(([, ar], i) => {
    const [x, y] = pt(i, R + 13);
    labels += `<text x="${x}" y="${y}" font-size="9.5" fill="var(--ink-soft)"
      text-anchor="middle" dominant-baseline="middle">${ar}</text>`;
  });
  // viewBox widened by 26 units a side (and a little vertically): the side
  // labels «الحموضة» and «التطايُر» are centred on points only 3 units inside
  // the old 156-wide box, so they were cut in half on screen.
  return `<svg viewBox="-26 -6 208 168" style="width:100%;max-width:330px;display:block;margin:0 auto">${g}${labels}</svg>`;
}

/* =======================================================================
   BUILD SCREEN UI
   ======================================================================= */
const bScreen = document.getElementById('screen-build');
let bQuery = '', bPickerOpen = false;

function sevColor(s) { return s === 'r' ? 'var(--danger)' : s === 'o' ? 'var(--warn)' : 'var(--f-base)'; }

/* Canonical connector types. Any flavour whose name carries one of these
   tokens is treated as a bridge/support — including tins bought later, which
   pick up the role automatically instead of landing as an unclassified main.
   Percentages are NOT set here: every flavour keeps its own documented
   window, so a pure coolant tagged here is still capped at 5% by law six. */
const BRIDGE_TYPES = [
  { token: 'vanilla',     ar: 'فانيليا' },
  { token: 'white grape', ar: 'عنب أبيض' },
  { token: 'green grape', ar: 'عنب أخضر' },
  { token: 'coconut',     ar: 'جوز هند' },
  { token: 'mint',        ar: 'نعناع' },
  { token: 'rose',        ar: 'ورد' },
  { token: 'cream',       ar: 'كريمة' },
  { token: 'milk',        ar: 'حليب' },
  { token: 'lychee',      ar: 'ليتشي' },
];
const bridgeTypeOf = name => {
  const n = (name || '').toLowerCase();
  return BRIDGE_TYPES.find(t => n.includes(t.token)) || null;
};
/* Adds the connector roles without disturbing the flavour's existing role,
   so a "main" that is also a natural bridge keeps both. */
function applyBridgeRole(f) {
  if (!f || !f.roles) return false;
  if (!bridgeTypeOf(f.name)) return false;
  // a one-flavour complete recipe is never a connector, whatever its name says
  if (f.roles.includes('complete')) return false;
  let changed = false;
  ['bridge', 'support'].forEach(role => {
    if (!f.roles.includes(role)) { f.roles.push(role); changed = true; }
  });
  return changed;
}
function applyBridgeRolesToLibrary() { DATA.flavors.forEach(applyBridgeRole); }

const BRIDGE_NAMES = ['White Grape', 'Vanilla', 'Coconut Ice-Cream'];
function bridgePct(f) {
  const w = windowFor(f);
  const want = Math.min(Math.max(15, w.lo), w.hi);
  return Math.max(w.lo, Math.floor(want / STEP) * STEP);
}

function findBridgeSuggestion() {
  const inMix = new Set(BUILD.picks.map(p => p.f.id));
  for (const name of BRIDGE_NAMES) {
    const f = DATA.flavors.find(x => x.name.includes(name) && !inMix.has(x.id));
    if (f) return { f, pct: bridgePct(f), kind: 'universal' };
  }
  // النكهات الجسرية الثلاث كلها مستخدَمة أو غير مناسبة — نستخدم مصفوفة التوافق
  // لنقترح نكهة بدور جسر/داعم تناسب كل عائلات المزيج الحالي فعليًا.
  const mixFamilies = [...new Set(BUILD.picks.map(p => p.f.family))];
  if (!mixFamilies.length) return null;
  const candidates = DATA.flavors.filter(f =>
    !inMix.has(f.id) && f.roles && (f.roles.includes('bridge') || f.roles.includes('support')));
  let best = null, bestScore = -1;
  for (const f of candidates) {
    const avg = mixFamilies.reduce((s, fam) => s + (DATA.familyMatrix[f.family]?.[fam] ?? 0), 0) / mixFamilies.length;
    if (avg > bestScore) { bestScore = avg; best = f; }
  }
  if (best && bestScore >= 3.5) return { f: best, pct: bridgePct(best), kind: 'matrix' };
  return null;
}

/* null until the first render: that render only sets the baseline, so a
   draft that was already complete doesn't flash every time the app opens */
let _buildWasComplete = null;

function renderBuild() {
  const picks = BUILD.picks, rem = remaining();
  const _nowComplete = picks.length > 0 && rem === 0;
  const _justCompleted = _buildWasComplete === false && _nowComplete;
  _buildWasComplete = _nowComplete;
  if (_justCompleted) haptic('ok');

  /* ---- empty state: choose the central flavor ---- */
  if (!picks.length) {
    bScreen.innerHTML = `
      <div class="greeting"><div class="display" style="font-size:24px">مع من أذهب من هنا؟</div>
        <p>ابدأ بنكهتك المركزية، وسأضيّق كل خيار تالٍ على ما يتوافق معها فعلاً.</p></div>
      <div class="search" style="margin-bottom:12px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="bq" type="search" placeholder="ابحث عن نكهة البداية…" autocomplete="off" value="${bQuery}">
      </div>
      ${viewToggleHTML()}
      <div id="bList"></div>
      ${STATE.myRecipes && STATE.myRecipes.length ? `
        <div class="section-label" style="margin-top:20px">وصفاتي المحفوظة (${STATE.myRecipes.length})</div>
        ${STATE.myRecipes.map(r => `<div class="flav" data-myopen="${RKEY(r)}">
          <span class="stripe" style="background:${catColor(r.category || 'من تصميمي')}"></span>
          <span class="main"><span class="nm"><span class="rno num">${rNum(r)}</span><bdi>${r.name}</bdi></span>
            <span class="meta">${(r.items || []).map(i => (flavorById(i.id) || {}).name).filter(Boolean).join(' · ')}</span></span>
        </div>`).join('')}` : ''}`;
    wireSearch();
    renderStarters();
    bScreen.querySelectorAll('[data-myopen]').forEach(b => b.onclick = () => { clearSheetStack(); openRecipe(b.dataset.myopen); });
    return;
  }

  /* ---- active build ---- */
  const bar = picks.map(p => {
    const dom = p === anchor();
    return `<span class="${dom ? 'dominant' : ''}" style="width:${p.pct}%;background:${famColor(p.f.family)}"></span>`;
  }).join('') + (rem > 0 ? `<span style="width:${rem}%;background:var(--fill)"></span>` : '');

  const allIssues = [];
  picks.forEach((p, i) => {
    const saved = BUILD.picks;
    BUILD.picks = picks.filter((_, j) => j !== i);
    evaluate(p.f).issues.forEach(x => { if (!allIssues.some(y => y.t === x.t)) allIssues.push(x); });
    BUILD.picks = saved;
  });

  const sweetLoad = picks.reduce((s, p) => s + p.f.sweet * p.pct, 0) / (total() || 1);
  if (sweetLoad >= 4.2) allIssues.push({ sev: 'o', t: 'حلاوة تراكمية عالية — قد تُتعب الحنك بعد منتصف الجلسة' });
  if (picks.length === 1) allIssues.push({ sev: 'y', t: 'نكهة واحدة — أضف داعماً أو جسراً لبناء طبقات' });

  const bridge = (picks.length >= 2 && rem >= STEP) ? findBridgeSuggestion() : null;

  bScreen.innerHTML = `

let lastChangedPick = -1;
function renderPickRows() {
  const el = document.getElementById('pickRows'); if (!el) return;
  const bounceIdx = lastChangedPick; lastChangedPick = -1;
  el.innerHTML = BUILD.picks.map((p, i) => {
    const out = outOfRange(p.f, p.pct, true);
    const w = windowFor(p.f, true);
    const numCls = w.reasons.clash ? ' crit' : (out ? ' warn' : '');
    return `<div class="pick">
      <span class="stripe" style="background:${famColor(p.f.family)}"></span>
      <span class="main"><span class="nm"><bdi>${p.f.name}</bdi>${p === anchor() ? '<span class="lead">مهيمنة</span>' : ''}</span>
        <span class="meta">${p.f.subfamily} · <b class="num">${gramsFor(p.pct)}غ</b> · الموصى به <bdi dir="ltr">${w.lo}–${w.hi}%</bdi></span>
        ${out ? `<span class="offrange">${out.dir === 'low' ? '▾' : '▴'} ${out.t}</span>` : ''}
        ${w.reasons.clash ? `<span class="offrange" style="color:var(--danger)">⚠ ${w.reasons.clash}</span>` : ''}</span>
      <span class="stepper">
        <button data-dn="${i}" ${p.pct - STEP >= HARD_MIN ? '' : 'disabled'}>−</button>
        <b class="num${numCls}${i === bounceIdx ? ' num-bounce' : ''}">${p.pct}%</b>
        <button data-up="${i}" ${p.pct + STEP <= HARD_MAX ? '' : 'disabled'}>+</button>
      </span>
      <button class="rm" data-rm="${i}">×</button>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { lastChangedPick = +b.dataset.up; BUILD.picks[+b.dataset.up].pct += STEP; renderBuild(); });
  el.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => { lastChangedPick = +b.dataset.dn; BUILD.picks[+b.dataset.dn].pct -= STEP; renderBuild(); });
  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { BUILD.picks.splice(+b.dataset.rm, 1); BUILD.genSeed = null; renderBuild(); });
}

function wireSearch() {
  const i = document.getElementById('bq'); if (!i) return;
  i.oninput = e => { bQuery = e.target.value; BUILD.picks.length ? renderCandidates() : renderStarters(); };
}

function matchQ(f) {
  const raw = bQuery.trim(), q = raw.toLowerCase();
  if (!q) return true;
  // widened to match the library's search, which already covered the note and
  // the official description. Searching "زعفران" used to find Black Ji in the
  // library but not here, because only name/subfamily/brand were checked.
  return f.name.toLowerCase().includes(q)
    || f.brand.toLowerCase().includes(q)
    || f.subfamily.includes(raw)
    || (f.note || '').includes(raw)
    || (f.official || '').toLowerCase().includes(q);
}

const STARTER_RANK = f =>
  f.roles.includes('base') ? 0 : f.roles.includes('main') ? 1 : f.roles.includes('complete') ? 2 :
  (f.roles.includes('bridge') || f.roles.includes('support')) ? 3 :
  (f.roles.includes('flavoredCool') || f.roles.includes('pureCool')) ? 4 : 5;
const STARTER_LABEL = ['قاعدة — الأنسب للبدء','رئيسية — الأنسب للبدء','وصفة كاملة بنكهة واحدة','جسر أو داعم','تبريد','لمسة'];

function renderStarters() {
  const el = document.getElementById('bList'); if (!el) return;
  // every flavor stays selectable; ranking just puts the natural starters on top
  const list = DATA.flavors.filter(matchQ)
    .sort((a, b) => (STARTER_RANK(a) - STARTER_RANK(b)) || (b.idealPct - a.idealPct));
  let lastRank = -1;
  el.innerHTML = list.length ? list.map(f => {
    const rk = STARTER_RANK(f);
    const head = rk !== lastRank ? `<div class="section-label" style="margin-top:${lastRank === -1 ? '2px' : '14px'}">${STARTER_LABEL[rk]}</div>` : '';
    lastRank = rk;
    return head + `
    <div class="flav" data-pick="${f.id}">
      <span class="stripe" style="background:${famColor(f.family)}"></span>
      <span class="main"><span class="nm"><bdi>${f.name}</bdi>${stockMark(f.id)}</span>
        ${phaseLineHTML(f)}
        <span class="meta"><span class="sub">${f.subfamily} · ${FAM_AR[f.family]}</span></span></span>
      <span class="pct">${f.idealPct}%</span>
    </div>`;
  }).join('') : '<div class="empty">لا نتيجة.</div>';
  el.querySelectorAll('[data-pick]').forEach(x => x.onclick = () => {
    const f = DATA.flavors.find(y => y.id === x.dataset.pick);
    BUILD.picks = [{ f, pct: Math.min(f.idealPct, 45) }];
    BUILD.genSeed = null;
    bQuery = ''; renderBuild(); window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

function renderCandidates() {
  const el = document.getElementById('bList'); if (!el) return;
  const rows = DATA.flavors.filter(matchQ).map(f => {
    const ev = evaluate(f), w = windowFor(f);
    return { f, ev, w };
  }).filter(r => !BUILD.picks.some(p => p.f.id === r.f.id))
    .sort((a, b) => (b.ev.score - a.ev.score) || (b.w.ok - a.w.ok));

  const open = rows.filter(r => !r.ev.hard);
  const shut = rows.filter(r => r.ev.hard);

  const row = (r, dim) => {
    const worst = r.ev.issues.find(i => i.sev === 'r') || r.ev.issues.find(i => i.sev === 'o') || r.ev.issues[0];
    const why = dim ? worst.t : (worst ? worst.t : '');
    return `<div class="flav${dim ? ' dim' : ''}" ${dim ? '' : `data-add="${r.f.id}"`}>
      <span class="stripe" style="background:${famColor(r.f.family)}"></span>
      <span class="main">
        <span class="nm"><bdi>${r.f.name}</bdi>${stockMark(r.f.id)}
          ${!dim ? `${starsHTML(r.ev.score)}` : ''}</span>
        ${phaseLineHTML(r.f)}
        <span class="meta"><span class="sub">${r.f.subfamily}</span>${why ? `<span class="why"><span class="sep"> · </span><span style="color:${dim ? 'var(--danger)' : sevColor(worst.sev)}">${why}</span></span>` : ''}</span>
      </span>
      ${dim ? '' : `<span class="pct"><bdi dir="ltr">${r.w.lo}–${r.w.hi}%</bdi></span>`}
    </div>`;
  };

  let html = open.length ? open.map(r => row(r, false)).join('')
    : `<div class="empty">لا خيار متاح.<br>جرّب خفض نسبة النكهة المهيمنة أو حذف آخر إضافة.</div>`;
  if (shut.length) html += `<div class="section-label">ممنوعة — فشل حسي موثّق (${shut.length})</div>` +
    shut.map(r => row(r, true)).join('');
  el.innerHTML = html;

  el.querySelectorAll('[data-add]').forEach(x => x.onclick = () => {
    const f = DATA.flavors.find(y => y.id === x.dataset.add);
    const w = windowFor(f);
    const want = Math.min(Math.max(f.idealPct, w.lo), w.hi);
    BUILD.picks.push({ f, pct: Math.floor(want / STEP) * STEP });
    BUILD.genSeed = null;
    bQuery = ''; renderBuild(); window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

/* ---------- save the current build as one of my recipes ----------
   prompt/alert/confirm are blocked inside sandboxed frames, so every
   dialog here is built from real DOM. -------------------------------- */
/* حذف وصفة كان يترك ثقباً في الترقيم (خاص 8 ثم خاص 10). الترقيم مجرد عرض —
   المفتاح الحقيقي هو r.id — لذا إعادة الترقيم آمنة ولا تفقد أي تقييم أو جلسة. */
function compactSpecialNumbers() {
  const mine = (STATE.myRecipes || []).filter(r => r.special).sort((a, b) => a.special - b.special);
  if (!mine.length) return;
  const builtIn = DATA.recipes.filter(r => r.special).map(r => r.special);
  let next = (builtIn.length ? Math.max(...builtIn) : 0) + 1, changed = false;
  mine.forEach(r => { if (r.special !== next) { r.special = next; changed = true; } next++; });
  if (changed) save(true);
}

function nextSpecialNo() {
  const used = new Set(DATA.recipes.filter(r => r.special).map(r => r.special)
    .concat((STATE.myRecipes || []).map(r => r.special || 0)));
  // fill the first gap left by a deleted recipe rather than always taking max+1
  let n = 1;
  while (used.has(n)) n++;
  return n;
}
const CATEGORIES = [...new Set(DATA.recipes.map(r => r.category))];
const CAT_COLOR = {
  'القهوة والحلويات': 'var(--cat-coffee)', 'الزهرية والآسيوية': 'var(--cat-floral)',
  'Luxury': 'var(--cat-luxury)', 'التوتية': 'var(--cat-berry)', 'الاستوائية': 'var(--cat-tropical)',
  'الصيفية': 'var(--cat-summer)', 'الشتوية': 'var(--cat-winter)', 'الكريمية': 'var(--cat-creamy)',
  'الحلوى': 'var(--cat-candy)', 'Signature': 'var(--cat-signature)',

};

  let cat = CATEGORIES.find(c => c === GUESS[domFam]) || CATEGORIES[0];

  const inf = inferBowl(BUILD.picks);
  const draw = () => {
  sBody.innerHTML = `

   <div class="sh-sub"><span class="sub-badge">خاص ${no}</span><span>من تصميمك</span></div>

   <div class="grp"><h4>الاسم</h4>

     <div class="src" style="margin-top:8px"><span>الرقم تلقائي — الاسم لك.</span></div>

     <div class="note" style="padding:0;background:none">
       ${BUILD.picks.map(p => `<div class="pick" style="padding:7px 0">
         <span class="stripe" style="background:${famColor(p.f.family)}"></span>
         <span class="main"><span class="nm"><bdi>${p.f.name}</bdi></span>
           <span class="meta">${p.f.subfamily}</span></span>
         <span class="pct num">${p.pct}% · ${gramsFor(p.pct)}غ</span></div>`).join('')}
     </div>
     <div class="bowl-note" style="margin-top:10px">

     </div>
     ${t !== 100 ? `<div class="alert dup" style="margin-top:10px"><b>المجموع ليس 100%</b><p>يمكنك الحفظ كما هي وتعديلها لاحقاً.</p></div>` : ''}

      bowl: inf.bowl, minLo: inf.minLo, minHi: inf.minHi, setup: inf.setup,
      bowlG: STATE.settings.bowlG,

      sessions: [],
    };
    { const g = BUILD.genMeta;                      // وصفة وُلّدت: نوسمها ليُقاس نجاح المحرك
      if (g && mixSimilarity(BUILD.picks, g.items.map(i => ({ f: flavorById(i.id), pct: i.pct }))) >= 0.75)
        rec.gen = { mode: g.mode, parent: g.parent ? g.parent.name : null, at: Date.now() }; }

/* ---------- lightweight in-app toast ---------- */
/* detailed / compact list view — a per-device display preference */
function isCompact() { return !!(STATE.settings && STATE.settings.compactRows); }
function applyViewMode() { document.body.classList.toggle('compact', isCompact()); }
function viewToggleHTML() {
  const c = isCompact();
  return `<div style="display:flex;justify-content:flex-end;margin:0 0 8px"><div class="view-toggle" role="group" aria-label="طريقة العرض">
    <button type="button" data-rowview="full" class="${c ? '' : 'on'}">مفصّل</button>
    <button type="button" data-rowview="compact" class="${c ? 'on' : ''}">مختصر</button></div></div>`;
}
// one delegated listener: the lists are re-rendered constantly, so wiring
// each toggle instance would leak handlers or miss freshly drawn ones
document.addEventListener('click', ev => {
  // own attribute, not data-view: the library's flavours/compat tabs already
  // use data-view, and sharing it made those tabs silently switch this off
  const b = ev.target.closest && ev.target.closest('[data-rowview]');
  if (!b) return;

  const x = ratingsOf(s.key).find(y => y.ts >= s.start && y.ts - s.start < 6 * 36e5);

}

    const st = sessionStars(s); if (st == null || st < 4) return;
    if ((s.marks || []).some(m => COACH_BAD_MARKS.includes(m.k))) return;
    const r = allRecipes().find(x => RKEY(x) === s.key); if (!r) return;
    const it = itemsAt(r, s.start).filter(i => i.f && i.f.ceiling != null); if (!it.length) return;

    Object.values(STATE.ratings || {}).reduce((a, x) => a + x.length, 0) + '|' + ((editOf(RKEY(r)) || {}).ts || 0);
  if (_coachMemo.k === memoKey) return _coachMemo.v;

      .sort((a, b) => a.c - b.c)[0];

      steps = capped;

    } else if (own.some(x => (x.marks || []).some(m => ['دخان خفيف', 'تحسّنت بالنص'].includes(m.k) && m.m <= 20))
               && (!steps.length || steps[0].at > 10)) {

function sessionSteps(s, coach) {

  if (coach) coach.steps.forEach(x => {
    const t = `منحناك: ${x.to} فحمات الآن — هكذا كانت أغلب جلساتك الناجحة${coach.scoped ? ' بنفس حرارة هذه الخلطة' : ''}. ارفع فقط إن ضعف الدخان.`;

function coalEvidence() {
  const at = coalLevelAt;
  const rows = (STATE.sessions || []).filter(s => !s.manual && (s.minutes || 0) >= 30).map(s => {
    const x = ratingsOf(s.key).find(y => y.ts >= s.start && y.ts - s.start < 6 * 36e5);
    return { c: at(s, 30), st: x ? x.stars : null, khaf: (s.marks || []).some(m => m.k === 'الطعم خفّ') };

const verdictOf = key => { const a = avgOf(key); return a === null ? null : VERDICT[Math.round(a)]; };
/* الشارة على الكرت: نجوم النسخة الحالية فقط. نجوم على مكوّنات سابقة تظهر
   «نسخة سابقة» — حكم على خلطة لم تعد هي هذه. */
function starTag(r) {
  const k = RKEY(r), cur = meanStars(currentRatings(k)), all = avgOf(k);
  if (cur !== null) { const v = VERDICT[Math.round(cur)]; return `<span class="tagt v-${v.cls}">★ ${cur.toFixed(1)} · ${v.t}</span>`; }
  if (all !== null) return `<span class="tagt v-mid">★ ${all.toFixed(1)} · نسخة سابقة</span>`;
  return r.tested ? '<span class="tagt v-mid">مجرّبة</span>' : '';
}

/* concrete moves for a mix that under-performed */
/* كل وسم سريع يحمل الآن علاجاً بنيوياً، لا نصيحة عامة: التطبيق يقرأ وسوم
   جلساتك السابقة ويترجمها إلى نسبة محددة على نكهة محددة في هذه الوصفة. */
const CHIP_ACTION = {
  'الطعم خفّ':      { kind: 'lead', why: 'القائدة لم تحمل الخلطة حتى نهايتها' },
  'حدة أو حرق':     { kind: 'heat', why: 'تجاوز السقف الحراري لأدنى نكهة في الخلطة' },
  'تحسّنت بالنص':   { kind: 'heat', why: 'البداية كانت أبرد من اللازم لا أكثر' },
  'بارد زيادة':     { kind: 'axis', axis: 'cool',  dir: -1, why: 'المنثول يخدّر بقية الطبقات' },
  'حلو زيادة':      { kind: 'axis', axis: 'sweet', dir: -1, why: 'الحلاوة التراكمية تُتعب الحنك' },
  'حامض زيادة':     { kind: 'axis', axis: 'acid',  dir: -1, why: 'الحموضة تغطي الطبقات الأنعم' },
  'نكهة طاغية':     { kind: 'axis', axis: 'power', dir: -1, why: 'الأقوى ابتلع البقية بحكم سلّم الهيمنة' },
  'نكهة مبهمة':     { kind: 'axis', axis: 'density', dir: -1, why: 'تكديس كثيف من عائلة واحدة = ضبابية لا عمق' },
  'دخان خفيف':      { kind: 'rig',  why: 'إحكام أو ماء أو حرارة ناقصة — نادراً ما تكون النسب' },
  'سحب ثقيل':       { kind: 'rig',  why: 'كبس أو مستوى ماء — لا علاقة للنسب' },
  'دخان كثيف':      null,
  'متوازنة':        null,
  /* أسماء قديمة من تقييماتك السابقة — أُدمجت في الوسوم أعلاه لكنها تبقى
     مفهومة للمحرّك حتى لا يفقد سجلك تشخيصه بعد الاختصار. */
  'حدة مبكرة':      { kind: 'heat', why: 'حرارة لا نسب — عالجها بالفحم قبل أن تلمس الوصفة' },
  'حرق أو مرارة':   { kind: 'heat', why: 'تجاوز السقف الحراري لأدنى نكهة في الخلطة' },
  'انطفأت بسرعة':  { kind: 'lead', why: 'لا شيء يحمل الخاتمة بعد منتصف الجلسة' },
  'خدر اللسان':     { kind: 'axis', axis: 'cool', dir: -1, why: 'المنثول تجاوز عتبة التذوق' },
  'ثقيلة على الصدر': { kind: 'rig', why: 'تهوية أو حرارة — لا علاقة للنسب' },
};

/* «الطعم خفّ» حسب نسبة القائدة — من جلساتك الحيّة، بالخلطة كما دُخّنت يومها */
function fadeByLeader() {
  const rows = [];
  (STATE.sessions || []).forEach(s => {
    if (s.manual || (s.minutes || 0) < 30) return;
    const r = allRecipes().find(x => RKEY(x) === s.key); if (!r) return;
    const it = itemsAt(r, s.start); if (!it.length) return;
    const lead = it.reduce((a, b) => b.pct > a.pct ? b : a);
    rows.push({ lead: lead.pct, fade: (s.marks || []).some(m => m.k === 'الطعم خفّ') });
  });
  const pct = g => g.length ? Math.round(100 * g.filter(x => x.fade).length / g.length) : null;
  const lo = rows.filter(x => x.lead < 40), hi = rows.filter(x => x.lead >= 40);
  return lo.length >= 8 && hi.length >= 8 ? { lo: pct(lo), hi: pct(hi), nLo: lo.length, nHi: hi.length } : null;
}
/* ارفع القائدة إلى 45% وخذ الفرق من النكهات التي لا تسمعها أولاً، ثم الأصغر —
   كل مانحة تبقى 10% على الأقل. يعيد التعديلات بمجموع 100. */
function leadFix(items) {
  const lead = items.reduce((a, b) => b.pct > a.pct ? b : a);
  const cap = Math.min(lead.f.maxPct || 100, lead.f.hardCap || 100, 45);
  let need = Math.floor((cap - lead.pct) / STEP) * STEP;
  if (need < STEP) return { lead, moves: [], target: lead.pct };
  const hs = heardStats(), silent = new Set(hs ? hs.silent.map(x => x.f.id) : []);
  const donors = items.filter(i => i !== lead)
    .sort((a, b) => (silent.has(b.f.id) - silent.has(a.f.id)) || (a.pct - b.pct));
  const moves = [];
  for (const d of donors) {
    if (need <= 0) break;
    const take = Math.min(Math.max(0, d.pct - 10), need);
    if (take >= STEP) { moves.push({ id: d.f.id, name: d.f.name, pct: d.pct - take, take }); need -= take; }
  }
  return { lead, moves, target: lead.pct + moves.reduce((a, m) => a + m.take, 0) };
}

function learnedFixes(key) {
  const r = allRecipes().find(x => RKEY(x) === key); if (!r) return [];
  const rs = ratingsOf(key).filter(x => onCurrent(r, x.ts)); if (rs.length < 1) return [];
  const items = liveItems(r);
  // windowFor() and findBridgeSuggestion() both read BUILD.picks — the mix
  // currently open in the builder, which has nothing to do with the recipe
  // being analysed. Without this swap the suggested percentages are computed
  // against an unrelated mix, and can come out wrong or vanish entirely.
  const _savedPicks = BUILD.picks;
  BUILD.picks = items.map(i => ({ f: i.f, pct: i.pct }));
  try {
    return learnedFixesInner(key, r, items, rs);
  } finally {
    BUILD.picks = _savedPicks;
  }
}

function learnedFixesInner(key, r, items, rs) {
  const tally = {};
  rs.forEach(x => (x.chips || []).forEach(c => { tally[c] = (tally[c] || 0) + 1; }));
  const out = [];
  Object.keys(tally).sort((a, b) => tally[b] - tally[a]).forEach(chip => {
    const act = CHIP_ACTION[chip]; if (!act) return;
    const times = tally[chip];
    const seen = `«${chip}» ${times === 1 ? 'سُجّل' : times === 2 ? 'تكرر مرتين' : `تكرر ${times} مرات`}`;
    if (act.kind === 'heat' || act.kind === 'rig') {
      out.push({ t: `${seen} — ${act.why}. ${(CHIPS.find(c => c.k === chip) || {}).fix || ''}`, apply: null });
      return;
    }
    if (act.kind === 'lead') {
      const fx = leadFix(items), fb = fadeByLeader();
      const ev = fb ? ` في سجلك «الطعم خفّ» في ${fb.lo}% من جلسات القائدة تحت 40%، و${fb.hi}% حين تكون 40% فأكثر.` : '';
      if (fx.moves.length) {
        out.push({ t: `${seen} — ${act.why}: ${fx.lead.f.name} عند ${fx.lead.pct}% فقط.${ev} ارفعها إلى ${fx.target}% من حساب ${fx.moves.map(m => `${m.name} (−${m.take})`).join('، ')}.`,
          apply: [{ id: fx.lead.f.id, pct: fx.target }].concat(fx.moves.map(m => ({ id: m.id, pct: m.pct }))) });
      } else {
        const capped = fx.lead.pct >= Math.min(fx.lead.f.maxPct || 100, fx.lead.f.hardCap || 100) && fx.lead.pct < 45;
        out.push({ t: `${seen} — القائدة ${fx.lead.f.name} ${capped ? 'عند سقفها' : 'قوية هنا'} (${fx.lead.pct}%). إن كان الدخان كثيفاً فالقائدة نفسها قصيرة العمر — جرّب قائدة أطول عمراً؛ وإن ضعف الدخان أيضاً فنصف فحمة.`, apply: null });
      }
      return;
    }
    if (act.kind === 'phase') {
      const cur = phaseCoverage(r)[act.phase].has;
      if (cur >= 20) {
        const ev = coalEvidence();
        out.push({ t: `${seen} — القاع هنا ${cur}% وهو كافٍ، فالنسب ليست المشتبه الأول. أضف نصف فحمة عند أول خفوت${ev.khafMed ? ` (في سجلك يأتي عادةً حول الدقيقة ${ev.khafMed})` : ''}، ولا تستعجل الثالثة في النصف الأول.`, apply: null });
        return;
      }
      const cand = items.filter(i => servesPhase(i.f, act.phase))
        .sort((a, b) => a.pct - b.pct)[0];
      if (cand) {
        const target = Math.min(windowFor(cand.f, true).hi, cand.pct + 10);
        if (target > cand.pct) out.push({
          t: `${seen} — ${act.why}. ارفع ${cand.f.name} من ${cand.pct}% إلى ${target}% (القاع الآن ${cur}%).`,
          apply: { id: cand.f.id, pct: target } });
      } else {
        const b = findBridgeSuggestion();
        out.push({ t: `${seen} — ${act.why}. لا نكهة تصلح قاعاً هنا${b ? ` — أضف ${b.f.name} ${b.pct}%` : ''}.`, apply: null });
      }
      return;
    }
    const heavy = items.filter(i => i.f[act.axis] >= 4).sort((a, b) => b.pct - a.pct)[0];
    if (heavy) {
      const target = Math.max(windowFor(heavy.f, true).lo, heavy.pct - 5);
      if (target < heavy.pct) out.push({
        t: `${seen} — ${act.why}. أنزل ${heavy.f.name} من ${heavy.pct}% إلى ${target}%.`,
        apply: { id: heavy.f.id, pct: target } });
    }
  });
  return out.slice(0, 4);
}

function fixSuggestions(r) {
  const items = liveItems(r), out = [];
  const sw = items.reduce((s, i) => s + i.f.sweet * i.pct, 0) / 100;
  const co = items.reduce((s, i) => s + (i.f.cool >= 2 ? i.pct : 0), 0);
  const lead = items.reduce((a, b) => b.pct > a.pct ? b : a);
  const second = items.filter(i => i !== lead).sort((a, b) => b.pct - a.pct)[0];
  if (sw >= 4) out.push(`الحلاوة التراكمية ${sw.toFixed(1)} — أنزل ${lead.f.name} خمس درجات وارفع حمضياً مكانها.`);
  if (co > 10) out.push(`التبريد ${co}% — أنزله إلى 5% فالمنثول يخدّر بقية النكهات.`);
  if (second && lead.pct - second.pct < 10) out.push(`${lead.f.name} و${second.f.name} متقاربتان — وسّع الفارق ليظهر بطل واضح.`);
  const bottom = phaseCoverage(r)[2].has;
  if (!bottom && items.length >= 2) out.push('لا قاع طويل العمر — ارفع أطول نكهة عمراً فيها 5–10% بدل إضافة نكهة جديدة، أو تقبّلها جلسة أقصر.');
  const cool = items.filter(i => i.f.roles.includes('pureCool')).reduce((s, i) => s + i.pct, 0);
  if (!cool && co === 0 && sw >= 3.5) out.push('لا تبريد ولا حموضة تكسر الحلاوة — 5% مبرّد نقي أو حمضي خفيف يفتحها.');
  if (items.length >= 4) out.push(`${items.length} نكهات — العدد وحده ليس المشكلة (وصفات بأربع وخمس نجحت في سجلك)، لكن أي نكهة تحت 15% بلا دور واضح احذفها وأعطِ نسبتها للقائدة.`);
  const ceil = Math.min(...items.map(i => i.f.ceiling));
  const hot = items.filter(i => i.f.ceiling > ceil + 1);
  if (hot.length) out.push(`أدنى سقف حراري ${ceil} يحكم الجميع — ${hot[0].f.name} لن تُعطي كامل طاقتها هنا.`);
  const vols = items.map(i => i.f.volatility);
  if (Math.max(...vols) - Math.min(...vols) >= 3) out.push('فجوة تطايُر واسعة — نكهة ستموت قبل أن تستيقظ الأخرى؛ قارب بينها أو أضف جسراً.');
  const clash = items.some(a => items.some(b => a !== b && (DATA.familyMatrix[a.f.family] || {})[b.f.family] <= 2));
  if (clash && !items.some(i => i.f.roles.includes('bridge') || i.f.roles.includes('support')))
    out.push('عائلتان متباعدتان بلا جسر — 15–20% عنب أبيض أو فانيلا يلحمانهما (وليس قبل ذلك: الجسر بلا تصادم حشو).');
  checkRecipe(r).filter(i => i.sev !== 'y').forEach(i => out.push(i.t));
  if (!out.length) out.push('البنية سليمة — جرّب فحمة أقل أو حشواً أخف قبل تغيير النسب.');
  return out.slice(0, 6);
}

/* recipes that share most of their ingredients — flagged, never merged */
const TWINS = (() => {
  const out = {}, rs = DATA.recipes;
  for (let i = 0; i < rs.length; i++) for (let j = i + 1; j < rs.length; j++) {
    const A = new Set(rs[i].items.map(x => x.id)), B = new Set(rs[j].items.map(x => x.id));
    const inter = [...A].filter(x => B.has(x)).length;
    const jac = inter / new Set([...A, ...B]).size;
    if (jac >= 0.6) {
      const p = Math.round(jac * 100), ki = RKEY(rs[i]), kj = RKEY(rs[j]);
      (out[ki] = out[ki] || []).push({ k: kj, pctShared: p });
      (out[kj] = out[kj] || []).push({ k: ki, pctShared: p });
    }
  }
  return out;
})();
const ratingsOf = k => (STATE.ratings && STATE.ratings[k]) || [];
const avgOf = k => { const r = ratingsOf(k); return r.length ? r.reduce((s, x) => s + x.stars, 0) / r.length : null; };

function recipeItems(r) {
  return (r.items || []).map(i => ({
    f: flavorById(i.id) || { name: i.name || '?', family: 'base', subfamily: '' },
    pct: i.pct,
  }));
}

/* run the live rule engine over a stored recipe */
function checkRecipe(r) {
  const items = liveItems(r), saved = BUILD.picks, out = [];
  items.forEach((it, idx) => {
    BUILD.picks = items.filter((_, j) => j !== idx).map(x => ({ f: x.f, pct: x.pct }));
    evaluate(it.f).issues.forEach(is => { if (!out.some(o => o.t === is.t)) out.push(is); });
  });
  BUILD.picks = saved;
  return out;
}

/* which phases does this recipe actually cover? */
function phaseCoverage(r) {
  const items = liveItems(r);
  return PHASES.map(p => ({
    p, has: items.filter(i => servesPhase(i.f, PHASES.indexOf(p))).reduce((s, i) => s + i.pct, 0),
  }));
}

/* same maths, but over a live {f,pct} list instead of a saved recipe — lets
   the builder show phase balance while the mix is still being assembled,
   rather than only after it has been saved. */
function phaseCoverageOf(items) {
  return PHASES.map(p => ({
    p, has: items.filter(i => servesPhase(i.f, PHASES.indexOf(p))).reduce((s, i) => s + i.pct, 0),
  }));
}

/* =============================== LIST =============================== */
let rFilter = 'all', rQuery = '';
const rScreen = document.getElementById('screen-recipes');
const sesScreen = document.getElementById('screen-session');

const isHidden = k => !!(STATE.hidden || {})[k];
function toggleHidden(k) {
  STATE.hidden = STATE.hidden || {};
  if (STATE.hidden[k]) delete STATE.hidden[k]; else STATE.hidden[k] = 1;
  save(true);
}

function filteredRecipes() {
  return allRecipes().filter(r => {
    const hid = isHidden(RKEY(r));
    if (rFilter === 'hidden') { if (!hid) return false; } else if (hid) return false;
    if (rFilter === 'tested' && !r.tested && !ratingsOf(RKEY(r)).length) return false;
    if (rFilter === 'todo' && (r.tested || ratingsOf(RKEY(r)).length)) return false;
    if (rFilter === 'mine' && !r.mine && r.source !== 'mine') return false;
    if (rFilter === 'simple' && (r.items || []).length > 3) return false;
    if (rFilter === 'famous' && !r.famous) return false;
    const raw = rQuery.trim(), q = raw.toLowerCase();
    if (!q) return true;
    // الرقم يُطابَق كوحدة كاملة: كتابة "13" لا تجلب 130 ولا كل ما فيه ثلاثة عشر
    const digits = raw.replace(/[^0-9]/g, '');
    // كتابة «خاص» تقصر البحث على وصفاتك أنت، فلا تزاحمها أرقام الكتاب
    const wantsSpecial = raw.includes('خاص');
    if (digits) {
      if (r.special != null && String(r.special) === digits) return true;
      if (!wantsSpecial && r.no != null && String(r.no) === digits) return true;
    }
    if (wantsSpecial && r.special == null) return false;
    if (rNum(r).toLowerCase().includes(q)) return true;      // "#13" أو "خاص 2"
    if (r.name.toLowerCase().includes(q)) return true;
    if ((r.category || '').includes(raw)) return true;
    if (liveItems(r).some(i =>
        i.f.name.toLowerCase().includes(q) ||
        (i.f.subfamily || '').includes(raw) ||
        (i.f.brand || '').toLowerCase().includes(q) ||
        (FAM_AR[i.f.family] || '').includes(raw))) return true;
    return false;
  });
}

function renderRecipes() {
  const vis = allRecipes().filter(r => !isHidden(RKEY(r)));
  const counts = {
    all: vis.length,
    tested: vis.filter(r => r.tested || ratingsOf(RKEY(r)).length).length,
    todo: vis.filter(r => !r.tested && !ratingsOf(RKEY(r)).length).length,
    mine: vis.filter(r => r.mine || r.source === 'mine').length,
    simple: vis.filter(r => (r.items || []).length <= 3).length,
    famous: vis.filter(r => r.famous).length,
    hidden: allRecipes().filter(r => isHidden(RKEY(r))).length,
  };

  rScreen.innerHTML = `
    <div class="pin-search rec-pin"><div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="rq" type="search" placeholder="ابحث باسم الوصفة أو نكهة…" autocomplete="off" value="${rQuery}">
    </div></div>
    <div class="chips" style="margin-bottom:4px">
      ${[['all','الكل'],['tested','مجرّبة'],['todo','تستحق التجربة'],['famous','مشهورة عالمياً'],['simple','بسيطة ٢–٣'],['mine','من تصميمي'],['hidden','مخفية']]
        .map(([k,ar]) => `<button class="chip${rFilter===k?' on':''}" data-rf="${k}">${ar} <span class="n">${counts[k]}</span></button>`).join('')}
    </div>
    <div id="rBody"></div>`;

  document.getElementById('rq').oninput = e => { rQuery = e.target.value; renderRecipeList(); };
  rScreen.querySelectorAll('[data-rf]').forEach(b => b.onclick = () => { rFilter = b.dataset.rf; renderRecipes(); });
  renderRecipeList();
  watchPin(rScreen);
}

/* The list lives in its own container: typing re-renders only #rBody, so the
   search input is never replaced and the keyboard stays up. */
function renderRecipeList() {
  const body = document.getElementById('rBody'); if (!body) return;
  const list = filteredRecipes();
  const counts = { todo: allRecipes().filter(r => !r.tested && !ratingsOf(RKEY(r)).length).length };
  const cats = [...new Set(list.map(r => r.category || 'من تصميمي'))];
  cats.sort((a, b) => CATEGORIES.indexOf(a) - CATEGORIES.indexOf(b));

  body.innerHTML = `
    ${rFilter === 'famous' && !rQuery.trim() ? (() => {
      const m = missingForFamous(); if (!m.length) return '';
      return `<div class="card" style="margin-bottom:14px"><div class="card-eyebrow">ما يفتح لك وصفات مشهورة أكثر</div>
        ${m.map(x => `<div class="buy-line"><b><bdi>${x.f.name}</bdi></b>
          <span>تفتح ${x.n} ${x.n === 1 ? 'وصفة' : 'وصفات'}${(x.f.buy || [])[0] ? ` · <bdi>${x.f.buy[0]}</bdi>` : ''}</span></div>`).join('')}
      </div>`;
    })() : ''}
    ${rFilter === 'todo' && !rQuery.trim() ? (() => {
      const recs = recommendations(5);
      return recs.length ? `<div class="fam-head"><span class="bar" style="background:var(--ember)"></span>
        اخترتُ لك ${recs.length} <span class="count">من ${counts.todo}</span></div>
        ${recs.map(c => `<div class="flav pickd" data-ropen="${RKEY(c.r)}">
          <span class="stripe" style="background:var(--ember)"></span>
          <span class="main"><span class="nm"><span class="rno num">${rNum(c.r)}</span><bdi>${c.r.name}</bdi></span>
            ${recipeIngHTML(liveItems(c.r))}
            <span class="meta" style="color:var(--ember)">${whyPicked(c)}</span></span>
        </div>`).join('')}
        <div class="section-label">بقية ما لم تجرّبه</div>` : '';
    })() : ''}
    ${list.length ? cats.map(c => {
      const g = list.filter(r => (r.category || 'من تصميمي') === c);
      return `<div class="fam-head"><span class="bar" style="background:${catColor(c)}"></span>${c} <span class="count">${g.length}</span></div>`
        + g.map(rCard).join('');
    }).join('') : '<div class="empty">لا نتيجة مطابقة.</div>'}`;

  body.querySelectorAll('[data-ropen]').forEach(b => b.onclick = () => { clearSheetStack(); openRecipe(b.dataset.ropen); });
}

const rNum = r => r.special ? `خاص ${r.special}` : (r.no ? `#${r.no}` : '—');

function whyPicked(c) {
  const bits = [];
  if (c.r.famous) bits.push('وصفة مشهورة عالمياً');
  else if (liveItems(c.r).length <= 3) bits.push(`بسيطة — ${liveItems(c.r).length} نكهات فقط`);
  if (!c.short) bits.push('مخزونك يكفيها'); else bits.push(`ينقصك ${c.short}`);
  const untouched = liveItems(c.r).filter(i => invOf(i.f.id) && !invOf(i.f.id).lastUsed).length;
  if (untouched) bits.push(`${untouched} نكهة لم تفتحها بعد`);
  if (Object.keys(likedFlavorScores()).length) bits.push('قريبة من ذوقك المسجّل');
  return bits.slice(0, 3).join(' · ');
}

function recipeIngHTML(items) {
  const sorted = items.slice().sort((a, b) => b.pct - a.pct);
  const list = sorted.map(i => {
    const inv = invOf(i.f.id), out = inv && inv.remG <= 0;
    return `<span class="ing${out ? ' out' : ''}"${out ? ' title="نفدت"' : ''}><i style="background:${famColor(i.f.family)}"></i><bdi>${i.f.name}</bdi><b>${i.pct}%</b></span>`;
  }).join('');
  return `<span class="rc-ings"><span class="rc-list">${list}</span></span>`;
}

function copyRecipeText(r, items, avg, rs) {

/* البطاقة تُرسم على canvas بألوان التطبيق نفسها: أدق من لقطة الشاشة لأنها
   لا تلتقط شريط التبويبات ولا نصف الواجهة، وتخرج بدقة مضاعفة للعرض العالي. */
function shareRecipeImage(r, items, avg, rs) {
  const W = 800, PAD = 56, S = 2;
  const rowH = 54, headH = 210, footH = r.setup ? 130 : 70;
  const H = headH + items.length * rowH + footH;
  const c = document.createElement('canvas');
  c.width = W * S; c.height = H * S;
  const x = c.getContext('2d');
  x.scale(S, S);
  x.direction = 'rtl';
  const css = getComputedStyle(document.documentElement);
  const v = k => css.getPropertyValue(k).trim() || '#000';
  const ink = v('--ink'), soft = v('--ink-soft'), gold = v('--ember');

  x.fillStyle = v('--paper'); x.fillRect(0, 0, W, H);
  x.fillStyle = v('--paper-raised');
  x.fillRect(PAD - 20, PAD - 20, W - (PAD - 20) * 2, H - (PAD - 20) * 2);

  x.textAlign = 'right';
  x.fillStyle = gold; x.font = '600 20px Cairo, sans-serif';
  x.fillText('دليل المزّاج', W - PAD, PAD + 14);
  x.fillStyle = ink; x.font = '700 38px Cairo, sans-serif';
  x.fillText(r.name, W - PAD, PAD + 70);
  x.fillStyle = soft; x.font = '400 20px Cairo, sans-serif';
  x.fillText(`${rNum(r)} · ${r.category || 'من تصميمي'} · بول ${STATE.settings.bowlG}غ`, W - PAD, PAD + 104);

  let bx = PAD, by = PAD + 128;
  items.forEach(i => { const w = (W - PAD * 2) * i.pct / 100;
    x.fillStyle = famHex(i.f.family, css); x.fillRect(bx, by, w, 10); bx += w; });

  let y = headH + 20;
  items.forEach(i => {
    x.fillStyle = famHex(i.f.family, css); x.fillRect(W - PAD - 4, y - 22, 4, 30);
    x.fillStyle = ink; x.font = '600 24px Cairo, sans-serif';
    x.fillText(i.f.name, W - PAD - 18, y);
    x.textAlign = 'left'; x.fillStyle = gold; x.font = '700 24px Cairo, sans-serif';
    x.fillText(`${i.pct}%  ·  ${gramsFor(i.pct)}غ`, PAD, y);
    x.textAlign = 'right';
    y += rowH;
  });

  y += 6;
  if (r.setup) {
    x.fillStyle = soft; x.font = '400 18px Cairo, sans-serif';
    wrapRtl(x, r.setup, W - PAD, y, W - PAD * 2, 26); y += 56;
  }
  if (avg !== null) {
    x.fillStyle = gold; x.font = '700 22px Cairo, sans-serif';
    x.fillText(`★ ${avg.toFixed(1)} من 5 · ${rs.length} ${rs.length === 1 ? 'جلسة' : 'جلسات'}`, W - PAD, y);
  }

  c.toBlob(blob => {
    if (!blob) { toast('تعذّر توليد الصورة', 'warn'); return; }
    const file = new File([blob], `${r.name}.png`, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: r.name }).then(() => closeSheet()).catch(() => {});
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${r.name}.png`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('نُزّلت صورة الوصفة', 'ok'); closeSheet();
  }, 'image/png');
}

const famHex = (fam, css) => (css.getPropertyValue('--f-' + fam).trim() || '#C9A227');
function wrapRtl(x, text, rx, y, maxW, lh) {
  const words = text.split(' '); let line = '';
  words.forEach(w => {
    const t = line ? line + ' ' + w : w;
    if (x.measureText(t).width > maxW && line) { x.fillText(line, rx, y); y += lh; line = w; }
    else line = t;
  });
  if (line) x.fillText(line, rx, y);
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, text.length);
  try { document.execCommand('copy'); done(); }
  catch { toast('تعذّر النسخ تلقائياً', 'warn'); }
  ta.remove();
}
