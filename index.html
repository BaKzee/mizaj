          <div class="bowl-pick"><b>${bowlTypeOf(m.bowl).name}</b><span>${bowlTypeOf(m.bowl).note}</span></div>
        </div>
        <div style="display:flex;gap:10px;margin-top:18px">
          <button class="btn ghost" id="genBack" style="flex:1">الخيارات</button>
          <button class="btn solid" id="genUse" style="flex:1">افتحها في البناء</button>
        </div>`;
    }
    sBody.querySelectorAll('[data-gm]').forEach(b => b.onclick = () => { genMode = b.dataset.gm; opts = null; sel = null; GEN_SEEN.clear(); draw(); });
    sBody.querySelectorAll('[data-sel]').forEach(b => b.onclick = () => { sel = +b.dataset.sel; draw(); sBody.scrollTop = 0; });
    const g1 = document.getElementById('genGo'); if (g1) g1.onclick = go;
    const gb = document.getElementById('genBack'); if (gb) gb.onclick = () => { sel = null; draw(); };
    const g3 = document.getElementById('genUse');
    if (g3) g3.onclick = () => {
      const items = opts[sel].picks;
      BUILD.picks = items.map(i => ({ f: i.f, pct: i.pct })); BUILD.genSeed = null; BUILD.genMeta = genMetaOf(items); save();
      closeSheet(); goTo('build'); renderBuild();
      toast('افتحها وعدّلها كما تشاء', 'ok');
    };
  };
  const go = () => {
    const o = generateOptions(genMode, null, 4);
    legacy = false;
    if (o && o.length) opts = o.map(c => ({ ...c, picks: optToPicks(c) }));
    else if (o) opts = [];                                  // يوجد سجل لكن لا نسخة ممكنة بالمخزون
    else {                                                  // لا سجل كافٍ: خلطة من الصفر بصراحة
      legacy = true; const one = generateFromTasteScratch(genMode); if (one) one.scratch = true;
      opts = one ? [{ items: one, picks: Object.assign(one, { near: null }) }] : [];
    }
    sel = null; draw();
  };
  draw();
  scrim.classList.add('on'); sheet.classList.add('on'); document.body.style.overflow = 'hidden';
}

function buyHTML() {
  const shopBanner = `<button class="btn ghost" id="lShop" style="width:100%;margin-bottom:12px;padding:10px 0;font-size:13px">افتح قائمة الشراء الذكية</button>`;
  const inv = DATA.flavors.map(f => ({ f, i: invOf(f.id), t: turnover(f.id), left: monthsLeft(f.id) }));
  const used = inv.filter(x => x.i.usedG > 0);
  if (!used.length) return shopBanner + `<div class="empty">لا استهلاك مسجّل بعد.<br>هذه اللوحة تُبنى من جلساتك الفعلية — كل جلسة تسجّلها تجعلها أدق.<br><br>سجّل 3–4 جلسات وستبدأ الأرقام بالظهور.</div>`;

  const top = used.slice().sort((a, b) => b.i.usedG - a.i.usedG).slice(0, 8);
  const soon = used.filter(x => x.left !== null && x.left <= 2).sort((a, b) => a.left - b.left);
  const idle = inv.filter(x => !x.i.usedG || (daysSince(x.i.lastUsed) || 999) >= 60)
    .sort((a, b) => (b.i.remG) - (a.i.remG));

  // gaps: how each family's share of use compares with its share of shelf
  const famUse = {}, famOwn = {};
  inv.forEach(x => {
    famUse[x.f.family] = (famUse[x.f.family] || 0) + x.i.usedG;
    famOwn[x.f.family] = (famOwn[x.f.family] || 0) + 1;
  });
  const totUse = Object.values(famUse).reduce((a, b) => a + b, 0) || 1;
  const gaps = FAM.map(k => ({
    k, usePct: Math.round(famUse[k] / totUse * 100),
    own: famOwn[k] || 0, ownPct: Math.round((famOwn[k] || 0) / DATA.flavors.length * 100),
  })).map(g => ({ ...g, delta: g.usePct - g.ownPct })).sort((a, b) => b.delta - a.delta);

  const buyList = soon.filter(x => x.t > 0)
    .concat(gaps.filter(g => g.delta >= 8).flatMap(g =>
      used.filter(x => x.f.family === g.k).sort((a, b) => b.t - a.t).slice(0, 1)))
    .filter((x, i, a) => a.findIndex(y => y.f.id === x.f.id) === i).slice(0, 8);

  return shopBanner + `
    <div class="note" style="margin-bottom:14px">كل رقم هنا مقاس من ${STATE.sessions.length} ${STATE.sessions.length === 1 ? 'جلسة' : 'جلسة'} سجّلتها — لا تقدير.</div>

    ${buyList.length ? `<div class="section-label">قائمة الشراء الموصى بها</div>
      ${buyList.map(x => `<div class="flav" data-lflav="${x.f.id}">
        <span class="stripe" style="background:${famColor(x.f.family)}"></span>
        <span class="main"><span class="nm"><bdi>${x.f.name}</bdi></span>
          <span class="meta">${x.left !== null && x.left <= 2 ? `يكفي ${x.left} شهر` : 'عالية الدوران'} · ${x.t}غ/شهر · باقٍ ${Math.round(x.i.remG)}غ</span></span>
        <span class="pct num">${invPct(x.f.id)}%</span></div>`).join('')}` : ''}

/* one confirmation sheet for every destructive action */
function confirmSheet(title, body, label, onYes) {
  sBody.innerHTML = `
   <div class="sh-title">${title}</div>
   <div class="grp"><div class="alert ban"><p>${body}</p></div></div>
   <div style="display:flex;gap:10px;margin-top:16px">
     <button class="btn ghost" id="cfNo">تراجع</button>
     <button class="btn solid" id="cfYes" style="background:var(--danger);border-color:var(--danger)">${label}</button>
   </div>`;
  scrim.classList.add('on'); sheet.classList.add('on'); document.body.style.overflow = 'hidden';
  document.getElementById('cfNo').onclick = () => sheetStack.length ? sheetGoBack() : closeSheet();
  document.getElementById('cfYes').onclick = () => { onYes(); closeSheet(); };
}

function confirmDelete(key) {
  const r = allRecipes().find(x => RKEY(x) === key); if (!r) return;
  const n = ratingsOf(key).length, s = (STATE.sessions || []).filter(x => x.key === key).length;
  confirmSheet('حذف الوصفة',
    `«${r.name}» ستُحذف${n || s ? `، ومعها ${n} تقييم و${s} جلسة مسجّلة` : ''}. يمكنك التراجع خلال ثوانٍ.`,
    'احذف', () => {
      // snapshot every piece the delete touches, including the recipe's own
      // position in myRecipes, so "تراجع" restores it exactly as it was —
      // ratings, sessions, edits and special number included.
      const idx = (STATE.myRecipes || []).findIndex(x => x.id === r.id);
      const snap = {
        idx,
        rec: idx >= 0 ? STATE.myRecipes[idx] : null,
        ratings: (STATE.ratings || {})[key],
        edits: (STATE.edits || {})[key],
        sessions: (STATE.sessions || []).filter(x => x.key === key),
      };

      STATE.myRecipes = (STATE.myRecipes || []).filter(x => x.id !== r.id);
      delete (STATE.ratings || {})[key];
      delete (STATE.edits || {})[key];
      STATE.sessions = (STATE.sessions || []).filter(x => x.key !== key);
      compactSpecialNumbers();
      save(true); renderRecipes(); renderHome(); renderLog();

      toastUndo(`حُذفت «${r.name}»`, () => {
        if (snap.rec) {
          STATE.myRecipes = STATE.myRecipes || [];
          const at = snap.idx >= 0 && snap.idx <= STATE.myRecipes.length ? snap.idx : STATE.myRecipes.length;
          STATE.myRecipes.splice(at, 0, snap.rec);
        }
        if (snap.ratings) { STATE.ratings = STATE.ratings || {}; STATE.ratings[key] = snap.ratings; }
        if (snap.edits) { STATE.edits = STATE.edits || {}; STATE.edits[key] = snap.edits; }
        if (snap.sessions.length) STATE.sessions = (STATE.sessions || []).concat(snap.sessions);
        compactSpecialNumbers();
        save(true); renderRecipes(); renderHome(); renderLog();
        toast(`استُعيدت «${r.name}»`, 'ok');
      });
    });
}

  const draw = () => {
    sBody.innerHTML = `
     <div class="sh-title">تعديل جلسة ${idx + 1}</div>

     <div class="grp"><h4>النجوم</h4>
       <div class="star-pick">${[1,2,3,4,5].map(n => `<button data-star="${n}" class="${n <= stars ? 'on' : ''}">★</button>`).join('')}</div>
       ${stars ? `<div class="src" style="margin-top:8px"><span class="tagt v-${VERDICT[stars].cls}">${VERDICT[stars].t}</span></div>` : ''}
     </div>
     <div class="grp"><h4>التاريخ</h4>
       <div class="search"><input id="rDate" type="date" style="padding-inline-start:14px"
         value="${new Date(x.ts).toISOString().slice(0,10)}"></div></div>
     <div class="grp"><h4>ما لاحظته</h4>
       ${CHIP_GROUPS.map(g => `<div class="chip-group-lbl">${g}</div>
         <div class="chip-grid">${CHIPS.filter(c => c.g === g).map(c =>
           `<button class="qchip ${picked.has(c.k) ? 'on' : ''}" data-pick="${c.k}">${c.k}</button>`).join('')}</div>`).join('')}</div>
     <div class="grp"><h4>ملاحظة</h4>
       <div class="search"><input id="rNote" type="text" style="padding-inline-start:14px" value="${(x.note || '').replace(/"/g,'&quot;')}"></div></div>
     <div style="display:flex;gap:10px;margin-top:18px">
       <button class="btn ghost" id="rDel" style="color:var(--danger)">احذف الجلسة</button>
       <button class="btn solid" id="rOk">احفظ</button>
     </div>`;
    sBody.querySelectorAll('[data-star]').forEach(b => b.onclick = () => { stars = +b.dataset.star; draw(); });
    sBody.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
      const k = b.dataset.pick; picked.has(k) ? picked.delete(k) : picked.add(k); draw();
    });
    document.getElementById('rDel').onclick = () => { pushSheetView(() => openRatingEdit(key, idx)); confirmSheet('حذف التقييم',
      `جلسة ${idx + 1} (${x.stars} ★) ستُحذف من سجل هذه الوصفة.`, 'احذف', () => {
        const gone = STATE.ratings[key][idx];
        STATE.ratings[key].splice(idx, 1);
        if (!STATE.ratings[key].length) delete STATE.ratings[key];
        // the paired session row is what makes the recipe still read as "مجرّبة",
        // so it goes with the rating it was created alongside
        if (gone) {
          const si = (STATE.sessions || []).findIndex(s => s.key === key && Math.abs((s.end || s.start) - gone.ts) < 6e4);
          if (si > -1) STATE.sessions.splice(si, 1);
        }
        save(true); openRecipe(key); renderLog(); renderHome(); renderRecipes(); toast('حُذفت الجلسة وتقييمها');
      }); };
    document.getElementById('rOk').onclick = () => {
      const d = document.getElementById('rDate').value;
      x.stars = stars;
      x.ts = d ? new Date(d + 'T12:00:00').getTime() : x.ts;
      x.chips = [...picked];
      x.fix = [...picked].map(k => (CHIPS.find(c => c.k === k) || {}).fix).filter(Boolean).join(' ');
      x.note = (document.getElementById('rNote').value || '').trim();
      STATE.ratings[key].sort((a, b) => a.ts - b.ts);
      save(true); openRecipe(key); renderLog(); renderHome(); toast('حُدّث التقييم', 'ok');
    };
  };
  draw();
  scrim.classList.add('on'); sheet.classList.add('on'); document.body.style.overflow = 'hidden';
}

function openWhereUsed(fid) {
  const f = DATA.flavors.find(x => x.id === fid); if (!f) return;

  const blocked = list.filter(r => !canMakeNow(r).ok);
  sBody.innerHTML = `

      return `<div class="flav" data-wopen="${RKEY(r)}">
        <span class="stripe" style="background:${catColor(r.category || 'من تصميمي')}"></span>
        <span class="main"><span class="nm"><span class="rno num">${rNum(r)}</span><bdi>${r.name}</bdi></span>

/* (7) مقارنة وصفتين: الفرق وحده هو ما يستحق العرض */
function openCompare(keyA) {
  const A = allRecipes().find(x => RKEY(x) === keyA); if (!A) return;
  let keyB = null;
  const draw = () => {
    const B = keyB ? allRecipes().find(x => RKEY(x) === keyB) : null;
    const iA = liveItems(A), iB = B ? liveItems(B) : [];
    const ids = [...new Set([...iA, ...iB].map(i => i.f.id))];
    const pctOf = (arr, id) => (arr.find(i => i.f.id === id) || {}).pct || 0;
    sBody.innerHTML = `
      <div class="sh-title">قارن مع <bdi>${A.name}</bdi></div>
      <div class="sh-sub"><span>${B ? 'الفروق فقط' : 'اختر وصفة للمقارنة'}</span></div>
      ${!B ? `<div class="search" style="margin-bottom:10px">
          <input id="cmpQ" type="search" placeholder="ابحث عن وصفة…" style="padding-inline-start:14px" autocomplete="off"></div>
        <div id="cmpList"></div>`
      : `<div class="grp"><div class="cmp-head"><span><bdi>${A.name}</bdi></span><span><bdi>${B.name}</bdi></span></div>
        ${ids.map(id => { const a = pctOf(iA, id), b = pctOf(iB, id);
          const f = (iA.concat(iB)).find(i => i.f.id === id).f;
          const same = a === b;
          return `<div class="cmp-row ${same ? '' : 'diff'}">
            <span class="cmp-a num">${a ? a + '%' : '—'}</span>
            <span class="cmp-n"><span class="dot" style="background:${famColor(f.family)}"></span><bdi>${f.name}</bdi></span>
            <span class="cmp-b num">${b ? b + '%' : '—'}</span></div>`; }).join('')}
        </div>
        <div class="grp"><h4>الخلاصة</h4>
          ${(() => {
            const only = ids.filter(id => !pctOf(iA, id) || !pctOf(iB, id)).length;
            const moved = ids.filter(id => pctOf(iA, id) && pctOf(iB, id) && pctOf(iA, id) !== pctOf(iB, id)).length;
            const cA = recipeCost(A), cB = recipeCost(B);
            return `<div class="tier ${only || moved ? 'y' : ''}"><span class="sw"></span><span class="t">
              ${only ? `${only} نكهة تخصّ إحداهما فقط` : 'نفس النكهات'}${moved ? ` · ${moved} نسبة مختلفة` : ''}.
              ${cA.complete && cB.complete ? `التكلفة: ${cA.total.toFixed(1)} مقابل ${cB.total.toFixed(1)}.` : ''}
            </span></div>`; })()}
          <button class="btn ghost" id="cmpAgain" style="width:100%;margin-top:10px">قارن بوصفة أخرى</button>
        </div>`}`;
    if (!B) {
      const render = q => {
        const el = document.getElementById('cmpList');
        const list = allRecipes().filter(r => RKEY(r) !== keyA &&
          (!q || r.name.toLowerCase().includes(q.toLowerCase()))).slice(0, 30);
        el.innerHTML = list.map(r => `<div class="flav" data-cmp="${RKEY(r)}">
          <span class="stripe" style="background:${catColor(r.category || 'من تصميمي')}"></span>
          <span class="main"><span class="nm"><span class="rno num">${rNum(r)}</span><bdi>${r.name}</bdi></span>
            <span class="meta">${(r.category || 'من تصميمي')}</span></span></div>`).join('')
          || '<div class="empty">لا نتيجة.</div>';
        el.querySelectorAll('[data-cmp]').forEach(b => b.onclick = () => { keyB = b.dataset.cmp; draw(); });
      };
      document.getElementById('cmpQ').oninput = e => render(e.target.value);
      render('');
    } else document.getElementById('cmpAgain').onclick = () => { keyB = null; draw(); };
  };
  draw();
  scrim.classList.add('on'); sheet.classList.add('on'); document.body.style.overflow = 'hidden';
}

     <div class="grp"><h4>تصحيح يدوي</h4>

       <div class="src" style="margin-top:6px"><span>يقبل أي كمية — لو عندك أكثر من علبة مفتوحة اجمعها هنا يدوياً.</span></div></div>
     </div>
     <div class="grp"><h4>سعر العلبة (اختياري)</h4>
       <div class="search"><input id="tinPrice" type="number" min="0" step="0.5" placeholder="مثال: 45" value="${i.price || ''}" style="padding-inline-start:14px"></div>
       <div class="note" style="margin-top:8px">يُستخدم لحساب تكلفة كل جلسة. اتركه فارغاً إن لم يهمّك.</div>
       <div class="src" style="margin-top:8px"><span>لو وزنت العلبة فعلياً واختلف الرقم.</span></div></div>
     <div style="display:flex;gap:10px;margin-top:18px">
       <button class="btn ghost" id="tinOk">احفظ التصحيح</button>
       <button class="btn solid" id="tinNew">اشتريت علبة جديدة</button>
     </div>`;
    sBody.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => { pack = +b.dataset.pk; draw(); });
    document.getElementById('tinNew').onclick = () => { refill(id, pack); openTin(id, fromList); renderLog(); toast(`عبوة ${pack}غ جديدة`, 'ok'); };
    document.getElementById('tinOk').onclick = () => {
      i.packG = pack;
      i.remG = Math.max(0, +document.getElementById('tinRem').value || 0);
      // consumed is derived relative to the declared pack size only when the
      // remainder is within one pack; beyond that (multiple tins on hand)
      // usage tracking keeps its last known value instead of going negative
      i.usedG = i.remG <= pack ? Math.max(0, pack - i.remG) : (i.usedG || 0);
      const pr = parseFloat(document.getElementById('tinPrice').value);
      i.price = isFinite(pr) && pr > 0 ? pr : null;
      save(true); back(); renderList(); renderLog(); toast('حُدّث المخزون', 'ok');
    };
  };
  draw();
  scrim.classList.add('on'); sheet.classList.add('on'); document.body.style.overflow = 'hidden';
}

function openAddFlavor() {
  let fam = 'base', pack = 200, nameVal = '', brandVal = '', subVal = '', matchedTemplate = null;
  const draw = () => {
    sBody.innerHTML = `
     <div class="sh-title">نكهة جديدة</div>
     <div class="sh-sub">تُضاف لمكتبتك ويعرفها المحرك فوراً</div>
     <div class="grp"><h4>الاسم والبراند</h4>
       <div class="search" style="margin-bottom:2px"><input id="nfName" type="text" placeholder="الاسم بالإنجليزية" style="padding-inline-start:14px" value="${nameVal.replace(/"/g,'&quot;')}" autocomplete="off"></div>
       <div id="nfSuggest"></div>
       ${matchedTemplate ? `<div class="src" style="margin:8px 0 0"><span style="color:var(--ok)">✓ مطابقة لـ«${matchedTemplate.name}» — كل البيانات نُسخت، عدّل أي حقل إذا حبيت</span></div>` : ''}
       <div class="search" style="margin-top:9px"><input id="nfBrand" type="text" placeholder="البراند" style="padding-inline-start:14px" value="${brandVal.replace(/"/g,'&quot;')}"></div></div>

       <div class="chip-grid">${FAM.map(k => `<button class="qchip ${fam === k ? 'on' : ''}" data-nf="${k}">${FAM_AR[k]}</button>`).join('')}</div></div>
     <div class="grp"><h4>العائلة الطعمية</h4>
       <div class="search"><input id="nfSub" type="text" placeholder="مثال: مانجو وباشن" style="padding-inline-start:14px" value="${subVal.replace(/"/g,'&quot;')}"></div></div>
     <div class="grp"><h4>المحاور</h4>
       ${[['power','القوة'],['sweet','الحلاوة'],['acid','الحموضة'],['cool','التبريد'],['density','الكثافة']]
         .map(([k,ar]) => `<div class="axis"><span class="lbl">${ar}</span>
           <span class="chip-grid" style="flex:1">${[1,2,3,4,5].map(n =>
             `<button class="qchip nfax" data-ax="${k}" data-v="${n}" style="padding:5px 10px">${n}</button>`).join('')}</span></div>`).join('')}
     </div>
     <div class="grp"><h4>حجم العبوة</h4>
       <div class="chip-grid">${[50,100,200,250].map(g => `<button class="qchip ${pack === g ? 'on' : ''}" data-pk="${g}">${g}غ</button>`).join('')}</div></div>
     <div style="display:flex;gap:10px;margin-top:18px">
       <button class="btn ghost" id="nfNo">إلغاء</button>
       <button class="btn solid" id="nfOk">أضف</button>
     </div>`;
    const vals = matchedTemplate
      ? { power: matchedTemplate.power, sweet: matchedTemplate.sweet, acid: matchedTemplate.acid, cool: matchedTemplate.cool, density: matchedTemplate.density }
      : { power: 3, sweet: 3, acid: 2, cool: 0, density: 3 };
    const paint = () => sBody.querySelectorAll('.nfax').forEach(b =>
      b.classList.toggle('on', +b.dataset.v === vals[b.dataset.ax]));
    paint();
    sBody.querySelectorAll('.nfax').forEach(b => b.onclick = () => { vals[b.dataset.ax] = +b.dataset.v; paint(); });
    sBody.querySelectorAll('[data-nf]').forEach(b => b.onclick = () => { fam = b.dataset.nf; draw(); });
    sBody.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => { pack = +b.dataset.pk; draw(); });
    document.getElementById('nfNo').onclick = closeSheet;

    const nameInput = document.getElementById('nfName');
    const suggestBox = document.getElementById('nfSuggest');
    nameInput.oninput = e => {
      nameVal = e.target.value;
      if (matchedTemplate && matchedTemplate.name !== nameVal) matchedTemplate = null;
      const q = nameVal.trim().toLowerCase();
      if (q.length < 2) { suggestBox.innerHTML = ''; return; }
      const matches = DATA.flavors.concat((DATA.external || []).filter(isExternal)).filter(f => f.name.toLowerCase().includes(q)).slice(0, 5);
      suggestBox.innerHTML = matches.length ? `<div class="nf-suggest">${matches.map(f => `
        <div class="nf-sug-row" data-sug="${f.id}">
          <span class="stripe" style="background:${famColor(f.family)}"></span>
          <span class="main"><span class="nm"><bdi>${f.name}</bdi></span><span class="meta"><bdi>${f.brand}</bdi> · ${f.subfamily}</span></span>
        </div>`).join('')}</div>` : '';
      suggestBox.querySelectorAll('[data-sug]').forEach(row => row.onclick = () => {
        const f = flavorById(row.dataset.sug); if (!f) return;
        matchedTemplate = f; nameVal = f.name; brandVal = f.brand; subVal = f.subfamily; fam = f.family;
        draw();
      });
    };
    nameInput.onblur = () => setTimeout(() => { if (suggestBox) suggestBox.innerHTML = ''; }, 150);
    document.getElementById('nfBrand').oninput = e => { brandVal = e.target.value; };
    document.getElementById('nfSub').oninput = e => { subVal = e.target.value; };

    document.getElementById('nfOk').onclick = () => {
      const name = (document.getElementById('nfName').value || '').trim();
      if (!name) { toast('الاسم مطلوب.', 'warn'); return; }
      // نكهة من وصفة مشهورة تحتفظ بمعرّفها، فتُفتح وصفاتها تلقائياً
      const id = matchedTemplate && isExternal(matchedTemplate) ? matchedTemplate.id
        : 'u-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + Date.now().toString(36);
      const brand = (document.getElementById('nfBrand').value || '').trim() || '—';
      const subfamily = (document.getElementById('nfSub').value || '').trim() || FAM_AR[fam];
      const nf = matchedTemplate
        ? { ...matchedTemplate, id, name, brand, family: fam, subfamily, ...vals, userAdded: true, external: undefined }
        : {
            id, name, brand, family: fam, subfamily,
            ...vals, ceiling: 3, ceilingAr: 'متوسط', volatility: 3, volatilityAr: 'متوسط',
            duration: 3, durationAr: 'متوسطة', role: 'رئيسية', roles: ['main'], roleStrict: false,
            idealPct: 30, idealG: 6, minPct: 25, maxPct: 40, hardCap: null,
            official: '', officialConf: '', note: '', userAdded: true,
          };
      applyBridgeRole(nf);
      DATA.flavors.push(nf);
      STATE.userFlavors = (STATE.userFlavors || []).concat([nf]);
      STATE.inventory[id] = { packG: pack, remG: pack, usedG: 0, uses: 0, firstUsed: null, lastUsed: null, purchases: [] };
      save(true); closeSheet(); renderChips(); renderList(); renderLog();
      toast(`أُضيفت «${name}»`, 'ok');
    };
  };
  draw();
  scrim.classList.add('on'); sheet.classList.add('on'); document.body.style.overflow = 'hidden';
}

const BACKEND_AR = { artifact: 'مساحة المعاينة', indexeddb: 'IndexedDB داخل جهازك', memory: 'الذاكرة المؤقتة فقط' };

function openSettings() {
  const lows = DATA.flavors.filter(f => isLow(f.id));
  const gone = DATA.flavors.filter(f => isEmpty(f.id));
  const nearOut = lows.filter(f => !isEmpty(f.id));
  const used = DATA.flavors.filter(f => invOf(f.id).remG < invOf(f.id).packG).length;
  const d = daysSinceBackup();
  const warn = Backend.name === 'memory';

  sBody.innerHTML = `
   <div class="sh-title">التخزين والنسخ الاحتياطي</div>
   <div class="sh-sub">كل تعديل يُحفظ تلقائياً بعد جزء من الثانية</div>

   <div class="grp"><h4>العمل بلا إنترنت</h4>
     <div class="note">${
       location.protocol === 'file:'
         ? 'الملف مفتوح مباشرة من الجهاز — لا تثبيت ولا عمل خلفي. ارفعه على استضافة HTTPS ليصبح تطبيقاً قابلاً للتثبيت.'
         : ('serviceWorker' in navigator && navigator.serviceWorker.controller)

       : '<div class="src" style="margin-top:9px"><span style="color:var(--warn)">غير مُثبَّت — أضفه للشاشة الرئيسية من زر المشاركة في Safari</span></div>'}
   </div>

   <div class="grp"><h4>مكان الحفظ</h4>
     <div class="note">${BACKEND_AR[Backend.name]}${warn ? ' — <b style="color:var(--danger)">لن يبقى بعد إغلاق الصفحة.</b> بعد رفع التطبيق وتثبيته على الشاشة الرئيسية سينتقل تلقائياً إلى التخزين الدائم.' : ' — يبقى بعد إغلاق التطبيق وبلا إنترنت.'}</div>

   </div>

       <div class="box"><div class="k">نكهات مفتوحة</div><div class="v num">${used} / ${DATA.flavors.length}</div></div>
       <div class="box"><div class="k">قاربت النفاد</div><div class="v num" style="${lows.length ? 'color:var(--warn)' : ''}">${lows.length}</div></div>
     </div>
     ${lows.length ? `<div class="alert dup" style="margin-top:10px"><b>تحت ${STATE.settings.lowPct}%</b><p>${lows.map(f => `<bdi>${f.name}</bdi>`).join(' · ')}</p></div>` : ''}

document.getElementById('settingsBtn').onclick = () => { clearSheetStack(); openSettings(); };

/* ---------- persist the build draft, restore it on load ---------- */
function saveDraft(){
  STATE.draft = BUILD.picks.length ? BUILD.picks.map(p=>({id:p.f.id,pct:p.pct})) : null;
  save();
}
const _rb = renderBuild;
renderBuild = function(){ _rb(); saveDraft(); };

/* boot sequence — bounded, so a stuck load (blocked IndexedDB connection,
   a rare WebKit storage hang, etc.) can never leave the app on a silent
   blank screen forever. The UI always appears within BOOT_TIMEOUT_MS;
   if the real data is still loading in the background, it quietly
   re-renders once that finishes. */
const BOOT_TIMEOUT_MS = 4000;
let _bootRendered = false;

function finishBoot(){
  // each step runs in isolation: if real saved data trips a bug in ONE
  // step (e.g. a malformed session, an old inventory entry, a recipe id
  // that no longer resolves), the others still run — most importantly
  // renderHome(), which is what replaces the static loading skeleton.
  // A failure here used to silently abort everything after it, leaving
  // the app stuck on the skeleton forever with zero visible error.
  const step = (name, fn) => {
    try { fn(); }
    catch (e) { console.error('finishBoot: "' + name + '" failed —', e); }
  };

  step('viewMode', applyViewMode);
  step('draft', () => {
    if (STATE.draft) {
      BUILD.picks = STATE.draft
        .map(d => ({ f: DATA.flavors.find(x => x.id === d.id), pct: d.pct }))
        .filter(p => p.f);
    }
    STATE.ratings = STATE.ratings || {};
  });
  step('renderBuild', renderBuild);
  step('renderList', renderList);
  step('userFlavors merge', () => {
    STATE.edits = STATE.edits || {};
    (STATE.userFlavors || []).forEach(f => { if (!DATA.flavors.some(x => x.id === f.id)) DATA.flavors.push(f); });
  });
  step('applyBridgeRolesToLibrary', applyBridgeRolesToLibrary);
  step('applyMeasured', applyMeasured);
  step('coachSig', () => { if (!STATE.meta.coachSig) STATE.meta.coachSig = coachSigAll(); });
  step('compactSpecialNumbers', compactSpecialNumbers);
  step('renderChips', renderChips);
  step('renderRecipes', renderRecipes);
  step('session render', () => { if (STATE.session) { renderSession(); renderTabs(); } });
  step('renderHome', renderHome);
  step('renderLog', renderLog);
  step('updateBackupBadge', updateBackupBadge);
  // الجلسة هي الشاشة الرئيسية ما دامت جارية
  step('sessionFirst', () => { if (STATE.session) goTo('session'); });
}

let _hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { _hiddenAt = Date.now(); return; }
  if (STATE.session && _hiddenAt && Date.now() - _hiddenAt > 90e3) {
    try { renderSession(); goTo('session'); } catch (e) { console.error('sessionFirst on return', e); }
  }
});

const _bootPromise = bootStorage();
const _bootTimeout = new Promise(res => setTimeout(() => res('timeout'), BOOT_TIMEOUT_MS));

Promise.race([
  _bootPromise.then(() => 'loaded').catch(e => { console.error('bootStorage failed:', e); return 'failed'; }),
  _bootTimeout,
]).then(reason => {
  _bootRendered = true;
  if (reason !== 'loaded') {
    console.error('bootStorage did not complete in time (' + reason + ') — opening with defaults');
    toast('تعذّر تحميل بياناتك المحفوظة بسرعة — فُتح التطبيق مؤقتاً، وسيتحدّث تلقائياً إذا اكتمل التحميل بعد قليل', 'warn');
  }
  finishBoot();
  try { registerSW(); } catch (e) { console.error('registerSW failed:', e); }
});

/* if the real load only finishes after the timeout already opened the
   app with defaults, re-render once with the actual saved data. */
_bootPromise.then(() => { if (_bootRendered) finishBoot(); }).catch(() => {});

/* ---------- offline capability ---------- */
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol === 'file:') return;   // needs http(s); nothing to do locally
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (!w) return;
      w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) {
          toast('نسخة جديدة جاهزة — أعد فتح التطبيق', 'ok');
        }
      });
    });
  }).catch(() => {});
}
