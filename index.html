<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>دليل المزّاج</title>
<meta name="description" content="دليل احترافي لمزج نكهات الشيشة — يعمل بلا إنترنت.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1A1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المزّاج">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon-64.png" sizes="64x64">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#EDE4D3; --ink-soft:#A89D91; --paper:#1A1512; --paper-raised:#241D19;
  --ember:#C9A227; --ember-glow:rgba(201,162,39,.35);
  --line:rgba(237,228,211,.10); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
  --fill:rgba(237,228,211,.08);
  --f-base:#C9773F; --f-citrus:#A9AE47; --f-herbal:#6FA37C; --f-cooling:#47A6BE;
  --f-accent:#7086D6; --f-floral:#A47FD1; --f-berry:#C65E8C; --f-tropical:#D06A4E; --f-creamy:#B58A5E; --f-spice:#B5763C;
  --danger:#C97066; --warn:#E0964B; --ok:#7A8B5E; --note:#8AA3BC;
  --cat-coffee:#A9743F; --cat-floral:#A47FD1; --cat-luxury:#D4AF37; --cat-berry:#C65E8C;
  --cat-tropical:#D06A4E; --cat-summer:#4FBEC4; --cat-winter:#6C87D1; --cat-creamy:#B58A5E;
  --cat-candy:#D46FA0; --cat-signature:#8B4A52; --cat-spice:#B5763C;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{height:100%;background:var(--paper);color:var(--ink);
  font-family:"Cairo",-apple-system,BlinkMacSystemFont,"SF Arabic","SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  font-variant-numeric:tabular-nums;
  transition:background .25s ease,color .25s ease}
.display{font-family:"Aref Ruqaa","SF Arabic",serif}
bdi{unicode-bidi:isolate}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line)}
.wordmark{font-family:"Aref Ruqaa","SF Arabic",serif;font-size:23px;font-weight:700;color:var(--ember)}
.theme-toggle{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:var(--paper-raised);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer}
.theme-toggle svg{width:18px;height:18px}
.topbar-actions{display:flex;align-items:center;gap:8px}
.save-dot{width:7px;height:7px;border-radius:50%;background:transparent;transition:background .2s ease}
.save-dot.saving{background:var(--warn)}
.save-dot.saved{background:var(--ok)}
.save-dot.error{background:var(--danger)}

.screen{display:none;flex:1;padding:20px 20px 12px}
.screen.active{display:block;animation:rise .3s ease}
.screen.pad0{padding:0 0 12px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- home ---------- */
.greeting{margin-bottom:18px}
.greeting .display{font-size:26px;line-height:1.3}
.greeting p{color:var(--ink-soft);font-size:14px;margin-top:2px}
.card{background:var(--paper-raised);border:1px solid var(--line);border-radius:20px;
  padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.card-eyebrow{font-size:12px;color:var(--ink-soft);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.card-eyebrow svg{width:14px;height:14px;opacity:.8}
.card-title{font-size:16px;font-weight:600;margin-bottom:2px}
.card-sub{font-size:13px;color:var(--ink-soft)}
.stars{display:inline-flex;gap:2px;margin-inline-start:8px}
.stars svg{width:13px;height:13px}
.stars svg.on{fill:var(--ember);stroke:var(--ember)}
.stars svg.off{fill:none;stroke:var(--ink-soft);opacity:.5}
.ember-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:12px;background:var(--fill)}
.ember-bar span{height:100%}
.ember-bar span.dominant{box-shadow:inset 0 0 10px rgba(255,255,255,.25),0 0 10px var(--ember-glow)}
.ember-legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.ember-legend .tag{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px}
.ember-legend .dot{width:7px;height:7px;border-radius:50%}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-2 .card{margin-bottom:0}
.mini-icon{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--ember) 14%,transparent);color:var(--ember);margin-bottom:10px}
.mini-icon svg{width:16px;height:16px}
.section-label{font-size:13px;font-weight:600;color:var(--ink-soft);margin:22px 2px 10px}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick-tile{background:var(--paper-raised);border:1px solid var(--line);border-radius:16px;padding:14px 8px;
  display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .15s ease}
.quick-tile:active{transform:scale(.96)}
.quick-tile svg{width:20px;height:20px;color:var(--ember)}
.quick-tile span{font-size:11.5px;font-weight:500}

/* ---------- library ---------- */
/* only the search strip and the family headers stay pinned; the add button,
   the flavours/compat tabs and the family chips scroll away with the list */
.lib-head{padding:0 20px 10px;border-bottom:1px solid var(--line)}
.pin-search{position:sticky;top:calc(env(safe-area-inset-top) + 64px);z-index:15;
  background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px)}
.pin-search.lib-pin{padding:14px 20px 0}
.pin-search.lib-pin .search{margin-bottom:9px}
.pin-search.rec-pin{margin:-20px -20px 10px;padding:14px 20px 10px}
.search{position:relative}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--ink-soft);pointer-events:none}
.search input{width:100%;padding:11px 38px 11px 14px;border-radius:13px;border:1px solid var(--line);
  background:var(--paper-raised);color:var(--ink);font-size:15px;font-family:inherit;outline:none}
.search input:focus{border-color:var(--ember)}
.search input::placeholder{color:var(--ink-soft);opacity:.75}
.chips{display:flex;gap:7px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 13px;border-radius:100px;border:1px solid var(--line);
  background:var(--paper-raised);color:var(--ink-soft);font-size:12.5px;font-weight:500;cursor:pointer;
  display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%}
.chip .n{opacity:.6;font-size:11px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on .n{opacity:.7}

.lib-body{padding:8px 20px 0}
.fam-head{display:flex;align-items:center;gap:8px;margin:18px 2px 9px;font-size:13px;font-weight:600}
.fam-head .bar{width:3px;height:14px;border-radius:2px}
.fam-head .count{color:var(--ink-soft);font-weight:500;font-size:12px}

.flav{background:var(--paper-raised);border:1px solid var(--line);border-radius:15px;
  padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px;
  transition:transform .12s ease}
.flav:active{transform:scale(.985)}
.flav .stripe{width:4px;align-self:stretch;border-radius:3px;flex:0 0 auto;position:relative;overflow:hidden}
/* sheen overlay: the stripe's own colour is set inline, so the gradient rides
   on a pseudo-element rather than fighting the inline background shorthand */
.flav .stripe::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 45%,rgba(0,0,0,.22) 100%)}

/* compact view: tighter rows, family/sub-family line dropped — but any
   warning or law explanation stays visible, it is never hidden for tidiness */
body.compact .flav{padding:8px 12px;margin-bottom:6px}
body.compact .flav .meta .sub{display:none}
body.compact .flav .meta:not(:has(.why)){display:none}
body.compact .flav .meta .why .sep{display:none}
body.compact .phase-line{margin-top:2px}

/* recipe ingredients under the name: each flavour as dot · name · share,
   strongest first */
.rc-ings{display:block;margin-top:6px}
.rc-list{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:11.5px;line-height:1.45;color:var(--ink-soft)}
.rc-list .ing{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.rc-list .ing i{width:6px;height:6px;border-radius:50%;flex:none}
.rc-list .ing b{font-weight:600;font-size:10.5px;color:color-mix(in srgb,var(--ink) 70%,var(--ink-soft))}
.rc-list .ing.out bdi{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--danger) 70%,transparent)}
.view-toggle{display:inline-flex;gap:2px;padding:2px;border-radius:100px;background:var(--fill);border:1px solid var(--line)}
.view-toggle button{border:0;background:none;color:var(--ink-soft);font:inherit;font-size:11.5px;font-weight:600;
  padding:4px 11px;border-radius:100px;cursor:pointer}
.view-toggle button.on{background:var(--paper-raised);color:var(--ember)}

/* family headers stay pinned under the top bar while scrolling a long list */
.fam-head{position:sticky;top:calc(env(safe-area-inset-top) + 64px);z-index:5;
  background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);padding:7px 2px;margin-inline:-2px}
/* the library already pins its own search/tabs/chips panel; its headers
   must stop beneath that panel, not slide in behind it */
#screen-library .fam-head,#screen-recipes .fam-head{top:calc(env(safe-area-inset-top) + 64px + var(--pin-h, 0px))}
.flav .main{flex:1;min-width:0}
.flav .nm{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.flav .nm .dup{font-size:10px;color:var(--warn);border:1px solid currentColor;border-radius:5px;padding:0 4px;font-weight:600}
/* the three-phase line sits under the flavour name: no box, just a hairline
   of colour-coded words. Cool blue → gold → warm amber mirrors the session's
   own arc, so the role reads at a glance without competing with the name. */
.phase-line{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:4px;
  font-size:10.5px;font-weight:600;letter-spacing:.15px;color:var(--ink-soft);line-height:1.4}
.phase-line .ph{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.phase-line .ph i{width:5px;height:5px;border-radius:50%;flex:none}
.phase-line .ph.muted{opacity:.55}
.phase-line .ph.muted i{background:var(--line)}
.stock-mark{font-size:10px;border:1px solid currentColor;border-radius:5px;padding:0 4px;font-weight:600;margin-inline-start:4px}
.stock-mark.out{color:var(--danger)}
.stock-mark.low{color:var(--warn)}
.flav .meta{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
.flav .pct{font-size:13px;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:50px 20px;line-height:1.7}

.segmented{display:flex;background:var(--fill);border-radius:11px;padding:3px;margin-top:11px}
.segmented button{flex:1;border:none;background:none;padding:8px 0;border-radius:9px;font-size:13px;
  font-weight:600;color:var(--ink-soft);font-family:inherit;cursor:pointer;transition:background .15s ease}
.segmented button.on{background:var(--paper-raised);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.matrix{display:grid;gap:3px;margin-top:2px}
.matrix .hcell{display:flex;align-items:center;justify-content:center}
.matrix .hcell i{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.matrix .cell{aspect-ratio:1;border-radius:6px;cursor:pointer;transition:transform .1s ease}
.matrix .cell:active{transform:scale(.88)}
.matrix-hint{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.6}

.law-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.law-card .head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.law-card .num{width:22px;height:22px;border-radius:50%;background:var(--ember);color:#fff;font-size:11px;
  font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.law-card .title{font-weight:600;font-size:14.5px}
.law-card .rule{font-size:13px;line-height:1.75;color:var(--ink)}
.law-card .allow{font-size:12px;color:var(--ok);margin-top:9px;display:flex;gap:6px;line-height:1.6}
.law-card .banlist{margin-top:8px}
.law-card .banlist div{font-size:11.5px;color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,transparent);
  border-radius:8px;padding:5px 9px;margin-top:4px;line-height:1.6}
.compat-score{font-size:30px;letter-spacing:4px;color:var(--ember)}
.sub-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;
  font-size:11.5px;font-weight:600;background:var(--fill);color:var(--ink-soft)}
.tiers{margin-top:4px}
.tier{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;margin-bottom:7px;
  font-size:12.5px;line-height:1.65;border:1px solid currentColor}
.tier .sw{width:9px;height:9px;border-radius:50%;background:currentColor;margin-top:5px;flex-shrink:0}
.tier b{display:block;font-size:12px;margin-bottom:2px}
.tier span.t{color:var(--ink)}
.tier.r{color:var(--danger)} .tier.o{color:var(--warn)} .tier.y{color:var(--note)}

.pick{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.pick:first-child{border-top:none}
.pick .stripe{width:3px;align-self:stretch;min-height:30px;border-radius:2px;flex-shrink:0}
.pick .main{flex:1;min-width:0}
.pick .nm{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.pick .lead{font-size:9.5px;color:var(--ember);border:1px solid currentColor;border-radius:5px;padding:0 4px;font-weight:700}
.pick .meta{font-size:11px;color:var(--ink-soft);display:block;margin-top:2px}
.stepper{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:4px}
.stepper button{width:38px;height:38px;border:none;border-radius:10px;background:var(--paper-raised);
  color:var(--ink);font-size:19px;font-family:inherit;cursor:pointer;line-height:1;
  transition:transform .1s ease}
.stepper button:active{transform:scale(.85)}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper b{font-size:13px;min-width:34px;text-align:center}
.pick .rm.act{color:var(--ember)}
.pick .rm{border:none;background:none;color:var(--ink-soft);font-size:19px;cursor:pointer;
  min-width:38px;min-height:38px;display:flex;align-items:center;justify-content:center;line-height:1}

.flav.dim{opacity:.45}
.flav.pickd{border-color:color-mix(in srgb,var(--ember) 45%,var(--line));
  background:linear-gradient(180deg,color-mix(in srgb,var(--ember) 5%,var(--paper-raised)),var(--paper-raised))}
.offrange{display:block;font-size:11px;color:var(--warn);margin-top:3px;line-height:1.5}
.stepper b.warn{color:var(--warn)}
.bowl-row{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.bowl-lbl{font-size:12.5px;color:var(--ink-soft);font-weight:600;flex-shrink:0}
.segmented.mini{flex:1;margin-top:0;padding:2px}
.segmented.mini button{padding:6px 0;font-size:12.5px}
.bowl-note{margin-top:9px;font-size:12px;color:var(--ink-soft);display:flex;gap:5px;flex-wrap:wrap;align-items:center;
  background:var(--fill);border-radius:10px;padding:8px 11px;line-height:1.6}
.bowl-note b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 78px);transform:translate(-50%,14px);
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:100px;font-size:13.5px;font-weight:500;
  z-index:60;opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;
  box-shadow:0 6px 24px rgba(0,0,0,.28);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:var(--ok);color:#fff}
.toast.warn{background:var(--warn);color:#fff}
.toast.has-undo{pointer-events:auto;display:flex;align-items:center;gap:12px}
.toast .undo-btn{background:none;border:0;color:var(--ember);font:inherit;font-weight:700;
  padding:2px 4px;cursor:pointer;flex:none;text-decoration:underline}
.tagm{white-space:nowrap;font-size:9.5px;color:var(--ember);border:1px solid currentColor;border-radius:5px;padding:0 4px;font-weight:700}
.tagt{font-size:9.5px;color:var(--ok);border:1px solid currentColor;border-radius:5px;padding:0 4px;font-weight:700}
.rate-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px}
.rate-row:first-child{border-top:none}
.rate-row .diff{font-size:11px;color:var(--ink-soft)}
.rate-row .diff.up{color:var(--ok)} .rate-row .diff.dn{color:var(--danger)}
.rate-row .snum{font-size:10.5px;font-weight:700;color:var(--ember);border:1px solid currentColor;border-radius:5px;padding:0 5px}
.sbtn.coalbox{cursor:default}
.rate-row .when{font-size:11px;color:var(--ink-soft);margin-inline-start:auto}
.chipline{flex-basis:100%;font-size:11.5px;color:var(--ink-soft);line-height:1.6}
.chipline.fix{color:var(--ember)} .chipline.note-line{color:var(--ink)}
.ses-head{text-align:center;padding:18px 0 14px}
.ses-name{font-size:15px;font-weight:600}
.ses-clock{font-size:46px;font-weight:700;letter-spacing:1px;line-height:1.1;margin:6px 0;color:var(--ember)}
.ses-phase{font-size:12.5px;color:var(--ink-soft);line-height:1.6}
.ses-track{display:flex;gap:5px;margin-top:12px}
.ses-track span{flex:1;height:4px;border-radius:2px;background:var(--fill)}
.ses-track span.done{background:var(--ink-soft);opacity:.5}
.ses-track span.on{background:var(--ember);box-shadow:0 0 8px var(--ember-glow)}
.ses-actions{display:flex;gap:10px;margin-bottom:6px}
.sbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 6px;border-radius:16px;
  border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);font-family:inherit;cursor:pointer}
.sbtn svg{width:21px;height:21px;color:var(--ember)}
.sbtn span{font-size:12px;font-weight:600}
.sbtn b{font-size:15px;color:var(--ink-soft)}
.sbtn.due{border-color:var(--danger);box-shadow:0 0 0 2px color-mix(in srgb,var(--danger) 18%,transparent)}
.chip-grid{display:flex;flex-wrap:wrap;gap:7px}
.still-bar{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));
  z-index:60;max-width:456px;margin:0 auto;display:flex;align-items:center;gap:8px;
  background:var(--paper-raised);border:1px solid var(--warn);border-radius:14px;
  padding:11px 13px;box-shadow:var(--shadow);font-size:12.5px}
.still-bar span{flex:1;color:var(--ink)}
.still-bar button{border:none;border-radius:9px;padding:7px 11px;font-family:inherit;
  font-size:12px;font-weight:700;cursor:pointer;background:var(--fill);color:var(--ink)}
.still-bar button#sesYes{background:var(--ember);color:#fff}
.cmp-head{display:flex;justify-content:space-between;font-size:11px;font-weight:700;
  color:var(--ink-soft);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:6px;gap:10px}
.cmp-head span{flex:1;text-align:center}
.cmp-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.cmp-row.diff{background:color-mix(in srgb,var(--ember) 7%,transparent);border-radius:8px;padding-inline:8px}
.cmp-a,.cmp-b{flex:0 0 52px;text-align:center;font-size:12.5px;font-weight:700}
.cmp-row.diff .cmp-a{color:var(--ink-soft)} .cmp-row.diff .cmp-b{color:var(--ember)}
.cmp-n{flex:1;font-size:12px;display:flex;align-items:center;gap:6px;justify-content:center}
.bowl-pick{margin-top:9px;padding:10px 12px;border-radius:11px;background:var(--fill);
  border-inline-start:3px solid var(--ember)}
.bowl-pick b{display:block;font-size:13px;color:var(--ember);margin-bottom:3px}
.bowl-pick span{font-size:11.5px;color:var(--ink-soft);line-height:1.6}
.seg-mini{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.seg-mini button{flex:1 1 auto;padding:6px 8px;border-radius:9px;border:1px solid var(--line);
  background:var(--paper-raised);color:var(--ink-soft);font-family:inherit;font-size:10.5px;
  font-weight:600;cursor:pointer;white-space:nowrap}
.seg-mini button.on{background:var(--ember);color:#fff;border-color:var(--ember)}
.chip-group-lbl{font-size:10.5px;color:var(--ink-soft);font-weight:700;margin:10px 0 5px}
.chip-group-lbl:first-of-type{margin-top:0}
.qchip{padding:9px 13px;border-radius:100px;border:1px solid var(--line);background:var(--paper-raised);
  color:var(--ink);font-size:12.5px;font-family:inherit;cursor:pointer}
.qchip.on{background:var(--ember);color:#fff;border-color:var(--ember)}
.mark{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.mark .num{color:var(--ember);font-weight:700;font-size:12px}
.mark .ph{font-size:11px;color:var(--ink-soft)}
.star-pick{display:flex;gap:6px;justify-content:center}
.star-pick button{width:46px;height:46px;border:none;background:none;font-size:30px;color:var(--line);cursor:pointer;line-height:1}
.star-pick button.on{color:var(--ember)}
.ta{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--paper-raised);color:var(--ink);
  font-family:inherit;font-size:13.5px;line-height:1.7;padding:11px 13px;resize:vertical;outline:none}
.ta:focus{border-color:var(--ember)}
.tagt.v-ok{color:var(--ok)} .tagt.v-mid{color:var(--ink-soft)} .tagt.v-bad{color:var(--danger)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.stat{background:var(--paper-raised);border:1px solid var(--line);border-radius:16px;padding:13px 15px}
.stat span{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px}
.stat b{font-size:20px}
.bar-wrap{flex:1;height:7px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar-fill{display:block;height:100%;border-radius:4px}
.gap-row{display:flex;align-items:center;gap:7px;padding:6px 0;font-size:12px}
.gap-row .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.gap-row .gname{width:62px;color:var(--ink-soft);flex-shrink:0}
.gap-row .gbar{flex:1;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.gap-row .gbar span{display:block;height:100%;border-radius:3px}
.gap-row .gdelta{width:34px;text-align:end;font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:11.5px}
.gap-row .gdelta.up{color:var(--ok);font-weight:700}
.gap-row .gdelta.dn{color:var(--warn);font-weight:700}
.cmp{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.cmp::-webkit-scrollbar{display:none}
.cmp-col{flex:0 0 66%;background:var(--fill);border-radius:14px;padding:12px}
.cmp-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px}
.cmp-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--ink-soft)}
.cmp-row .num{color:var(--ink);font-weight:600}
.tagv{font-size:9.5px;color:var(--f-accent);border:1px solid currentColor;border-radius:5px;padding:0 4px;font-weight:700}
.tagdup{white-space:nowrap;font-size:9.5px;color:var(--warn);border:1px solid currentColor;border-radius:5px;padding:0 4px;font-weight:700}
.tagfam{white-space:nowrap;font-size:9.5px;color:var(--paper);background:var(--ember);border-radius:5px;padding:1px 5px;font-weight:800}
.famous-box{border:1px solid var(--ember);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.7}
.famous-box b{color:var(--ember);font-size:12px}
.famous-box .src{font-size:11.5px;color:var(--ink-soft)}
.miss-row{border:1px dashed var(--warn);border-radius:12px;padding:10px 12px;margin-top:8px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.miss-row .meta{font-size:11.5px;color:var(--ink-soft);line-height:1.6}
.pick .lead.miss{color:var(--warn);margin-inline-start:4px}
.buy-line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
.buy-line:first-of-type{border-top:none}
.buy-line span{color:var(--ink-soft);font-size:11.5px;text-align:left}
.rno{font-size:10.5px;color:var(--ember);border:1px solid currentColor;border-radius:5px;padding:0 4px;font-weight:700}
.stars-mini{font-size:10px;color:var(--ember);letter-spacing:1px;white-space:nowrap}
.stars-mini .on{color:color-mix(in srgb,var(--ember) var(--sv,100%),#5E564E)}
.stars-mini .off{color:color-mix(in srgb,var(--ink-soft) 45%,transparent)}
.stars-mini.s4 .on{text-shadow:0 0 5px color-mix(in srgb,var(--ember) 30%,transparent)}
.stars-mini.s5 .on{color:#E2B92E;text-shadow:0 0 6px var(--ember-glow),0 0 1px #F3D76A}
.btn{flex:1;padding:12px 0;border-radius:13px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid var(--line)}
.btn.ghost{background:var(--paper-raised);color:var(--ink-soft)}
.btn.solid{background:var(--ember);color:#fff;border-color:var(--ember)}

/* ---------- detail sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;
  transition:opacity .25s ease;z-index:40;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:50;max-width:480px;margin:0 auto;
  background:var(--paper-raised);border-radius:24px 24px 0 0;
  max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  padding:0 20px calc(env(safe-area-inset-bottom) + 24px);box-shadow:0 -8px 40px rgba(0,0,0,.2)}
.sheet.on{transform:none}
.grab{position:sticky;top:0;background:var(--paper-raised);padding:10px 0 4px;z-index:2}
.grab i{display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sh-title{font-size:21px;font-weight:700;margin-top:6px}
.sh-sub{font-size:13px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fam-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:11.5px;font-weight:600}

.sh-strip{display:flex;gap:8px;margin-top:14px}
.sh-strip .box{flex:1;background:var(--fill);border-radius:13px;padding:10px 12px}
.sh-strip .k{font-size:11px;color:var(--ink-soft);margin-bottom:3px}
.sh-strip .v{font-size:14px;font-weight:600}

.range{margin-top:4px}
.range .track{position:relative;height:24px;margin:16px 4px 6px}
.range .rail{position:absolute;inset-inline:0;top:9px;height:6px;border-radius:3px;background:var(--fill)}
.range .band{position:absolute;top:9px;height:6px;border-radius:3px;opacity:.34}
.range .tick{position:absolute;top:2px;width:2px;height:20px;border-radius:1px;background:var(--ink-soft);opacity:.5;transform:translateX(1px)}
.range .mark{position:absolute;top:0;width:24px;height:24px;transform:translateX(12px);display:flex;align-items:center;justify-content:center}
.range .mark i{width:14px;height:14px;border-radius:50%;border:3px solid var(--paper-raised);box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.18)}
.range .cap{position:absolute;top:1px;width:3px;height:22px;border-radius:2px;background:var(--danger);transform:translateX(1.5px)}
.range .scale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);padding:0 4px;font-variant-numeric:tabular-nums}
.range .keys{display:flex;gap:8px;margin-top:11px}
.range .keys .k{flex:1;background:var(--fill);border-radius:11px;padding:8px 10px;text-align:center}
.range .keys .k span{display:block;font-size:10.5px;color:var(--ink-soft)}
.range .keys .k b{font-size:14px;font-variant-numeric:tabular-nums}
.range .keys .k.mid{background:color-mix(in srgb,var(--rc) 16%,var(--fill));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--rc) 40%,transparent),0 0 18px -2px var(--rc)}
.range .keys .k.mid b{color:var(--rc);text-shadow:0 0 12px color-mix(in srgb,var(--rc) 80%,transparent)}
.range .capnote{margin-top:9px;font-size:12px;color:var(--danger);display:flex;gap:6px;align-items:flex-start;line-height:1.6}
.grp{margin-top:20px}
.grp h4{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:11px;letter-spacing:.3px}
.axis{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.axis .lbl{font-size:13px;width:62px;flex:0 0 auto}
.axis .dots{display:flex;gap:4px;flex:1}
.axis .dots i{height:6px;flex:1;border-radius:3px;background:var(--fill)}
.axis .dots i.on{background:var(--ax)}
.axis .val{font-size:12px;color:var(--ink-soft);width:16px;text-align:end;font-variant-numeric:tabular-nums}

.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--fill);border-radius:11px;padding:8px 11px;font-size:12px;flex:1;min-width:0}
.pill b{display:block;font-size:13.5px;font-weight:600;margin-top:2px}
.pill span{color:var(--ink-soft);font-size:11px}

.note{background:var(--fill);border-radius:14px;padding:13px 15px;font-size:13.5px;line-height:1.75}
.official{background:var(--fill);border-radius:14px;padding:13px 15px;font-size:13.5px;line-height:1.75}
.official.inf{border:1px dashed var(--warn)}
.official.der{border:1px dashed var(--ink-soft)}
.src .flag.ok{color:var(--ok)}
.src .flag.der{color:var(--ink-soft)}
.src{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;color:var(--ink-soft)}
.src .flag{color:var(--warn);border:1px solid currentColor;border-radius:5px;padding:0 5px;font-weight:600;font-size:10px}
.missing{font-size:12.5px;color:var(--ink-soft);opacity:.8;font-style:normal;background:var(--fill);
  border-radius:14px;padding:12px 15px;line-height:1.7}
.alert{border-radius:14px;padding:12px 15px;font-size:13px;line-height:1.7;margin-bottom:8px;
  border:1px solid currentColor}
.alert.dup{color:var(--warn)}
.alert.ban{color:var(--danger)}
.alert b{display:block;margin-bottom:4px;font-size:12.5px}
.alert p{color:var(--ink)}
.alert li{color:var(--ink);margin-inline-start:16px;margin-top:3px}

/* ---------- placeholders ---------- */
.placeholder-icon{width:52px;height:52px;border-radius:16px;background:color-mix(in srgb,var(--ember) 14%,transparent);
  color:var(--ember);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.placeholder-icon svg{width:26px;height:26px}
.placeholder h2{font-size:22px;margin-bottom:8px}
.placeholder p{font-size:14.5px;color:var(--ink-soft);line-height:1.7;max-width:38ch}
.placeholder .status{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-size:12.5px;color:var(--ember);
  background:color-mix(in srgb,var(--ember) 10%,transparent);padding:6px 12px;border-radius:100px}
.placeholder .status .dot{width:6px;height:6px;border-radius:50%;background:var(--ember)}

/* ---------- tabbar ---------- */
.tabbar{position:sticky;bottom:0;z-index:20;display:flex;justify-content:space-around;
  padding:10px 6px calc(env(safe-area-inset-bottom) + 8px);
  background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(16px);
  border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;
  color:var(--ink-soft);padding:4px 10px;cursor:pointer;position:relative;font-family:inherit}
.tab svg{width:23px;height:23px}
.tab span{font-size:10.5px;font-weight:500}
.tab.active{color:var(--ember)}
.tab .ember-dot{position:absolute;top:-1px;inset-inline-end:16px;width:5px;height:5px;border-radius:50%;
  background:var(--ember);opacity:0;box-shadow:0 0 6px var(--ember-glow)}
.tab.active .ember-dot{opacity:1}

/* ---------- interaction polish (added) ---------- */
.screen.leaving{animation:fall .16s ease forwards}
@keyframes fall{to{opacity:0;transform:translateY(-5px)}}

@keyframes numCrit{0%,100%{opacity:1}50%{opacity:.4}}
.stepper b.crit{color:var(--danger);animation:numCrit 1.1s ease-in-out infinite}

/* sheet chrome: back / close bar */
.sh-bar{position:sticky;top:0;background:var(--paper-raised);display:flex;align-items:center;
  padding:8px 0 2px;z-index:3}
.grab{flex:1;display:flex;justify-content:center;padding:6px 0}
.grab i{display:block;width:36px;height:4px;border-radius:2px;background:var(--line)}
.sh-nav{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:none;background:var(--fill);
  color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;
  cursor:pointer;transition:opacity .15s ease,transform .15s ease}
.sh-back{visibility:hidden;opacity:0;transform:translateX(6px)}
.sh-back.show{visibility:visible;opacity:1;transform:none}
.sheet.dragging{transition:none}

/* skeleton loading */
.skel-row{height:58px;border-radius:15px;margin-bottom:9px;
  background:linear-gradient(90deg,var(--fill) 25%,color-mix(in srgb,var(--ink) 14%,var(--fill)) 37%,var(--fill) 63%);
  background-size:400% 100%;animation:skelShine 1.3s ease infinite}
@keyframes skelShine{0%{background-position:100% 50%}100%{background-position:0% 50%}}

/* session rotation progress */
.rot-progress{height:5px;border-radius:3px;background:var(--fill);overflow:hidden;margin-bottom:12px}
.rot-progress>span{display:block;height:100%;border-radius:3px;background:var(--ember);transition:width .3s ease}

/* mix completion: amber -> green with a soft glow at exactly 100% */
.ember-bar{transition:box-shadow .35s ease}
.ember-bar.complete{box-shadow:0 0 0 1px color-mix(in srgb,var(--ok) 45%,transparent),
  0 0 14px color-mix(in srgb,var(--ok) 35%,transparent)}
/* one pass of light across the bar at the moment the mix hits 100% — fires
   only on the transition into complete, never on re-renders that stay there */
.ember-bar{position:relative}
.ember-bar.flash::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.55) 50%,transparent 100%);
  transform:translateX(-100%);animation:barSweep .7s ease-out 1 forwards}
@keyframes barSweep{to{transform:translateX(100%)}}
@keyframes doneIn{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.done-flag{display:inline-block;animation:doneIn .34s cubic-bezier(.3,1.4,.5,1)}

/* advisory notices slide in rather than pop */
@keyframes tierIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.tier,.alert{animation:tierIn .22s ease}

/* star rating: slight overshoot on fill */
.star-pick button{transition:transform .12s ease}
@keyframes starPop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
.star-pick button.on{color:var(--ember);animation:starPop .3s cubic-bezier(.3,1.5,.5,1)}

/* rotation overdue: the whole bar breathes, not just a static red border */
@keyframes rotDue{0%,100%{opacity:1}50%{opacity:.45}}
.rot-progress.due>span{background:var(--danger);animation:rotDue 1.4s ease-in-out infinite}
.sbtn.due svg{animation:rotDue 1.4s ease-in-out infinite}

/* coal stepper: warm glow so a tap reads in dim light */
.coalbox .stepper button{transition:transform .1s ease,box-shadow .2s ease}
.coalbox .stepper button:active{transform:scale(.8);box-shadow:0 0 12px var(--ember-glow)}

/* confidence badge is tappable and explains itself */
.src .flag{cursor:pointer}
.flag-why{margin-top:7px;font-size:11.5px;line-height:1.7;color:var(--ink-soft);
  background:var(--fill);border-radius:10px;padding:9px 11px;animation:tierIn .2s ease}

/* end-of-session: a brief, quiet ember drift */
.celebrate{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.celebrate i{position:absolute;bottom:34%;width:5px;height:5px;border-radius:50%;
  background:var(--ember);opacity:0;animation:emberUp 1.5s ease-out forwards}
@keyframes emberUp{0%{opacity:0;transform:translateY(0) scale(.6)}
  18%{opacity:.85}100%{opacity:0;transform:translateY(-120px) scale(1.1)}}

/* ---------- batch 2: home ---------- */
@keyframes ringPulseGlow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ember) 40%,transparent)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sess-ring{animation:ringPulseGlow 2.6s ease-in-out infinite}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 20px 6px;margin:0 -20px;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
.carousel-card{flex:0 0 auto;width:132px;scroll-snap-align:start;cursor:pointer}
.carousel-card .swatch{height:64px;border-radius:12px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,transparent 0 7px,color-mix(in srgb,var(--ink) 12%,transparent) 7px 8px,transparent 8px),var(--fill)}
.carousel-card .swatch>span{position:absolute;inset-inline-end:0;top:0;bottom:0;width:3px}
.carousel-card .cc-name{font-size:12.5px;font-weight:700;margin-top:7px}
.carousel-card .cc-sub{font-size:10.5px;color:var(--ink-soft)}

/* ---------- batch 2: library ---------- */
.trust-pop{max-height:0;overflow:hidden;opacity:0;transition:max-height .22s ease,opacity .2s ease;font-size:11px;color:var(--ink-soft);line-height:1.5}
.trust-pop.open{max-height:60px;opacity:1;margin-top:6px}
.flav{transition:transform .18s ease,opacity .18s ease}
.sheet-morph{transition:none!important}

/* ---------- batch 2: build ---------- */
.total-bar-fill{transition:background-color .3s ease,box-shadow .3s ease}
.total-bar-fill.complete{box-shadow:0 0 10px 1px color-mix(in srgb,var(--ok) 55%,transparent)}
.warn-banner{animation:bannerIn .22s ease}
@keyframes bannerIn{from{opacity:0;max-height:0;transform:translateY(-6px)}to{opacity:1;max-height:80px;transform:none}}
.bridge-sugg{position:relative;overflow:hidden}
@keyframes bridgeShine{0%{background-position:-120px 0}100%{background-position:220px 0}}
.bridge-sugg::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--ember) 18%,transparent) 45%,transparent 60%);
  background-size:200px 100%;animation:bridgeShine 2.8s ease-in-out infinite}
@keyframes numBounce{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
.num-bounce{animation:numBounce .28s cubic-bezier(.34,1.56,.64,1)}

/* ---------- batch 2: recipes ---------- */
@keyframes diffIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.diff-row{animation:diffIn .2s ease}
.ses-pills{position:relative;display:flex;gap:4px;background:var(--fill);border-radius:11px;padding:3px;
  overflow-x:auto;-webkit-overflow-scrolling:touch}
.ses-pills::-webkit-scrollbar{display:none}
.ses-pill-ind{position:absolute;top:3px;bottom:3px;border-radius:8px;background:var(--ember);
  transition:transform .24s cubic-bezier(.34,1.2,.64,1),width .24s ease;z-index:0}
.ses-pill{position:relative;z-index:1;flex:0 0 auto;padding:5px 12px;border-radius:8px;border:none;background:none;
  font-size:11px;font-weight:700;color:var(--ink-soft);cursor:pointer;transition:color .2s ease}
.ses-pill.on{color:#fff}
@keyframes starBounce{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-6deg)}100%{transform:scale(1) rotate(0)}}
.star-bounce{animation:starBounce .32s cubic-bezier(.34,1.56,.64,1)}

/* ---------- batch 2: session / log ---------- */
.rot-ring{border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .3s linear}
.rot-ring.running{animation:ringPulseGlow 2.6s ease-in-out infinite}
.rot-ring.due{animation:dueFlash 1s ease-in-out infinite}
@keyframes dueFlash{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warn) 55%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
@keyframes glowPop{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ember) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.glow-pop{animation:glowPop .4s ease-out}
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.confetti-bit{position:absolute;top:40%;border-radius:50%;background:var(--ember);

<main class="screen" id="screen-build"></main>

function renderTabs(){
  let hasSes = false;
  try { hasSes = !!(STATE && STATE.session); } catch { hasSes = false; }
  const list = hasSes ? TABS.slice(0,4).concat([SESSION_TAB], TABS.slice(4)) : TABS;
  const cur = document.querySelector('.screen.active');
  const curKey = cur ? cur.id.replace('screen-','') : 'home';
  document.getElementById('tabbar').innerHTML = list.map(t=>
   `<button class="tab${t.k===curKey?' active':''}" data-tab="${t.k}"><span class="ember-dot"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${t.i}</svg>
    <span>${t.t}</span></button>`).join('');
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>goTo(t.dataset.tab));
}

function goTo(n){
  localStorage.setItem('mizaj:lastTab', n);
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===n));
  const next=document.getElementById('screen-'+n);
  if(!next)return;
  window.scrollTo(0,0);
  document.querySelectorAll('.screen.leaving').forEach(s=>s.classList.remove('active','leaving'));
  const cur=document.querySelector('.screen.active');
  if(cur===next)return;
  if(!cur){next.classList.add('active');return;}
  cur.classList.add('leaving');
  // the screen switch used to happen ONLY inside this animationend callback —
  // if the 'fall' animation ever gets skipped or cancelled (reduced-motion
  // edge cases, a backgrounded/suspended tab resuming, GPU/compositor
  // hiccups), the event never fires and the app is stuck on the old screen
  // forever with no way to navigate. The timeout below guarantees the
  // switch happens regardless, shortly after the .16s animation would have
  // finished anyway.
  let _switched = false;
  const _doSwitch = () => {
    if (_switched) return;
    _switched = true;
    cur.classList.remove('active','leaving');
    next.classList.add('active');
  };
  cur.addEventListener('animationend', _doSwitch, {once:true});
  setTimeout(_doSwitch, 350);
}
(function restoreLastTab(){
  const saved = localStorage.getItem('mizaj:lastTab');
  if(!saved || saved==='home' || !TABS.some(t=>t.k===saved))return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===saved));
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id==='screen-'+saved));
})();

function flipList(container, renderFn){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ renderFn(); return; }
  const before=new Map();
  container.querySelectorAll('.flav[data-id]').forEach(el=>before.set(el.dataset.id, el.getBoundingClientRect()));
  renderFn();
  container.querySelectorAll('.flav[data-id]').forEach(el=>{
    const prev=before.get(el.dataset.id);
    if(prev){
      const now=el.getBoundingClientRect();
      const dx=prev.left-now.left, dy=prev.top-now.top;
      if(dx||dy){
        el.style.transition='none';
        el.style.transform=`translate(${dx}px,${dy}px)`;
        requestAnimationFrame(()=>{
          el.style.transition='transform .28s cubic-bezier(.22,.61,.36,1)';
          el.style.transform='';
        });
      }
    }else{
      el.style.opacity='0'; el.style.transform='translateY(-4px)';
      requestAnimationFrame(()=>{
        el.style.transition='opacity .22s ease,transform .22s ease';
        el.style.opacity='1'; el.style.transform='none';
      });
    }
  });
}

/* ---------- sheet gestures: drag-down from handle to dismiss, drag-right to go back ---------- */
(function(){
  let sx=0,sy=0,axis=null,active=false,fromBar=false,fromField=false,pid=null;
  const THRESH_Y=110,THRESH_X=90;
  sheet.addEventListener('pointerdown',e=>{
    if(!sheet.classList.contains('on'))return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    sx=e.clientX;sy=e.clientY;axis=null;active=true;pid=e.pointerId;
    fromBar=!!e.target.closest('.sh-bar');
    fromField=!!e.target.closest('input,textarea,select');
  });
  sheet.addEventListener('pointermove',e=>{
    if(!active)return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(axis===null){
      if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
      axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
      if(axis==='y'&&!fromBar){active=false;return;}
      if(axis==='x'&&(fromField||!sheetStack.length)){active=false;return;}
      // real gesture confirmed — only now take over the pointer
      sheet.classList.add('dragging');
      try{sheet.setPointerCapture(pid);}catch{}
    }
    if(axis==='y'&&fromBar){
      if(dy<0)return;
      sheet.style.transform=`translateY(${dy}px)`;e.preventDefault();
    }else if(axis==='x'){
      if(dx<0)return;
      sheet.style.transform=`translateX(${dx}px)`;e.preventDefault();
    }
  },{passive:false});
  const finish=e=>{
    if(!active)return;
    active=false;sheet.classList.remove('dragging');
    const dx=e.clientX-sx, dy=e.clientY-sy;
    sheet.style.transform='';
    if(axis==='y'&&fromBar&&dy>THRESH_Y)closeSheet();
    else if(axis==='x'&&dx>THRESH_X&&sheetStack.length)sheetGoBack();
    axis=null;
  };
  sheet.addEventListener('pointerup',finish);
  sheet.addEventListener('pointercancel',finish);
})();
