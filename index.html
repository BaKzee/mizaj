    document.getElementById('rcStart').onclick = () => startSession(key);
    document.getElementById('rcEdit').onclick = () => { pushSheetView(() => openRecipe(key)); openEditRecipe(key); };
    document.getElementById('rcCopy').onclick = () => {
      const txt = [
        `${r.name} — ${rNum(r)}`,
        `${r.category || 'من تصميمي'} · بول ${STATE.settings.bowlG}غ`,
        '',
        ...items.map(i => `${i.pct}% · ${gramsFor(i.pct)}غ — ${i.f.name}`),
        '',
        r.setup ? `الإعداد: ${r.setup}` : '',
        avg !== null ? `تقييمي: ${avg.toFixed(1)}/5 على ${rs.length} ${rs.length === 1 ? 'جلسة' : 'جلسات'}` : '',
      ].filter(Boolean).join('\n');
      const done = () => toast('نُسخت الوصفة', 'ok');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
      } else fallbackCopy(txt, done);
    };
    const fixBtn = document.getElementById('rcFix');
    if (fixBtn) fixBtn.onclick = () => { pushSheetView(() => openRecipe(key)); openEditRecipe(key); };
    const delBtn = document.getElementById('rcDel');
    if (delBtn) delBtn.onclick = () => { pushSheetView(() => openRecipe(key)); confirmDelete(key); };
  };
  draw();
}

/* =======================================================================
   ACTIVE SESSION — one tap per entry, nothing typed unless you want to
   ======================================================================= */
let sesTimer = null, wakeLock = null;

const mins = () => STATE.session ? Math.floor((Date.now() - STATE.session.start) / 60000) : 0;
const secs = () => STATE.session ? Math.floor((Date.now() - STATE.session.start) / 1000) % 60 : 0;
const curPhase = () => PHASES.find(p => mins() >= p.from && mins() < p.to) || PHASES[2];

async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (wakeLock) { wakeLock.release(); wakeLock = null; }
  } catch {}
}

function startSession(key) {
  if (STATE.session) { toast('هناك جلسة نشطة بالفعل.', 'warn'); return; }
  const r = allRecipes().find(x => RKEY(x) === key);
  STATE.session = { key, name: r.name, start: Date.now(), coalCount: 2, coals: [], rotations: [], marks: [] };
  save(true);
  closeSheet();
  keepAwake(true);
  renderSession();
  renderTabs();
  goTo('session');
  renderHome();
  toast('بدأت الجلسة — الشاشة ستبقى مضاءة', 'ok');
}

/* A short, quiet ember drift to close a session out. Purely decorative, so it
   is skipped entirely when the user asks for reduced motion. */
function celebrate() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const w = document.createElement('div');
  w.className = 'celebrate';
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('i');
    p.style.left = (12 + Math.random() * 76) + '%';
    p.style.animationDelay = (Math.random() * 0.5) + 's';
    w.appendChild(p);
  }
  document.body.appendChild(w);
  setTimeout(() => w.remove(), 2200);
}

function endSession(rate) {
  const s = STATE.session; if (!s) return;
  clearInterval(sesTimer); sesTimer = null; keepAwake(false);
  s.end = Date.now();
  s.minutes = Math.round((s.end - s.start) / 60000);
  STATE.sessions.push(s);
  const key = s.key;
  STATE.session = null;
  save(true);
  celebrate();
  renderSession();
  renderRecipes();
  renderHome();
  if (document.querySelector('.screen.active') === sesScreen) goTo('recipes');
  renderTabs();
  if (rate) { clearSheetStack(); openRate(key, s); }
}

function renderSession() {
  const s = STATE.session;
  if (!s) { sesScreen.innerHTML = ''; return; }
  const r = allRecipes().find(x => RKEY(x) === s.key);
  const m = mins(), ph = curPhase(), items = r ? recipeItems(r) : [];
  const nextStep = COAL_STEPS.find(c => c.at > m);
  const dueStep = COAL_STEPS.filter(c => c.at <= m).pop();
  const lastRot = s.rotations.length ? Math.floor((Date.now() - s.rotations[s.rotations.length - 1]) / 60000) : m;
  const rotDue = lastRot >= rotateEvery();
  const ROT_TARGET = 6;
  const rotPct = Math.min(100, Math.round(s.rotations.length / ROT_TARGET * 100));

  sesScreen.innerHTML = `
    <div class="rot-progress${rotDue ? ' due' : ''}" title="دورة ${s.rotations.length} من ${ROT_TARGET} — نموذجية لجلسة ٩٠ دقيقة"><span style="width:${rotPct}%"></span></div>
    <div class="src" style="margin:-8px 0 14px"><span>دورة <b class="num">${s.rotations.length}</b> من ${ROT_TARGET} نموذجية${rotDue ? ' · <b style="color:var(--danger)">حان وقت التدوير</b>' : ''}</span></div>
    <div class="ses-head">
      <div class="ses-name"><bdi>${s.name}</bdi></div>
      <div class="ses-clock num">${String(m).padStart(2,'0')}:${String(secs()).padStart(2,'0')}</div>
      <div class="ses-phase">${ph.name} · ${ph.hint}</div>
      <div class="ses-track">${PHASES.map(p => {
        const active = p === ph, done = m >= p.to;
        return `<span class="${active ? 'on' : done ? 'done' : ''}"></span>`;
      }).join('')}</div>
    </div>

    ${rotDue ? `<div class="alert ban" style="margin-bottom:10px"><b>وقت التدوير — مضت ${lastRot} دقيقة</b><p>${ROTATE_HOW}</p></div>` : ''}
    ${m >= 35 ? `<div class="note" style="margin-bottom:10px">بعد نصف ساعة يخفّ وهج الفحم — قرّبه للمركز قليلاً بدل إضافة فحمة جديدة.</div>` : ''}
    ${dueStep ? `<div class="note" style="margin-bottom:10px"><b>الدقيقة ${dueStep.at}:</b> ${dueStep.t}</div>` : ''}
    ${nextStep ? `<div class="src" style="margin-bottom:12px"><span>التالي عند الدقيقة ${nextStep.at}</span></div>` : ''}

    <div class="ses-actions">
      <button class="sbtn ${rotDue ? 'due' : ''}" id="sRotate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M20.5 12a8.5 8.5 0 1 1-3-6.5"/><path d="M21 3v5h-5"/></svg>
        <span>دوّر الفحم</span><b class="num">${s.rotations.length}</b>
      </button>
      <div class="sbtn coalbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 3c3 3 5 6 5 9a5 5 0 0 1-10 0c0-1.5.5-2.5 1.5-4 .3 1 1 1.5 1.5 1 .5-3 .5-4.5 2-6z"/></svg>
        <span>الفحم الآن</span>
        <span class="stepper" style="background:none;padding:0">
          <button id="sCoalDn" ${s.coalCount > 0 ? '' : 'disabled'}>−</button>
          <b class="num" style="font-size:17px;color:var(--ember)">${s.coalCount}</b>
          <button id="sCoalUp" ${s.coalCount < 4 ? '' : 'disabled'}>+</button>
        </span>
      </div>
    </div>

    <div class="section-label">ملاحظة سريعة — تُسجَّل في «${ph.name}»</div>
    <div class="chip-grid">${CHIPS.map(c =>
      `<button class="qchip" data-mark="${c.k}">${c.k}</button>`).join('')}</div>

    ${s.marks.length ? `<div class="section-label">ما سجّلته (${s.marks.length})</div>
      ${s.marks.slice().reverse().map(x =>
        `<div class="mark"><span class="num">${String(x.m).padStart(2,'0')}د</span>
         <span class="ph">${x.phase}</span><span class="k">${x.k}</span></div>`).join('')}` : ''}

    ${items.length ? `<div class="section-label">المكوّنات</div>
      <div class="card">${items.map(i => `<div class="pick" style="padding:7px 0">
        <span class="stripe" style="background:${famColor(i.f.family)}"></span>
        <span class="main"><span class="nm"><bdi>${i.f.name}</bdi></span></span>
        <span class="pct num">${i.pct}% · ${gramsFor(i.pct)}غ</span></div>`).join('')}</div>` : ''}

    <div style="display:flex;gap:10px;margin:18px 0 6px">
      <button class="btn ghost" id="sCancel">ألغِ</button>
      <button class="btn solid" id="sEnd">أنهِ وقيّم</button>
    </div>`;

  /* Light haptic where the platform supports it. iOS Safari does not implement
     the Vibration API, so this is a bonus on Android and a no-op on iPhone —
     never the only feedback for an action. */
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

  const mk = (arr, label) => { buzz(12); arr.push(Date.now()); save(); renderSession(); toast(label); };
  document.getElementById('sRotate').onclick = () => mk(s.rotations, 'سُجّل التدوير');
  const coalSet = d => {
    buzz(10);
    s.coalCount = Math.max(0, Math.min(4, +((s.coalCount || 0) + d).toFixed(1)));
    s.coals.push({ ts: Date.now(), m: mins(), to: s.coalCount });
    save(); renderSession();
    if (s.coalCount >= 3.5) toast('اقتربت من السقف — راقب الحدّة', 'warn');
  };
  document.getElementById('sCoalUp').onclick = () => coalSet(+0.5);
  document.getElementById('sCoalDn').onclick = () => coalSet(-0.5);
  sesScreen.querySelectorAll('[data-mark]').forEach(b => b.onclick = () => {
    s.marks.push({ k: b.dataset.mark, m: mins(), phase: curPhase().name, ts: Date.now() });
    save(); renderSession();
  });
  document.getElementById('sEnd').onclick = () => endSession(true);
  document.getElementById('sCancel').onclick = () => {
    clearInterval(sesTimer); sesTimer = null; keepAwake(false);
    STATE.session = null; save(true); renderRecipes(); toast('أُلغيت الجلسة');
  };

  if (!sesTimer) sesTimer = setInterval(() => { if (STATE.session) { renderSession(); tickHomeSessionCard(); } }, 1000);
}

/* ============================== RATING ============================== */
function openRate(key, ses) {
  const prev = ratingsOf(key).slice(-1)[0];
  let stars = prev ? prev.stars : 0;
  const picked = new Set((ses ? ses.marks.map(m => m.k) : []));

  const draw = () => {
    sBody.innerHTML = `
     <div class="sh-title">${prev ? 'إعادة تقييم' : 'تقييم'}</div>
     <div class="sh-sub">${(allRecipes().find(x => RKEY(x) === key) || {}).name || ''}
       ${ses ? `<span class="sub-badge">${ses.minutes} دقيقة · ${ses.rotations.length} تدوير</span>` : ''}</div>

     <div class="grp"><h4>النجوم</h4>
       <div class="star-pick">${[1,2,3,4,5].map(n =>
         `<button data-star="${n}" class="${n <= stars ? 'on' : ''}">★</button>`).join('')}</div>
       ${prev ? `<div class="src" style="margin-top:8px"><span>تقييمك السابق ${prev.stars} ★ —
         ${stars ? (stars > prev.stars ? `تحسّن بـ ${stars - prev.stars}` : stars < prev.stars ? `تراجع بـ ${prev.stars - stars}` : 'بلا تغيير') : 'اختر النجوم'}</span></div>` : ''}
     </div>

     <div class="grp"><h4>ماذا لاحظت؟ <span style="font-weight:400">(اختياري)</span></h4>
       <div class="chip-grid">${CHIPS.map(c =>
         `<button class="qchip ${picked.has(c.k) ? 'on' : ''}" data-pick="${c.k}">${c.k}</button>`).join('')}</div>
       ${[...picked].map(k => { const c = CHIPS.find(x => x.k === k); return c ?
          `<div class="tier y" style="margin-top:8px"><span class="sw"></span><span class="t"><b>${c.k}</b>${c.fix}</span></div>` : ''; }).join('')}
     </div>

     <div class="grp"><h4>ملاحظة نصية <span style="font-weight:400">(اختياري)</span></h4>
       <div class="search"><input id="rNote" type="text" placeholder="سطر واحد يكفي…" style="padding-inline-start:14px" value="${prev && !ses ? '' : ''}"></div>

/* =======================================================================
   RECIPE EDITS — in place
   One card, one rating history. The original stays recoverable and the
   difference is always on screen.
   ======================================================================= */
const editOf = key => (STATE.edits || {})[key] || null;

/* the items actually in play: the newest edit, else the book's own */
function liveItems(r) {
  const e = editOf(RKEY(r));
  return e ? e.items.map(i => ({
    f: DATA.flavors.find(f => f.id === i.id) || { name: '?', family: 'base', subfamily: '' },
    pct: i.pct,
  })) : recipeItems(r);
}

/* what changed, in words */
function diffItems(orig, now) {
  const o = new Map(orig.map(i => [i.f.id, i.pct]));
  const n = new Map(now.map(i => [i.f.id, i.pct]));
  const nm = id => (DATA.flavors.find(f => f.id === id) || {}).name || '?';
  const out = [];
  o.forEach((pct, id) => {
    if (!n.has(id)) out.push({ t: 'out', s: `حُذفت ${nm(id)} (${pct}%)` });
    else if (n.get(id) !== pct) out.push({ t: 'chg', s: `${nm(id)}: ${pct}% ← ${n.get(id)}%`, d: n.get(id) - pct });
  });
  n.forEach((pct, id) => { if (!o.has(id)) out.push({ t: 'in', s: `أُضيفت ${nm(id)} (${pct}%)` }); });
  return out;
}

/* =======================================================================
   RECOMMENDATIONS
   Untried recipes ranked by what BaKzee's own ratings reveal he likes,
   then by whether the recipe is structurally sound. Deterministic per day.
   ======================================================================= */
function likedFlavorScores() {
  const s = {};
  Object.entries(STATE.ratings || {}).forEach(([k, rs]) => {
    if (!rs.length) return;
    const avg = rs.reduce((a, x) => a + x.stars, 0) / rs.length;
    const r = allRecipes().find(x => RKEY(x) === k); if (!r) return;
    r.items.forEach(i => { s[i.id] = (s[i.id] || 0) + (avg - 3) * (i.pct / 100); });
  });
  return s;
}

function recommendations(n) {
  const liked = likedFlavorScores();
  const hasHistory = Object.keys(liked).length > 0;

  const pool = allRecipes().filter(r =>
    !r.tested && !ratingsOf(RKEY(r)).length && (r.items || []).length >= 2);

  const scored = pool.map(r => {
    const items = recipeItems(r);
    let sc = 0;

    // 1. taste history
    items.forEach(i => { sc += (liked[i.f.id] || 0) * 2; });

    // 2. structurally sound: a hero in every phase
    const cov = phaseCoverage(r);
    sc += cov.filter(c => c.has > 0).length * 0.9;

    // 3. rule check
    const iss = checkRecipe(r);
    sc -= iss.filter(x => x.sev === 'r').length * 6;
    sc -= iss.filter(x => x.sev === 'o').length * 1.2;

    // 4. can you actually make it right now?
    const short = items.filter(i => invOf(i.f.id) && invOf(i.f.id).remG < gramsFor(i.pct));
    sc -= short.length * 4;

    // 5. a nudge toward the shelf that is sitting untouched
    items.forEach(i => {
      const inv = invOf(i.f.id);
      if (inv && !inv.lastUsed) sc += 0.35;
    });

    // 6. gentle jitter, fixed for the whole day
    const seed = (new Date().toISOString().slice(0, 10) + (r.no || r.id)).split('')
      .reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 9973, 7);
    sc += (seed % 100) / 100 * (hasHistory ? 0.8 : 2.2);

    return { r, sc, short: short.length, cov };
  }).sort((a, b) => b.sc - a.sc);

  // keep the picks from all tasting alike
  const out = [];
  for (const c of scored) {
    if (out.length >= n) break;
    const ids = new Set(c.r.items.map(i => i.id));
    const twin = out.some(o => {
      const oi = new Set(o.r.items.map(i => i.id));
      const inter = [...ids].filter(x => oi.has(x)).length;
      return inter / new Set([...ids, ...oi]).size >= 0.5;
    });
    if (!twin) out.push(c);
  }
  return out;
}

function dailyPick() { const r = recommendations(5); return r.length ? r[0] : null; }

function tickHomeSessionCard(){
  const ring=document.getElementById('hRing');
  if(!ring||!STATE.session)return;
  const s=STATE.session;
  const lastRotTs=s.rotations.length? s.rotations[s.rotations.length-1] : s.start;

  const secsSince=Math.max(0,Math.floor((Date.now()-lastRotTs)/1000));
  const secsLeft=Math.max(0,totalSecs-secsSince);
  const due=secsLeft<=0;
  const nearDue=secsLeft>0&&secsLeft<=120;
  const deg=Math.min(360,(secsSince/totalSecs)*360);
  const color=due?'var(--danger)':nearDue?'var(--warn)':'var(--ember)';
  ring.style.background=`conic-gradient(${color} ${deg}deg,var(--fill) ${deg}deg 360deg)`;
  ring.classList.toggle('due',due);
  const mm=String(Math.floor(secsLeft/60)).padStart(2,'0'), ss=String(secsLeft%60).padStart(2,'0');
  const timeEl=document.getElementById('hRingTime');
  if(timeEl) timeEl.textContent = due ? 'الدورة مستحقة الآن' : `${mm}:${ss} متبقية`;
  const cycEl=document.getElementById('hRingCyc');
  if(cycEl) cycEl.textContent = `دورة ${Math.min(s.rotations.length+1,6)} من 6`;
}

/* =======================================================================
   MY LOG + WHAT TO BUY
   Nothing here is estimated. Every number comes from a session you logged.
   ======================================================================= */
const lScreen = document.getElementById('screen-log');
let lView = 'log';

const DAY = 864e5;
const daysSince = ts => ts ? Math.floor((Date.now() - ts) / DAY) : null;

/* grams per month, measured from first use to now */
function turnover(id) {
  const i = invOf(id); if (!i || !i.firstUsed || !i.usedG) return 0;
  const months = Math.max(0.5, (Date.now() - i.firstUsed) / DAY / 30);
  return +(i.usedG / months).toFixed(1);
}
function monthsLeft(id) {
  const t = turnover(id); const i = invOf(id);
  return t > 0 ? +(i.remG / t).toFixed(1) : null;
}

function logStats() {
  const ses = STATE.sessions || [];
  const rated = Object.entries(STATE.ratings || {}).flatMap(([k, rs]) => rs.map(r => ({ k, ...r })));
  const avg = rated.length ? rated.reduce((s, r) => s + r.stars, 0) / rated.length : null;
  const minutes = ses.reduce((s, x) => s + (x.minutes || 0), 0);

  const catScore = {};
  Object.entries(STATE.ratings || {}).forEach(([k, rs]) => {
    const r = allRecipes().find(x => RKEY(x) === k); if (!r) return;
    const a = rs.reduce((s, x) => s + x.stars, 0) / rs.length;
    const c = r.category || 'من تصميمي';
    catScore[c] = catScore[c] || { n: 0, sum: 0 };
    catScore[c].n += rs.length; catScore[c].sum += a * rs.length;
  });
  const cats = Object.entries(catScore)
    .map(([c, v]) => ({ c, n: v.n, avg: v.sum / v.n }))
    .sort((a, b) => (b.avg - a.avg) || (b.n - a.n));

  return { ses, rated, avg, minutes, cats };
}

/* Count numbers up on entry. Decorative only — the final value is already in
   the DOM, so a reduced-motion user (or a failed animation) still sees it. */
function countUp(scope) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  scope.querySelectorAll('[data-count]').forEach(el => {
    const target = parseFloat(el.dataset.count);
    if (!isFinite(target) || target <= 0) return;
    const dec = (el.dataset.count.split('.')[1] || '').length;
    const suffix = el.dataset.suffix || '';
    const dur = 520, t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = (target * eased).toFixed(dec) + suffix;
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = target.toFixed(dec) + suffix;
    };
    requestAnimationFrame(step);
  });
}

/* ------------------------------- BUY ------------------------------- */
function buyHTML() {
  const inv = DATA.flavors.map(f => ({ f, i: invOf(f.id), t: turnover(f.id), left: monthsLeft(f.id) }));
  const used = inv.filter(x => x.i.usedG > 0);
  if (!used.length) return `<div class="empty">لا استهلاك مسجّل بعد.<br>هذه اللوحة تُبنى من جلساتك الفعلية — كل جلسة تسجّلها تجعلها أدق.<br><br>سجّل 3–4 جلسات وستبدأ الأرقام بالظهور.</div>`;

  const top = used.slice().sort((a, b) => b.i.usedG - a.i.usedG).slice(0, 8);
  const soon = used.filter(x => x.left !== null && x.left <= 2).sort((a, b) => a.left - b.left);
  const idle = inv.filter(x => !x.i.usedG || (daysSince(x.i.lastUsed) || 999) >= 60)
    .sort((a, b) => (b.i.remG) - (a.i.remG));

  // gaps: how each family's share of use compares with its share of shelf
  const famUse = {}, famOwn = {};
  inv.forEach(x => {
    famUse[x.f.family] = (famUse[x.f.family] || 0) + x.i.usedG;
    famOwn[x.f.family] = (famOwn[x.f.family] || 0) + 1;
  });
  const totUse = Object.values(famUse).reduce((a, b) => a + b, 0) || 1;
  const gaps = FAM.map(k => ({
    k, usePct: Math.round(famUse[k] / totUse * 100),
    own: famOwn[k] || 0, ownPct: Math.round((famOwn[k] || 0) / DATA.flavors.length * 100),
  })).map(g => ({ ...g, delta: g.usePct - g.ownPct })).sort((a, b) => b.delta - a.delta);

  const buyList = soon.filter(x => x.t > 0)
    .concat(gaps.filter(g => g.delta >= 8).flatMap(g =>
      used.filter(x => x.f.family === g.k).sort((a, b) => b.t - a.t).slice(0, 1)))
    .filter((x, i, a) => a.findIndex(y => y.f.id === x.f.id) === i).slice(0, 8);

  return `
    <div class="note" style="margin-bottom:14px">كل رقم هنا مقاس من ${STATE.sessions.length} ${STATE.sessions.length === 1 ? 'جلسة' : 'جلسة'} سجّلتها — لا تقدير.</div>

    ${buyList.length ? `<div class="section-label">قائمة الشراء الموصى بها</div>
      ${buyList.map(x => `<div class="flav" data-lflav="${x.f.id}">
        <span class="stripe" style="background:${famColor(x.f.family)}"></span>
        <span class="main"><span class="nm"><bdi>${x.f.name}</bdi></span>
          <span class="meta">${x.left !== null && x.left <= 2 ? `يكفي ${x.left} شهر` : 'عالية الدوران'} · ${x.t}غ/شهر · باقٍ ${Math.round(x.i.remG)}غ</span></span>
        <span class="pct num">${invPct(x.f.id)}%</span></div>`).join('')}` : ''}

    <div class="section-label">الأكثر استهلاكاً</div>
    ${top.map(x => `<div class="axis"><span class="lbl" style="width:112px;font-size:12px"><bdi>${x.f.name}</bdi></span>
      <span class="bar-wrap"><span class="bar-fill" style="width:${Math.round(x.i.usedG / top[0].i.usedG * 100)}%;background:${famColor(x.f.family)}"></span></span>
      <span class="val num" style="width:44px">${Math.round(x.i.usedG)}غ</span></div>`).join('')}

    <div class="section-label">المخزون</div>
    ${used.slice().sort((a, b) => invPct(a.f.id) - invPct(b.f.id)).slice(0, 10).map(x =>
      `<div class="axis"><span class="lbl" style="width:112px;font-size:12px"><bdi>${x.f.name}</bdi></span>
        <span class="bar-wrap"><span class="bar-fill" style="width:${invPct(x.f.id)}%;background:${invPct(x.f.id) <= STATE.settings.lowPct ? 'var(--danger)' : 'var(--ok)'}"></span></span>
        <span class="val num" style="width:44px">${invPct(x.f.id)}%</span></div>`).join('')}

    ${idle.length ? `<div class="section-label">المهدور — أوقف شراءها (${idle.length})</div>
      <div class="alert dup"><b>راكدة</b><p>${idle.slice(0, 14).map(x =>
        `<bdi>${x.f.name}</bdi>${x.i.usedG ? ` (${daysSince(x.i.lastUsed)} يوماً)` : ' (لم تُفتح)'}`).join(' · ')}</p></div>` : ''}

    <div class="section-label">الفجوات — استخدامك مقابل رفّك</div>
    ${gaps.map(g => `<div class="gap-row">
      <span class="dot" style="background:${famColor(g.k)}"></span>
      <span class="gname">${FAM_AR[g.k]}</span>
      <span class="gbar"><span style="width:${g.ownPct}%;background:var(--ink-soft);opacity:.45"></span></span>
      <span class="gbar"><span style="width:${g.usePct}%;background:${famColor(g.k)}"></span></span>
      <span class="gdelta ${g.delta >= 8 ? 'up' : g.delta <= -8 ? 'dn' : ''}">${g.delta > 0 ? '+' : ''}${g.delta}</span>
    </div>`).join('')}
    <div class="src" style="margin-top:8px"><span>الشريط الرمادي = حصتها من رفّك · الملوّن = حصتها من استهلاكك.
      موجب كبير يعني أنك تستهلكها أسرع مما تملك — زدها. سالب كبير يعني رفّاً راكداً.</span></div>`;
}

function confirmDelete(key) {
  const r = allRecipes().find(x => RKEY(x) === key); if (!r) return;

        if (gone) {

     </div>
     <div class="grp"><h4>حجم العبوة</h4>
       <div class="chip-grid">${[50,100,200,250].map(g =>
         `<button class="qchip ${pack === g ? 'on' : ''}" data-pk="${g}">${g}غ</button>`).join('')}</div></div>
     <div class="grp"><h4>تصحيح يدوي</h4>
       <div class="search"><input id="tinRem" type="number" min="0" max="${pack}" value="${Math.round(i.remG)}" style="padding-inline-start:14px"></div>
       <div class="src" style="margin-top:8px"><span>لو وزنت العلبة فعلياً واختلف الرقم.</span></div></div>
     <div style="display:flex;gap:10px;margin-top:18px">
       <button class="btn ghost" id="tinOk">احفظ التصحيح</button>
       <button class="btn solid" id="tinNew">اشتريت علبة جديدة</button>
     </div>`;
    sBody.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => { pack = +b.dataset.pk; draw(); });
    document.getElementById('tinNew').onclick = () => { refill(id, pack); openTin(id); renderLog(); toast(`عبوة ${pack}غ جديدة`, 'ok'); };
    document.getElementById('tinOk').onclick = () => {
      i.packG = pack;
      i.remG = Math.max(0, Math.min(pack, +document.getElementById('tinRem').value || 0));
      // consumed is derived from what is actually left, so a manual correction
      // keeps the two numbers consistent instead of drifting apart
      i.usedG = Math.max(0, pack - i.remG);
      save(true); openSheet(id); renderList(); renderLog(); toast('حُدّث المخزون', 'ok');
    };
  };
  draw();
  scrim.classList.add('on'); sheet.classList.add('on'); document.body.style.overflow = 'hidden';
}

function openAddFlavor() {
  let fam = 'base', pack = 200, nameVal = '', brandVal = '', subVal = '', matchedTemplate = null;
  const draw = () => {
    sBody.innerHTML = `
     <div class="sh-title">نكهة جديدة</div>
     <div class="sh-sub">تُضاف لمكتبتك ويعرفها المحرك فوراً</div>
     <div class="grp"><h4>الاسم والبراند</h4>
       <div class="search" style="margin-bottom:2px"><input id="nfName" type="text" placeholder="الاسم بالإنجليزية" style="padding-inline-start:14px" value="${nameVal.replace(/"/g,'&quot;')}" autocomplete="off"></div>
       <div id="nfSuggest"></div>
       ${matchedTemplate ? `<div class="src" style="margin:8px 0 0"><span style="color:var(--ok)">✓ مطابقة لـ«${matchedTemplate.name}» — كل البيانات نُسخت، عدّل أي حقل إذا حبيت</span></div>` : ''}
       <div class="search" style="margin-top:9px"><input id="nfBrand" type="text" placeholder="البراند" style="padding-inline-start:14px" value="${brandVal.replace(/"/g,'&quot;')}"></div></div>
     <div class="grp"><h4>العائلة</h4>
       <div class="chip-grid">${FAM.map(k => `<button class="qchip ${fam === k ? 'on' : ''}" data-nf="${k}">${FAM_AR[k]}</button>`).join('')}</div></div>
     <div class="grp"><h4>العائلة الطعمية</h4>
       <div class="search"><input id="nfSub" type="text" placeholder="مثال: مانجو وباشن" style="padding-inline-start:14px" value="${subVal.replace(/"/g,'&quot;')}"></div></div>
     <div class="grp"><h4>المحاور</h4>
       ${[['power','القوة'],['sweet','الحلاوة'],['acid','الحموضة'],['cool','التبريد'],['density','الكثافة']]
         .map(([k,ar]) => `<div class="axis"><span class="lbl">${ar}</span>
           <span class="chip-grid" style="flex:1">${[1,2,3,4,5].map(n =>
             `<button class="qchip nfax" data-ax="${k}" data-v="${n}" style="padding:5px 10px">${n}</button>`).join('')}</span></div>`).join('')}
     </div>
     <div class="grp"><h4>حجم العبوة</h4>
       <div class="chip-grid">${[50,100,200,250].map(g => `<button class="qchip ${pack === g ? 'on' : ''}" data-pk="${g}">${g}غ</button>`).join('')}</div></div>
     <div style="display:flex;gap:10px;margin-top:18px">
       <button class="btn ghost" id="nfNo">إلغاء</button>
       <button class="btn solid" id="nfOk">أضف</button>
     </div>`;
    const vals = matchedTemplate
      ? { power: matchedTemplate.power, sweet: matchedTemplate.sweet, acid: matchedTemplate.acid, cool: matchedTemplate.cool, density: matchedTemplate.density }
      : { power: 3, sweet: 3, acid: 2, cool: 0, density: 3 };
    const paint = () => sBody.querySelectorAll('.nfax').forEach(b =>
      b.classList.toggle('on', +b.dataset.v === vals[b.dataset.ax]));
    paint();
    sBody.querySelectorAll('.nfax').forEach(b => b.onclick = () => { vals[b.dataset.ax] = +b.dataset.v; paint(); });
    sBody.querySelectorAll('[data-nf]').forEach(b => b.onclick = () => { fam = b.dataset.nf; draw(); });
    sBody.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => { pack = +b.dataset.pk; draw(); });
    document.getElementById('nfNo').onclick = closeSheet;

    const nameInput = document.getElementById('nfName');
    const suggestBox = document.getElementById('nfSuggest');
    nameInput.oninput = e => {
      nameVal = e.target.value;
      if (matchedTemplate && matchedTemplate.name !== nameVal) matchedTemplate = null;
      const q = nameVal.trim().toLowerCase();
      if (q.length < 2) { suggestBox.innerHTML = ''; return; }
      const matches = DATA.flavors.filter(f => f.name.toLowerCase().includes(q)).slice(0, 5);
      suggestBox.innerHTML = matches.length ? `<div class="nf-suggest">${matches.map(f => `
        <div class="nf-sug-row" data-sug="${f.id}">
          <span class="stripe" style="background:${famColor(f.family)}"></span>
          <span class="main"><span class="nm"><bdi>${f.name}</bdi></span><span class="meta"><bdi>${f.brand}</bdi> · ${f.subfamily}</span></span>
        </div>`).join('')}</div>` : '';
      suggestBox.querySelectorAll('[data-sug]').forEach(row => row.onclick = () => {
        const f = DATA.flavors.find(x => x.id === row.dataset.sug); if (!f) return;
        matchedTemplate = f; nameVal = f.name; brandVal = f.brand; subVal = f.subfamily; fam = f.family;
        draw();
      });
    };
    nameInput.onblur = () => setTimeout(() => { if (suggestBox) suggestBox.innerHTML = ''; }, 150);
    document.getElementById('nfBrand').oninput = e => { brandVal = e.target.value; };
    document.getElementById('nfSub').oninput = e => { subVal = e.target.value; };

    document.getElementById('nfOk').onclick = () => {
      const name = (document.getElementById('nfName').value || '').trim();
      if (!name) { toast('الاسم مطلوب.', 'warn'); return; }
      const id = 'u-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + Date.now().toString(36);
      const brand = (document.getElementById('nfBrand').value || '').trim() || '—';
      const subfamily = (document.getElementById('nfSub').value || '').trim() || FAM_AR[fam];
      const nf = matchedTemplate
        ? { ...matchedTemplate, id, name, brand, family: fam, subfamily, ...vals, userAdded: true }
        : {
            id, name, brand, family: fam, subfamily,
            ...vals, ceiling: 3, ceilingAr: 'متوسط', volatility: 3, volatilityAr: 'متوسط',
            duration: 3, durationAr: 'متوسطة', role: 'رئيسية', roles: ['main'], roleStrict: false,
            idealPct: 30, idealG: 6, minPct: 25, maxPct: 40, hardCap: null,
            official: '', officialConf: '', note: '', userAdded: true,
          };
      applyBridgeRole(nf);
      DATA.flavors.push(nf);
      STATE.userFlavors = (STATE.userFlavors || []).concat([nf]);
      STATE.inventory[id] = { packG: pack, remG: pack, usedG: 0, uses: 0, firstUsed: null, lastUsed: null, purchases: [] };
      save(true); closeSheet(); renderChips(); renderList(); renderLog();
      toast(`أُضيفت «${name}»`, 'ok');
    };
  };
  draw();
  scrim.classList.add('on'); sheet.classList.add('on'); document.body.style.overflow = 'hidden';
}

/* =======================================================================
   SETTINGS / STORAGE SHEET
   ======================================================================= */
const BACKEND_AR = { artifact: 'مساحة المعاينة', indexeddb: 'IndexedDB داخل جهازك', memory: 'الذاكرة المؤقتة فقط' };

function openSettings() {
  const lows = DATA.flavors.filter(f => isLow(f.id));
  const used = DATA.flavors.filter(f => invOf(f.id).remG < invOf(f.id).packG).length;
  const d = daysSinceBackup();
  const warn = Backend.name === 'memory';

  sBody.innerHTML = `
   <div class="sh-title">التخزين والنسخ الاحتياطي</div>
   <div class="sh-sub">كل تعديل يُحفظ تلقائياً بعد جزء من الثانية</div>

   <div class="grp"><h4>العمل بلا إنترنت</h4>
     <div class="note">${
       location.protocol === 'file:'
         ? 'الملف مفتوح مباشرة من الجهاز — لا تثبيت ولا عمل خلفي. ارفعه على استضافة HTTPS ليصبح تطبيقاً قابلاً للتثبيت.'
         : ('serviceWorker' in navigator && navigator.serviceWorker.controller)
           ? '✓ مُفعّل — التطبيق محفوظ كاملاً على جهازك ويعمل في وضع الطيران.'
           : 'قيد التهيئة — أعد التحميل مرة واحدة وأنت متصل ليكتمل.'
     }</div>
     ${window.matchMedia('(display-mode: standalone)').matches || navigator.standalone
       ? '<div class="src" style="margin-top:9px"><span style="color:var(--ok)">✓ مُثبَّت على الشاشة الرئيسية — بياناتك محمية من التنظيف التلقائي</span></div>'
       : '<div class="src" style="margin-top:9px"><span style="color:var(--warn)">غير مُثبَّت — أضفه للشاشة الرئيسية من زر المشاركة في Safari</span></div>'}
   </div>

   <div class="grp"><h4>مكان الحفظ</h4>
     <div class="note">${BACKEND_AR[Backend.name]}${warn ? ' — <b style="color:var(--danger)">لن يبقى بعد إغلاق الصفحة.</b> بعد رفع التطبيق وتثبيته على الشاشة الرئيسية سينتقل تلقائياً إلى التخزين الدائم.' : ' — يبقى بعد إغلاق التطبيق وبلا إنترنت.'}</div>
     <div class="src" style="margin-top:9px"><span>عدد عمليات الحفظ: <b class="num">${STATE.meta.saves}</b></span></div>
   </div>

   <div class="grp"><h4>المخزون</h4>
     <div class="sh-strip">
       <div class="box"><div class="k">نكهات مفتوحة</div><div class="v num">${used} / ${DATA.flavors.length}</div></div>
       <div class="box"><div class="k">قاربت النفاد</div><div class="v num" style="${lows.length ? 'color:var(--warn)' : ''}">${lows.length}</div></div>
     </div>
     ${lows.length ? `<div class="alert dup" style="margin-top:10px"><b>تحت ${STATE.settings.lowPct}%</b><p>${lows.map(f => `<bdi>${f.name}</bdi>`).join(' · ')}</p></div>` : ''}
   </div>

   <div class="grp"><h4>نسخة احتياطية</h4>
     ${d === Infinity
       ? `<div class="alert dup"><b>لم تأخذ نسخة بعد</b><p>صدّر ملفاً واحتفظ به — يحميك من فقدان سنة من التجارب.</p></div>`
       : d >= 30
         ? `<div class="alert dup"><b>مضى ${d} يوماً</b><p>وقت مناسب لنسخة جديدة.</p></div>`
         : `<div class="note">آخر نسخة قبل ${d} ${d === 1 ? 'يوم' : 'أيام'}.</div>`}
     <div style="display:flex;gap:10px;margin-top:12px">
       <button class="btn solid" id="stExport">تصدير</button>
       <button class="btn ghost" id="stImport">استيراد</button>
     </div>
     <input type="file" id="stFile" accept="application/json" style="display:none">
     <div class="src" style="margin-top:10px"><span>الاستيراد يستبدل كل شيء بمحتوى الملف.</span></div>
   </div>`;

  scrim.classList.add('on'); sheet.classList.add('on'); document.body.style.overflow = 'hidden';

  document.getElementById('stExport').onclick = () => { exportBackup(); openSettings(); };
  const fi = document.getElementById('stFile');
  document.getElementById('stImport').onclick = () => fi.click();
  fi.onchange = () => {
    if (!fi.files[0]) return;
    importBackup(fi.files[0], ok => {
      if (!ok) { toast('تعذّرت قراءة الملف — تأكد أنه نسخة من هذا التطبيق.', 'warn'); return; }
      toast('استُعيدت النسخة الاحتياطية', 'ok'); openSettings(); renderList(); renderBuild();
    });
  };
}

document.getElementById('settingsBtn').onclick = () => { clearSheetStack(); openSettings(); };

/* ---------- persist the build draft, restore it on load ---------- */
function saveDraft(){
  STATE.draft = BUILD.picks.length ? BUILD.picks.map(p=>({id:p.f.id,pct:p.pct})) : null;
  save();
}
const _rb = renderBuild;
renderBuild = function(){ _rb(); saveDraft(); };

bootStorage().then(()=>{
  if(STATE.draft){
    BUILD.picks = STATE.draft
      .map(d=>({f:DATA.flavors.find(x=>x.id===d.id), pct:d.pct}))
      .filter(p=>p.f);
  }
  STATE.ratings = STATE.ratings || {};
  renderBuild();
  renderList();
  STATE.edits = STATE.edits || {};
  (STATE.userFlavors || []).forEach(f => { if (!DATA.flavors.some(x => x.id === f.id)) DATA.flavors.push(f); });
  applyBridgeRolesToLibrary();
  renderChips();
  renderRecipes();
  if (STATE.session) { renderSession(); renderTabs(); }
  renderHome();
  renderLog();
  updateBackupBadge();
  registerSW();
});

/* ---------- offline capability ---------- */
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol === 'file:') return;   // needs http(s); nothing to do locally
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (!w) return;
      w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) {
          toast('نسخة جديدة جاهزة — أعد فتح التطبيق', 'ok');
        }
      });
    });
  }).catch(() => {});
}
