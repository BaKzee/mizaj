/* =======================================================================
   ACTIVE SESSION — one tap per entry, nothing typed unless you want to
   ======================================================================= */
let sesTimer = null, wakeLock = null;

const mins = () => STATE.session ? Math.floor((Date.now() - STATE.session.start) / 60000) : 0;
const secs = () => STATE.session ? Math.floor((Date.now() - STATE.session.start) / 1000) % 60 : 0;
const curPhase = () => PHASES.find(p => mins() >= p.from && mins() < p.to) || PHASES[2];

async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (wakeLock) { wakeLock.release(); wakeLock = null; }
  } catch {}
}

function startSession(key) {
  if (STATE.session) { toast('هناك جلسة نشطة بالفعل.', 'warn'); return; }
  const r = allRecipes().find(x => RKEY(x) === key);
  STATE.session = { key, name: r.name, start: Date.now(), coalCount: 2.5, coalStart: 2.5, coals: [], rotations: [], marks: [], phaseChecks: [], phaseBuzzed: {} };
  save(true);
  closeSheet();
  keepAwake(true);
  primeAudio();
  renderSession();
  renderTabs();
  goTo('session');
  renderHome();
  toast('بدأت الجلسة — الشاشة ستبقى مضاءة', 'ok');
}

/* A short, quiet ember drift to close a session out. Purely decorative, so it
   is skipped entirely when the user asks for reduced motion. */
function celebrate() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const w = document.createElement('div');
  w.className = 'celebrate';
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('i');
    p.style.left = (12 + Math.random() * 76) + '%';
    p.style.animationDelay = (Math.random() * 0.5) + 's';
    w.appendChild(p);
  }
  document.body.appendChild(w);
  setTimeout(() => w.remove(), 2200);
}

/* آخر لحظة تفاعلتَ فيها فعلاً مع الجلسة: تدوير أو فحمة أو ملاحظة.
   إن نسيتها مفتوحة، ننهيها عند هذه اللحظة لا عند لحظة الاكتشاف — وإلا
   سُجّلت جلسة بثلاث ساعات وهمية أفسدت متوسطاتك. */
function lastActivityTs(s) {
  const ts = [s.start,
    ...(s.rotations || []),
    ...(s.coals || []).map(c => c.ts),
    ...(s.marks || []).map(x => x.ts)].filter(Boolean);
  return Math.max(...ts);
}

/* نغمة قصيرة مولّدة برمجياً — لا ملف صوت خارجي يعطّل العمل بلا إنترنت.
   iOS يمنع الصوت قبل أول لمسة، لذا نهيّئ السياق عند بدء الجلسة. */
let audioCtx = null;
function primeAudio() {
  if (audioCtx || !STATE.settings.sound) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { audioCtx = null; }
}
function beep(times = 2) {
  if (!STATE.settings.sound || !audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  for (let n = 0; n < times; n++) {
    const t0 = audioCtx.currentTime + n * 0.42;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(660, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.22, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.34);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + 0.36);
  }
  if (navigator.vibrate) { try { navigator.vibrate([180, 90, 180]); } catch {} }
}

/* ينطلق مرة واحدة لكل دورة، لا كل ثانية بينما التدوير مستحق */
function checkRotationAlert() {
  const s = STATE.session; if (!s) return;
  const lastRot = s.rotations.length ? s.rotations[s.rotations.length - 1] : s.start;
  const due = (Date.now() - lastRot) / 60000 >= rotateEvery();
  const cycle = s.rotations.length;
  if (due && s.alertedCycle !== cycle) { s.alertedCycle = cycle; beep(2); }
  if (!due && s.alertedCycle !== undefined && s.alertedCycle !== cycle) s.alertedCycle = undefined;
}

function checkForgottenSession() {
  const s = STATE.session; if (!s || s.extendedTo === -1) return;
  if (!STATE.sessions) STATE.sessions = [];
  // كل وصفة توثّق مداها الزمني: وصفة قهوة تمتد 110 دقيقة بينما منعشة تنتهي عند 75،
  // فسقف واحد لكل الوصفات كان يقطع الطويلة ويترك القصيرة مفتوحة ساعة بلا داعٍ.
  const rec = allRecipes().find(x => RKEY(x) === s.key);
  const cap = (rec && rec.minHi) ? rec.minHi : (STATE.settings.sessionCapMin || 90);
  const m = mins();
  const limit = s.extendedTo || cap;

  if (m >= limit + 30) {                       // مهلة سماح ثم إنهاء تلقائي
    const end = lastActivityTs(s);
    s.autoEnded = true;
    s.end = end;
    s.minutes = Math.max(1, Math.round((end - s.start) / 60000));
    clearInterval(sesTimer); sesTimer = null; keepAwake(false);
    STATE.sessions.push(s);
    STATE.session = null;
    save(true);
    renderSession(); renderRecipes(); renderHome(); renderLog(); renderTabs();
    if (document.querySelector('.screen.active') === sesScreen) goTo('recipes');
    toast(`أُغلقت الجلسة تلقائياً عند ${s.minutes} دقيقة — آخر نشاط مسجّل`, 'warn');
    return;
  }
  if (m >= limit && !document.getElementById('sesStillOn')) {
    const bar = document.createElement('div');
    bar.id = 'sesStillOn';
    bar.className = 'still-bar';
    bar.innerHTML = `<span>تجاوزت ${limit} دقيقة — ما زلت مستمراً؟</span>
      <button id="sesYes">نعم</button><button id="sesNo">أنهِها</button>`;
    document.body.appendChild(bar);
    document.getElementById('sesYes').onclick = () => {
      s.extendedTo = mins() + cap; save(true); bar.remove();
      toast('تمام — سنسأل مجدداً بعد ' + cap + ' دقيقة', 'ok');
    };
    document.getElementById('sesNo').onclick = () => { bar.remove(); endSession(true); };
  }
  if (m < limit) { const b = document.getElementById('sesStillOn'); if (b) b.remove(); }
}

function endSession(rate) {
  const b = document.getElementById('sesStillOn'); if (b) b.remove();
  const s = STATE.session; if (!s) return;
  clearInterval(sesTimer); sesTimer = null; keepAwake(false);
  s.end = Date.now();
  s.minutes = Math.round((s.end - s.start) / 60000);
  STATE.sessions.push(s);
  const key = s.key;
  STATE.session = null;
  // إجابات هذه الجلسة تدخل القياس الآن (الجلسة الجارية لا تُحسب قبل انتهائها)
  try {
    const before = new Set(DATA.flavors.filter(f => f.measured).map(f => f.id));
    applyMeasured();
    const nu = DATA.flavors.filter(f => f.measured && !before.has(f.id));
    if (nu.length) setTimeout(() => toast(`صارت مقاسة منك: ${nu.map(f => f.name).join('، ')}`, 'ok'), 2600);
  } catch (e) { console.error('applyMeasured', e); }
  save(true);
  celebrate();
  renderSession();
  renderRecipes();
  renderHome();
  if (document.querySelector('.screen.active') === sesScreen) goTo('recipes');
  renderTabs();
  if (rate) { clearSheetStack(); openRate(key, s); }
}

/* عند دخول القلب (د15) والقاع (د40) نسأل مرة واحدة فقط لكل مرحلة:
   "أي مكوّن تسمعه الآن؟" — اهتزاز خفيف مميّز، وسؤال غير حاجب يُطوى تلقائياً بعد الإجابة
   أو التجاهل. الإجابة تُحفظ في s.phaseChecks للتحليل لاحقاً، وتُدرَج أيضاً في
   s.marks كي تظهر في الخط الزمني للجلسة مثل أي ملاحظة أخرى. */
function pendingPhaseCheck(s) {
  const boundaries = [PHASES[0].to, PHASES[1].to]; // 15، 40
  const m = mins();
  for (const b of boundaries) {
    if (m >= b && !s.phaseChecks.some(x => x.at === b)) return b;
  }
  return null;
}
function answerPhaseCheck(s, at, flavorId, flavorName) {
  const ph = curPhase();
  s.phaseChecks.push({ at, phase: ph.name, m: mins(), id: flavorId || null });
  if (flavorId) s.marks.push({ k: '🎯 ' + flavorName, m: mins(), phase: ph.name, ts: Date.now() });
  save(); renderSession();
  toast(flavorId ? `سُجّل: ${flavorName}` : 'تجاوزتها');
}

/* renderSession used to be the only entry point — if anything inside it
   threw (a stale recipe reference, an odd session shape from an older
   app version, etc.), the session screen was left blank/stale with no
   way to open it AND no way to cancel the session, since starting a new
   one is correctly blocked while one is "active". This wrapper guarantees
   there is always at least a way out: Cancel or End. */
function renderSession() {
  try {
    renderSessionInner();
  } catch (e) {
    console.error('renderSession failed — showing minimal fallback:', e);
    const s = STATE.session;
    if (!s) { sesScreen.innerHTML = ''; return; }
    sesScreen.innerHTML = `
      <div class="alert ban" style="margin-bottom:14px">
        <b>تعذّر عرض تفاصيل الجلسة</b>
        <p>الجلسة ما زالت مسجّلة، لكن صار خطأ بعرض تفاصيلها. تقدر تنهيها أو تلغيها من هنا.</p>
      </div>
      <div style="display:flex;gap:10px;margin:18px 0 6px">
        <button class="btn ghost" id="sCancel">ألغِ</button>
        <button class="btn solid" id="sEnd">أنهِ وقيّم</button>
      </div>`;
    const cancelBtn = document.getElementById('sCancel');
    if (cancelBtn) cancelBtn.onclick = () => {
      if (sesTimer) { clearInterval(sesTimer); sesTimer = null; }
      keepAwake(false);
      STATE.session = null; save(true); renderRecipes(); renderHome();
      toast('أُلغيت الجلسة');
    };
    const endBtn = document.getElementById('sEnd');
    if (endBtn) endBtn.onclick = () => endSession(true);
  }
}

function renderSessionInner() {
  const s = STATE.session;
  if (!s) { sesScreen.innerHTML = ''; return; }
  const r = allRecipes().find(x => RKEY(x) === s.key);
  const m = mins(), ph = curPhase(), items = r ? liveItems(r) : [];
  const coach = r ? coachFor(r) : null, steps = sessionSteps(s, coach), target = coachTargetAt(coach, m);
  const nextStep = steps.find(c => c.at > m);
  const dueStep = steps.filter(c => c.at <= m).pop();
  const lastRot = s.rotations.length ? Math.floor((Date.now() - s.rotations[s.rotations.length - 1]) / 60000) : m;
  const rotDue = lastRot >= rotateEvery();
  const ROT_TARGET = 6;
  const rotPct = Math.min(100, Math.round(s.rotations.length / ROT_TARGET * 100));
  const pendingAt = pendingPhaseCheck(s);
  if (pendingAt != null && !s.phaseBuzzed[pendingAt]) {
    s.phaseBuzzed[pendingAt] = true;
    try { navigator.vibrate && navigator.vibrate([25, 40, 25]); } catch {}
    beep(1);   // آيفون لا يدعم الاهتزاز من المتصفح — التنبيه الصوتي هو البديل (فعّله من زر الصوت)
    save();
  }

  sesScreen.innerHTML = `
    <div class="rot-progress${rotDue ? ' due' : ''}" title="دورة ${s.rotations.length} من ${ROT_TARGET} — نموذجية لجلسة ٩٠ دقيقة"><span style="width:${rotPct}%"></span></div>
    <div class="src" style="margin:-8px 0 14px"><span>دورة <b class="num">${s.rotations.length}</b> من ${ROT_TARGET} نموذجية${rotDue ? ' · <b style="color:var(--danger)">حان وقت التدوير</b>' : ''}</span></div>
    <div class="ses-head">
      <div class="ses-name"><bdi>${s.name}</bdi></div>
      <div class="ses-clock num">${String(m).padStart(2,'0')}:${String(secs()).padStart(2,'0')}</div>
      <div class="ses-phase">${ph.name} · ${ph.hint}</div>
      <div class="ses-track">${PHASES.map(p => {
        const active = p === ph, done = m >= p.to;
        return `<span class="${active ? 'on' : done ? 'done' : ''}"></span>`;
      }).join('')}</div>
    </div>

    ${pendingAt != null ? `<div class="alert ban" id="phaseCheck" style="margin-bottom:10px">
      <b>دخلنا ${curPhase().name} — أيّ مكوّن تسمعه الآن؟</b>
      <div class="chip-grid" style="margin-top:9px">
        ${items.map(i => `<button class="qchip" data-pf="${i.f.id}" data-pn="${i.f.name.replace(/"/g,'&quot;')}">${i.f.name}</button>`).join('')}
        <button class="qchip" data-pf="" data-pn="">لا شيء واضح</button>
      </div></div>` : ''}
    ${rotDue ? `<div class="alert ban" style="margin-bottom:10px"><b>وقت التدوير — مضت ${lastRot} دقيقة</b><p>${ROTATE_HOW}</p></div>` : ''}
    ${m >= 35 ? `<div class="note" style="margin-bottom:10px">بعد نصف ساعة يخفّ وهج الفحم — قرّبه للمركز قليلاً بدل إضافة فحمة جديدة.</div>` : ''}
    ${dueStep ? `<div class="note" style="margin-bottom:10px"><b>الدقيقة ${dueStep.at}:</b> ${dueStep.t}</div>` : ''}
    ${nextStep ? `<div class="src" style="margin-bottom:12px"><span>التالي عند الدقيقة ${nextStep.at}${nextStep.coach ? ` — منحناك ${nextStep.coach}` : ''}</span></div>` : ''}
    <button class="btn ghost" id="sLock" style="width:100%;margin:0 0 12px;padding:9px 0;font-size:13px">⏱ مواعيد الجلسة على شاشة القفل${(() => { const n = lockEvents(s, coach).length; return n ? ` (${n})` : ''; })()}</button>

    <div class="ses-actions">
      <button class="sbtn ${rotDue ? 'due' : ''}" id="sRotate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M20.5 12a8.5 8.5 0 1 1-3-6.5"/><path d="M21 3v5h-5"/></svg>
        <span>دوّر الفحم</span><b class="num">${s.rotations.length}</b>
      </button>
      <button class="sbtn" id="sSound" style="flex:0 0 auto;padding:14px 12px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:${STATE.settings.sound ? 'var(--ember)' : 'var(--ink-soft)'}">
          <path d="M11 5 6 9H3v6h3l5 4z"/>${STATE.settings.sound
            ? '<path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>'
            : '<path d="M17 9l4 6M21 9l-4 6"/>'}</svg>
        <span style="font-size:10.5px">${STATE.settings.sound ? 'المنبّه يعمل' : 'المنبّه مطفأ'}</span>
      </button>
      <div class="sbtn coalbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 3c3 3 5 6 5 9a5 5 0 0 1-10 0c0-1.5.5-2.5 1.5-4 .3 1 1 1.5 1.5 1 .5-3 .5-4.5 2-6z"/></svg>
        <span>الفحم الآن</span>
        <span class="stepper" style="background:none;padding:0">
          <button id="sCoalDn" ${s.coalCount > 0 ? '' : 'disabled'}>−</button>
          <b class="num" style="font-size:17px;color:var(--ember)">${s.coalCount}</b>
          <button id="sCoalUp" ${s.coalCount < 4 ? '' : 'disabled'}>+</button>
        </span>

  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

  sesScreen.querySelectorAll('[data-mark]').forEach(b => b.onclick = () => {

  const lockBtn = document.getElementById('sLock');
  if (lockBtn) lockBtn.onclick = () => sendLockTimers(s, coach);

  if (!sesTimer) sesTimer = setInterval(() => {
    if (!STATE.session) return;

/* =======================================================================
   شاشة القفل والـ Dynamic Island: لا يصل لها تطبيق ويب على الآيفون — Apple
   تحصرها بالتطبيقات الأصلية. الأقرب الحقيقي: مؤقتات تطبيق الساعة نفسه، فهي
   تظهر على شاشة القفل والـ Dynamic Island بعدّ تنازلي وترنّ حتى على الصامت.
   التطبيق يرسل المواعيد الباقية لاختصار واحد («مؤقت المزاج») يجهّزه مرة،
   والاختصار يبدأ مؤقتاً لكل موعد (iOS 17 فأحدث يسمح بعدة مؤقتات).
   ======================================================================= */
function lockEvents(s, coach) {
  if (!s) return [];
  const now = (Date.now() - s.start) / 60000, ev = [];
  sessionSteps(s, coach).forEach(x => { if ((x.at === 4 || x.coach) && x.at > now + 0.5) ev.push({ at: x.at, k: x.coach ? `فحم ${x.coach}` : 'نصف فحمة' }); });
  [15, 40].forEach(b => { if (b > now + 0.5 && !(s.phaseChecks || []).some(c => c.at === b)) ev.push({ at: b, k: 'أي نكهة تسمع؟' }); });
  if (STATE.settings.lockRot) {
    const last = s.rotations.length ? (s.rotations[s.rotations.length - 1] - s.start) / 60000 : 0;
    for (let t = last + ROTATE_EVERY; t <= 120; t += ROTATE_EVERY) if (t > now + 0.5) ev.push({ at: Math.round(t), k: 'تدوير' });
  }
  const uniq = [...new Map(ev.map(e => [e.at, e])).values()].sort((a, b) => a.at - b.at);
  return uniq.map(e => ({ ...e, inMin: Math.max(1, Math.round(e.at - now)) }));
}
function runLockShortcut(list) {
  const name = STATE.settings.lockName || 'مؤقت المزاج';
  location.href = `shortcuts://run-shortcut?name=${encodeURIComponent(name)}&input=text&text=${encodeURIComponent(list.join(','))}`;
}
function sendLockTimers(s, coach) {
  const ev = lockEvents(s, coach);
  if (!STATE.settings.lockReady) { openLockSetup(s, coach); return; }
  if (!ev.length) { toast('لا مواعيد باقية في هذه الجلسة'); return; }
  toast(`${ev.length} مؤقتات: ${ev.map(e => `${e.k} بعد ${e.inMin}د`).join(' · ')}`, 'ok');
  setTimeout(() => runLockShortcut(ev.map(e => e.inMin)), 600);
}

/* =======================================================================
   RECIPE EDITS — in place
   One card, one rating history. The original stays recoverable and the
   difference is always on screen.
   ======================================================================= */
const editOf = key => (STATE.edits || {})[key] || null;

/* the items actually in play: the newest edit, else the book's own */
function liveItems(r) {
  const e = editOf(RKEY(r));
  return e ? e.items.map(i => ({
    f: flavorById(i.id) || { name: '?', family: 'base', subfamily: '' },
    pct: i.pct,
  })) : recipeItems(r);
}

/* الخلطة التي كانت في البول وقت تقييمٍ ما: تعديلك إن كان قبله، وإلا نسخة
   الكتاب السارية يومها (recipe.history)، وإلا الحالية. بدون هذا يُنسب تقييم
   أغسطس لمكوّنات لم تدخّنها، فيتعلّم ملف الذوق من نسخة لم تجرّبها. */
const sigOf = items => items.map(i => (i.f.id || i.f.name) + ':' + i.pct).sort().join('|');
function itemsAt(r, ts) {
  const e = editOf(RKEY(r));
  if (e && (ts == null || ts >= (e.ts || 0))) return liveItems(r);
  const h = ts == null ? null : (r.history || []).filter(v => ts < v.until).sort((a, b) => a.until - b.until)[0];
  return h ? recipeItems(h) : recipeItems(r);
}
const onCurrent = (r, ts) => sigOf(itemsAt(r, ts)) === sigOf(liveItems(r));
function currentRatings(k) {
  const r = allRecipes().find(x => RKEY(x) === k);
  return r ? ratingsOf(k).filter(x => onCurrent(r, x.ts)) : ratingsOf(k);
}
const meanStars = rs => rs.length ? rs.reduce((s, x) => s + x.stars, 0) / rs.length : null;
/* كل تقييم مع الخلطة التي دُخّنت فعلاً — وصفة قُيّمت بنسختين = وحدتان */
function ratedUnits() {
  const out = [];
  Object.entries(STATE.ratings || {}).forEach(([k, rs]) => {
    if (!rs.length) return;
    const r = allRecipes().find(x => RKEY(x) === k); if (!r) return;
    const g = new Map();
    rs.forEach(x => {
      const items = itemsAt(r, x.ts), sg = sigOf(items);
      if (!g.has(sg)) g.set(sg, { k, r, sig: sg, items: items.filter(i => i.f && i.f.id), rs: [] });
      g.get(sg).rs.push(x);
    });
    g.forEach(u => out.push(u));
  });
  return out;
}

/* what changed, in words */
function diffItems(orig, now) {
  const o = new Map(orig.map(i => [i.f.id, i.pct]));
  const n = new Map(now.map(i => [i.f.id, i.pct]));
  const nm = id => (flavorById(id) || {}).name || '?';
  const out = [];
  o.forEach((pct, id) => {
    if (!n.has(id)) out.push({ t: 'out', s: `حُذفت ${nm(id)} (${pct}%)` });
    else if (n.get(id) !== pct) out.push({ t: 'chg',
      s: `${nm(id)}: من <bdi dir="ltr">${pct}%</bdi> إلى <bdi dir="ltr">${n.get(id)}%</bdi>`, d: n.get(id) - pct });
  });
  n.forEach((pct, id) => { if (!o.has(id)) out.push({ t: 'in', s: `أُضيفت ${nm(id)} (${pct}%)` }); });
  return out;
}

            ${!c.e.hard ? `${starsHTML(c.e.score)}` : ''}</span>
            ${phaseLineHTML(c.f)}
            <span class="meta"><span class="sub">${c.f.subfamily}</span>${c.e.issues.length ? `<span class="why"><span class="sep"> · </span><span style="color:${c.e.hard ? 'var(--danger)' : sevColor(c.e.issues[0].sev)}">${c.e.issues[0].t}</span></span>` : ''}</span></span>
        </div>`).join('') || '<div class="empty">لا نكهة متاحة.</div>';
      sBody.querySelectorAll('[data-vpick]').forEach(b => b.onclick = () => {
        const f = DATA.flavors.find(x => x.id === b.dataset.vpick);
        // allowed, but deliberately felt: a hard conflict is a choice, not an accident
        if (b.classList.contains('dim')) haptic('warn');
        if (swapIdx !== null) items[swapIdx].f = f;
        else items.push({ f, pct: 10 });
        swapIdx = null; addOpen = false; draw();
      });
    }

    document.getElementById('vCancel').onclick = () => openRecipe(key);
    const rev = document.getElementById('vRevert');
    if (rev) rev.onclick = () => {
      delete STATE.edits[key]; save(true); openRecipe(key); renderRecipes();
      toast('أُعيدت للأصل — تقييماتك محفوظة', 'ok');
    };
    document.getElementById('vSave').onclick = () => {
      const reason = (document.getElementById('vReason').value || '').trim();
      if (!reason) { toast('اكتب سبب التعديل.', 'warn'); return; }
      STATE.edits = STATE.edits || {};
      STATE.edits[key] = { ts: Date.now(), reason, items: items.map(i => ({ id: i.f.id, pct: i.pct })) };
      save(true);
      openRecipe(key); renderRecipes(); renderHome();
      toast('حُفظ التعديل — البطاقة نفسها', 'ok');
    };
  };
  draw();
  scrim.classList.add('on'); sheet.classList.add('on'); document.body.style.overflow = 'hidden';
}

/* =======================================================================
   RECOMMENDATIONS
   Untried recipes ranked by what BaKzee's own ratings reveal he likes,
   then by whether the recipe is structurally sound. Deterministic per day.
   ======================================================================= */
/* ما تعلّمه التطبيق من كل تقييماتك مجتمعة — لا وصفة وصفة. النكهة تُحسب
   بوزن نسبتها في الوصفة، فنكهة بـ40% تؤثر أكثر من لمسة بـ10%. */
function tasteProfile() {
  const units = ratedUnits();
  if (!units.length) return null;
  const fl = {}, fam = {}, chips = {}, cond = [];
  units.forEach(({ k, r, items, sig, rs }) => {
    const avg = rs.reduce((a, x) => a + x.stars, 0) / rs.length;
    items.forEach(i => {
      const w = i.pct / 100;
      (fl[i.f.id] = fl[i.f.id] || { f: i.f, sum: 0, w: 0, ks: new Set() });
      fl[i.f.id].sum += avg * w; fl[i.f.id].w += w; fl[i.f.id].ks.add(k);
      (fam[i.f.family] = fam[i.f.family] || { sum: 0, w: 0 });
      fam[i.f.family].sum += avg * w; fam[i.f.family].w += w;
    });
    rs.forEach(x => (x.chips || []).forEach(c => { chips[c] = (chips[c] || 0) + 1; }));
    // الجلسات المُدخلة يدوياً لا تحمل قياساً حقيقياً للفحم أو التدوير،
    // فإدخالها في التحليل يلوّث الارتباط بقيم افتراضية متطابقة.
    (STATE.sessions || []).filter(s => s.key === k && !s.manual && s.coalCount != null
        && sigOf(itemsAt(r, s.start)) === sig)
      .forEach(s => cond.push({ avg, coal: s.coalCount, rot: (s.rotations || []).length }));
  });
  const score = o => o.sum / o.w;
  const flavors = Object.values(fl).filter(o => o.w > 0)
    .map(o => ({ f: o.f, s: score(o), n: o.ks.size })).sort((a, b) => b.s - a.s);
  const families = Object.entries(fam).map(([k, o]) => ({ k, s: score(o) })).sort((a, b) => b.s - a.s);
  // هل ظروف الجلسة تفسّر الفرق أكثر من النسب؟
  let condNote = null;
  if (cond.length >= 4) {
    const hi = cond.filter(c => c.rot >= 3), lo = cond.filter(c => c.rot < 3);
    if (hi.length >= 2 && lo.length >= 2) {
      const a = hi.reduce((s, c) => s + c.avg, 0) / hi.length;
      const b = lo.reduce((s, c) => s + c.avg, 0) / lo.length;
      if (Math.abs(a - b) >= 0.4) condNote = { hi: a, lo: b, better: a > b };
    }
  }
  return { flavors, families, chips, rated: new Set(units.map(u => u.k)).size, condNote };
}

/* أزواج المكوّنات التي تتكرر معاً في وصفاتك المقيَّمة أربع نجوم فأعلى —
   لا تكرار نكهة مفردة (هذا موجود في tasteProfile) بل تفاعل بين اثنتين.
   الوزن = حاصل ضرب نسبتيهما، فزوج يقود الوصفة معاً يُحسب أثقل من زوج
   ظهر أحدهما بنسبة لمسة عابرة. */
function pairPatterns() {
  const units = ratedUnits();
  if (!units.length) return null;
  const pr = {};
  units.forEach(({ k, r, items, rs }) => {
    const avg = rs.reduce((a, x) => a + x.stars, 0) / rs.length;
    for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
      const A = items[i].f, B = items[j].f;
      const key = [A.id, B.id].sort().join('|');
      const w = (items[i].pct / 100) * (items[j].pct / 100);
      if (w <= 0) continue;
      (pr[key] = pr[key] || { a: A, b: B, sum: 0, w: 0, recipes: new Set() });
      pr[key].sum += avg * w; pr[key].w += w;
      pr[key].recipes.add(r.name);
    }
  });
  const pairs = Object.values(pr).filter(p => p.w > 0)
    .map(p => ({ a: p.a, b: p.b, s: p.sum / p.w, n: p.recipes.size, recipes: [...p.recipes] }))
    .sort((x, y) => y.s - x.s || y.n - x.n);
  return { pairs, rated: new Set(units.map(u => u.k)).size };
}

/* فحوص المراحل (الدقيقة 15 و40): أي نكهة سمعتها فعلاً؟ تُقارن بالقائدة في
   الخلطة كما دُخّنت يومها. يكشف ما يصنع الطعم وما يبقى في الخلفية. */
function heardStats() {
  const rows = [];
  (STATE.sessions || []).forEach(s => {
    if (!s.phaseChecks || !s.phaseChecks.length) return;
    const r = allRecipes().find(x => RKEY(x) === s.key); if (!r) return;
    const items = itemsAt(r, s.start).filter(i => i.f && i.f.id); if (!items.length) return;
    const lead = items.reduce((a, b) => b.pct > a.pct ? b : a);
    s.phaseChecks.forEach(c => { if (c.id) rows.push({ items, lead: lead.f.id, heard: c.id }); });
  });
  if (rows.length < 10) return null;
  const inMix = {}, heard = {};
  rows.forEach(x => { x.items.forEach(i => { inMix[i.f.id] = (inMix[i.f.id] || 0) + 1; });
    heard[x.heard] = (heard[x.heard] || 0) + 1; });
  const silent = Object.entries(inMix).filter(([id, n]) => n >= 8 && (heard[id] || 0) / n <= 0.05)
    .sort((a, b) => b[1] - a[1]).map(([id, n]) => ({ f: flavorById(id), n, h: heard[id] || 0 })).filter(x => x.f);
  return { n: rows.length, leadPct: Math.round(100 * rows.filter(x => x.heard === x.lead).length / rows.length), silent };
}

function likedFlavorScores() {
  const s = {};
  ratedUnits().forEach(({ items, rs }) => {
    const avg = rs.reduce((a, x) => a + x.stars, 0) / rs.length;
    items.forEach(i => { s[i.f.id] = (s[i.f.id] || 0) + (avg - 3) * (i.pct / 100); });
  });
  return s;
}

function recommendations(n) {
  const liked = likedFlavorScores();
  const hasHistory = Object.keys(liked).length > 0;

  const pool = allRecipes().filter(r =>
    !r.tested && !ratingsOf(RKEY(r)).length && (r.items || []).length >= 2);

  const scored = pool.map(r => {
    const items = recipeItems(r);
    let sc = 0;

    // 1. taste history
    items.forEach(i => { sc += (liked[i.f.id] || 0) * 2; });

    // 2. clear and proven first — you would rather not burn tobacco on a guess
    const cov = phaseCoverage(r);
    if (cov[2].has > 0) sc += 0.9;
    if (items.length <= 3) sc += 0.6;   // طلبتَ وصفات بسيطة — دفعة خفيفة، لا حكم: سجلك لم يقارن بعد
    if (r.famous) sc += 1.5;
    if (items.some(i => isEstimated(i.f))) sc -= 1;

    // 3. rule check
    const iss = checkRecipe(r);
    sc -= iss.filter(x => x.sev === 'r').length * 6;
    sc -= iss.filter(x => x.sev === 'o').length * 1.2;

    // 4. can you actually make it right now?
    const short = items.filter(i => !invOf(i.f.id) || invOf(i.f.id).remG < gramsFor(i.pct));
    sc -= short.length * 4;

    // 5. a nudge toward the shelf that is sitting untouched
    items.forEach(i => {
      const inv = invOf(i.f.id);
      if (inv && !inv.lastUsed) sc += 0.35;
    });

    // 6. gentle jitter, fixed for the whole day
    const seed = (new Date().toISOString().slice(0, 10) + (r.no || r.id)).split('')
      .reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 9973, 7);
    sc += (seed % 100) / 100 * (hasHistory ? 0.8 : 2.2);

    return { r, sc, short: short.length, cov };
  }).sort((a, b) => b.sc - a.sc);

  // keep the picks from all tasting alike
  const out = [];
  for (const c of scored) {
    if (out.length >= n) break;
    const ids = new Set(c.r.items.map(i => i.id));
    const twin = out.some(o => {
      const oi = new Set(o.r.items.map(i => i.id));
      const inter = [...ids].filter(x => oi.has(x)).length;
      return inter / new Set([...ids, ...oi]).size >= 0.5;
    });
    if (!twin) out.push(c);
  }
  return out;
}

function tickHomeSessionCard(){
  const ring=document.getElementById('hRing');
  if(!ring||!STATE.session)return;
  const s=STATE.session;
  const lastRotTs=s.rotations.length? s.rotations[s.rotations.length-1] : s.start;
  const totalSecs=rotateEvery()*60;
  const secsSince=Math.max(0,Math.floor((Date.now()-lastRotTs)/1000));
  const secsLeft=Math.max(0,totalSecs-secsSince);
  const due=secsLeft<=0;
  const nearDue=secsLeft>0&&secsLeft<=120;
  const deg=Math.min(360,(secsSince/totalSecs)*360);
  const color=due?'var(--danger)':nearDue?'var(--warn)':'var(--ember)';
  ring.style.background=`conic-gradient(${color} ${deg}deg,var(--fill) ${deg}deg 360deg)`;
  ring.classList.toggle('due',due);
  const mm=String(Math.floor(secsLeft/60)).padStart(2,'0'), ss=String(secsLeft%60).padStart(2,'0');
  const timeEl=document.getElementById('hRingTime');
  if(timeEl) timeEl.textContent = due ? 'الدورة مستحقة الآن' : `${mm}:${ss} متبقية`;
  const cycEl=document.getElementById('hRingCyc');
  if(cycEl) cycEl.textContent = `دورة ${Math.min(s.rotations.length+1,6)} من 6`;
}

function agoAr(ts) {
  const d = Math.floor((Date.now() - ts) / 864e5);
  return d === 0 ? 'اليوم' : d === 1 ? 'أمس' : d < 30 ? `منذ ${d} يوماً` : `منذ ${Math.floor(d / 30)} شهر`;
}

const lScreen = document.getElementById('screen-log');

const DAY = 864e5;
const daysSince = ts => ts ? Math.floor((Date.now() - ts) / DAY) : null;

/* grams per month, measured from first use to now */
function turnover(id) {
  const i = invOf(id); if (!i || !i.firstUsed || !i.usedG) return 0;
  const months = Math.max(0.5, (Date.now() - i.firstUsed) / DAY / 30);
  return +(i.usedG / months).toFixed(1);
}
function monthsLeft(id) {
  const t = turnover(id); const i = invOf(id);
  return t > 0 ? +(i.remG / t).toFixed(1) : null;
}

function logStats() {
  const ses = STATE.sessions || [];
  const rated = Object.entries(STATE.ratings || {}).flatMap(([k, rs]) => rs.map(r => ({ k, ...r })));
  const avg = rated.length ? rated.reduce((s, r) => s + r.stars, 0) / rated.length : null;
  const minutes = ses.reduce((s, x) => s + (x.minutes || 0), 0);

  const catScore = {};
  Object.entries(STATE.ratings || {}).forEach(([k, rs]) => {
    const r = allRecipes().find(x => RKEY(x) === k); if (!r) return;
    const a = rs.reduce((s, x) => s + x.stars, 0) / rs.length;
    const c = r.category || 'من تصميمي';
    catScore[c] = catScore[c] || { n: 0, sum: 0 };
    catScore[c].n += rs.length; catScore[c].sum += a * rs.length;
  });
  const cats = Object.entries(catScore)
    .map(([c, v]) => ({ c, n: v.n, avg: v.sum / v.n }))
    .sort((a, b) => (b.avg - a.avg) || (b.n - a.n));

  return { ses, rated, avg, minutes, cats };
}

/* Count numbers up on entry. Decorative only — the final value is already in
   the DOM, so a reduced-motion user (or a failed animation) still sees it. */
function countUp(scope) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  scope.querySelectorAll('[data-count]').forEach(el => {
    const target = parseFloat(el.dataset.count);
    if (!isFinite(target) || target <= 0) return;
    const dec = (el.dataset.count.split('.')[1] || '').length;
    const suffix = el.dataset.suffix || '';
    const dur = 520, t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = (target * eased).toFixed(dec) + suffix;
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = target.toFixed(dec) + suffix;
    };
    requestAnimationFrame(step);
  });
}

/* ما الذي يفتحه شراء نكهة واحدة: عدد الوصفات التي تنتقل من "متعطّلة" إلى "جاهزة".
   هذا يربط قرار الشراء بالفائدة لا بالرغبة. */
function unlockValue(fid) {
  const before = allRecipes().filter(r => canMakeNow(r).ok).length;
  const inv = invOf(fid), snap = inv.remG;
  inv.remG = inv.remG + inv.packG;          // افتراض شراء علبة إضافية تُجمع لا تُصفّر
  const after = allRecipes().filter(r => canMakeNow(r).ok).length;
  inv.remG = snap;
  return after - before;
}

function openShopping() {

    .map(f => ({ f, unlock: unlockValue(f.id), used: recipesUsing(f.id).length }))
    .sort((a, b) => b.unlock - a.unlock || b.used - a.used);
  const picked = new Set();
  const draw = () => {
    // الأثر التراكمي: شراء ثلاث نكهات معاً قد يفتح أكثر من مجموعها منفردة
    const snaps = [...picked].map(id => { const i = invOf(id); const s = i.remG; i.remG = i.remG + i.packG; return [i, s]; });
    const totalOpen = allRecipes().filter(r => canMakeNow(r).ok).length;
    const cost = [...picked].reduce((s, id) => { const i = invOf(id); return s + (i.price || 0); }, 0);
    const noPrice = [...picked].some(id => !invOf(id).price);
    snaps.forEach(([i, s]) => { i.remG = s; });
    const baseOpen = allRecipes().filter(r => canMakeNow(r).ok).length;
    sBody.innerHTML = `
      <div class="sh-title">قائمة الشراء</div>
      <div class="sh-sub"><span>مرتّبة بما تفتحه لك من وصفات</span></div>
      ${picked.size ? `<div class="grp"><div class="tier" style="color:var(--ok)"><span class="sw"></span><span class="t">
        باختيارك ${picked.size} نكهة: الوصفات الجاهزة تصير <b>${totalOpen}</b> بدل ${baseOpen}
        <b>(+${totalOpen - baseOpen})</b>.${cost ? ` التكلفة ${cost.toFixed(0)}${noPrice ? ' على الأقل — بعضها بلا سعر' : ''}.` : ''}
      </span></div></div>` : ''}
      ${cand.length ? `<div class="grp">${cand.map(c => `
        <div class="flav" data-buy="${c.f.id}" style="${picked.has(c.f.id) ? 'border-color:var(--ember)' : ''}">
          <span class="stripe" style="background:${famColor(c.f.family)}"></span>
          <span class="main"><span class="nm"><bdi>${c.f.name}</bdi>${picked.has(c.f.id) ? '<span class="lead">مختارة</span>' : ''}</span>
            <span class="meta">${isEmpty(c.f.id) ? '<span style="color:var(--danger)">نفدت</span>' : `باقٍ ${invPct(c.f.id)}%`}
              · في ${c.used} وصفة${c.unlock > 0 ? ` · <span style="color:var(--ok)">تفتح ${c.unlock}</span>` : ''}</span></span>
          <span class="pct num">${invOf(c.f.id).price ? invOf(c.f.id).price : '—'}</span>
        </div>`).join('')}</div>`
        : '<div class="empty">مخزونك مكتمل — لا شيء يحتاج شراء.</div>'}`;
    sBody.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
      const id = b.dataset.buy; picked.has(id) ? picked.delete(id) : picked.add(id); draw();
    });
  };
  draw();
  scrim.classList.add('on'); sheet.classList.add('on'); document.body.style.overflow = 'hidden';
}

/* (6) المولّد يتعلّم من ثلاثة مصادر مستقلة، لا من النجوم وحدها:
   • التقييم   — ما قلتَ إنه أعجبك
   • الاستخدام — ما تعود إليه فعلاً (تفضيل مكشوف قد يخالف ما تقوله)
   • الاقتران  — أي نكهة نجحت بجوار ما اخترناه، من وصفاتك عالية التقييم
   ثم مصفوفة التوافق كأرضية حين تصمت بياناتك. */
function learningModel() {
  const t = tasteProfile();
  const rate = {}, fam = {}, pair = {}, seen = new Set();
  const now = Date.now();
  // (7) التقييم الأحدث أثقل: ذوقك يتطوّر، ورأي قبل سنة لا يساوي رأي الأسبوع الماضي
  const recencyW = ts => { const months = (now - ts) / (30 * 864e5);
    return Math.max(0.35, Math.pow(0.5, months / 9)); };          // نصف الوزن كل 9 أشهر

  if (t) t.families.forEach(x => { fam[x.k] = x.s; });

  ratedUnits().forEach(({ k, items, rs }) => {
    let wSum = 0, sSum = 0;
    rs.forEach(x => { const w = recencyW(x.ts); wSum += w; sSum += x.stars * w; });
    const avg = sSum / wSum;
    items.forEach(i => {
      seen.add(i.f.id);                                            // (2) جُرِّبت فعلاً
      const share = i.pct / 100;
      const o = rate[i.f.id] = rate[i.f.id] || { sum: 0, w: 0, ks: new Set() };
      o.sum += avg * share * wSum; o.w += share * wSum; o.ks.add(k);
    });
    const ids = items.map(i => i.f.id);
    ids.forEach(a => ids.forEach(b => { if (a === b) return;
      (pair[a] = pair[a] || {})[b] = (pair[a][b] || 0) + (avg - 3); }));
  });
  Object.values(rate).forEach(o => { o.s = o.sum / o.w; o.n = o.ks.size; });

  const maxUsed = Math.max(1, ...DATA.flavors.map(f => invOf(f.id).usedG || 0));
  const usage = {};
  DATA.flavors.forEach(f => { usage[f.id] = (invOf(f.id).usedG || 0) / maxUsed; });

  /* (6) نمط شكواك المتكرّر يوجّه البناء من أول نكهة، لا بعد أن تجرّب وتشتكي.
     «الطعم خفّ» المتكرر يعني ترجيح قاع أقوى، لا انتظار جلسة فاشلة أخرى. */
  const chipTally = {};
  Object.values(STATE.ratings || {}).forEach(rs => rs.forEach(x =>
    (x.chips || []).forEach(c => { chipTally[c] = (chipTally[c] || 0) + recencyW(x.ts); })));
  const bias = { bottom: 0, cool: 0, sweet: 0, acid: 0, power: 0, density: 0 };
  const note = [];
  const T = k => chipTally[k] || 0;
  if (T('الطعم خفّ') >= 2)   { bias.bottom += 0.9; note.push('نمطك «الطعم خفّ» — رجّحنا قاعاً أثبت'); }
  if (T('بارد زيادة') >= 2)  { bias.cool -= 1.0;  note.push('نمطك «بارد زيادة» — قلّلنا التبريد'); }
  if (T('حلو زيادة') >= 2)   { bias.sweet -= 0.8; note.push('نمطك «حلو زيادة» — خفّضنا الحلاوة'); }
  if (T('حامض زيادة') >= 2)  { bias.acid -= 0.8;  note.push('نمطك «حامض زيادة» — خفّضنا الحموضة'); }
  if (T('نكهة طاغية') >= 2)  { bias.power -= 0.6; note.push('نمطك «نكهة طاغية» — تجنّبنا المهيمنات الحادة'); }
  if (T('نكهة مبهمة') >= 2)  { bias.density -= 0.6; note.push('نمطك «نكهة مبهمة» — خفّضنا الكثافة'); }

  return {
    hasData: !!t, seen, notes: note,
    tried: id => seen.has(id),
    // 0 = محايد. موجب = مرشّح، سالب = مُثبَّط.
    score(f, picked, mode) {
      let s = 0;
      const r = rate[f.id];
      /* في الاستكشاف نخفّض وزن ما جرّبته ونرفع مكافأة المجهول معاً — رفع
         المكافأة وحدها لا يكفي أمام نكهة بـ4.7★، فتعود النتيجة كالمتوازن. */
      if (r) {
        const trust = Math.min(1, r.n / 3);
        const d = r.s - 3;
        /* الاستكشاف يخفّف الإعجاب لا النفور: هدفه تجربة المجهول، لا إعادة
           تجربة ما ثبت أنه لا يعجبك. لذا التخفيف على الموجب وحده. */
        const w = (mode === 'explore' && d > 0) ? 0.45 : 1.6;
        s += d * w * trust;
      } else {
        /* (2) «لم تُجرَّب» ليست «جُرِّبت فلم تعجب». الأولى فرصة، والثانية تحذير. */
        s += mode === 'explore' ? 2.2 : mode === 'safe' ? -1.4 : -0.15;
        if (fam[f.family] !== undefined) s += (fam[f.family] - 3) * 0.5;  // نستدل بعائلتها
      }
      if (fam[f.family] !== undefined) s += (fam[f.family] - 3) * 0.7;
      s += usage[f.id] * 1.2;
      // (6) الانحياز المستنتج من وسومك
      s += bias.bottom * (servesPhase(f, 2) ? 1 : 0);
      s += bias.cool * (f.cool >= 3 ? 1 : 0);
      s += bias.sweet * (f.sweet >= 4 ? 1 : 0);
      s += bias.acid * (f.acid >= 4 ? 1 : 0);
      s += bias.power * (f.power >= 5 ? 1 : 0);
      s += bias.density * (f.density >= 5 ? 1 : 0);
      picked.forEach(p => {
        const co = (pair[f.id] || {})[p.f.id];
        if (co) s += Math.max(-1.5, Math.min(1.5, co * 0.8));
        const m = (DATA.familyMatrix[f.family] || {})[p.f.family];
        if (m !== undefined) s += (m - 3) * 0.35;
      });
      return s;
    },
    // (1) لماذا اختِيرت هذه النكهة — بلغة تُراجَع لا بأرقام
    why(f, picked) {
      const r = rate[f.id];
      if (r && r.n) {
        const lvl = r.s >= 4.2 ? 'من أعلى ما قيّمت' : r.s >= 3.5 ? 'قيّمتها إيجاباً' : 'قيّمتها متوسطة';
        return `${lvl} — ${r.n === 1 ? 'وصفة واحدة' : r.n + ' وصفات'} · ${r.s.toFixed(1)}★`;
      }
      const co = picked.map(p => ({ p, v: (pair[f.id] || {})[p.f.id] || 0 }))
        .sort((a, b) => b.v - a.v)[0];
      if (co && co.v > 0.4) return `نجحت بجوار ${co.p.f.name} في سجلك`;
      if (usage[f.id] > 0.4) return 'من أكثر ما تستهلك فعلياً';
      if (fam[f.family] !== undefined && fam[f.family] >= 3.8) return `عائلتها (${FAM_AR[f.family]}) تروق لك`;
      return 'لم تجرّبها بعد — فرصة اكتشاف';
    },
  };
}

/* (4) تشابه خلطتين: نفس النكهات بنسب متقاربة = تكرار لا ابتكار.
   يُقاس بتقاطع النسب (Ruzicka) فيلتقط «نفس الوصفة بفروق طفيفة». */
function mixSimilarity(a, b) {
  const A = {}, B = {};
  a.forEach(i => { A[i.f.id] = i.pct; });
  b.forEach(i => { B[i.f.id] = i.pct; });
  const ids = new Set([...Object.keys(A), ...Object.keys(B)]);
  let inter = 0, uni = 0;
  ids.forEach(id => {
    inter += Math.min(A[id] || 0, B[id] || 0);
    uni   += Math.max(A[id] || 0, B[id] || 0);
  });
  return uni ? inter / uni : 0;
}
function nearestExisting(items) {
  let best = null;
  allRecipes().forEach(r => {
    const sim = mixSimilarity(items, liveItems(r));
    if (!best || sim > best.sim) best = { r, sim };
  });
  return best;
}

/* (5) البول والمدة والإعداد تُشتقّ من الخلطة نفسها — نفس منطق كل وصفات الكتاب.
   المدة: الحرارة المنخفضة تطيل عمر البول، لكن عمر النكهات نفسها (محور الاستمرارية)
   يحدد متى يخفت الطعم — حمضيات سريعة لن تعيش 95 دقيقة مهما خفّضت الحرارة.
   الفحم: طريقتك (فحمتان، ونصف بعد 3–5 دقائق إن احتاجت) — وسجلك يقول اثبت بعدها:
   أفضل جلساتك بقيت على فحمتين حتى الدقيقة 30، والنصف الإضافي جاء بعد الدقيقة 45. */
const COAL_PLAN = [
  'فحمتان واثبت عليهما، ونصف فحمة فقط إن ضعف الدخان',
  'فحمتان، ونصف بعد 3 إلى 5 دقائق إن احتاجت، ثم اثبت حتى يخفّ الطعم',
  'فحمتان، ونصف بعد 3 إلى 5 دقائق إن احتاجت، ثم اثبت؛ نصف أخرى بعد الدقيقة 45 إن خفّ الطعم',
];
function inferBowl(items) {
  const tot = items.reduce((s, i) => s + i.pct, 0) || 100;
  const minC = Math.min(...items.map(i => i.f.ceiling));
  const dens = items.reduce((s, i) => s + i.f.density * i.pct, 0) / tot;
  const life = items.reduce((s, i) => s + (i.f.duration || 3) * i.pct, 0) / tot;
  const fams = new Set(items.map(i => i.f.family));
  const cool = items.some(i => i.f.family === 'cooling' || i.f.cool >= 3);
  const base = minC <= 1 ? 95 : minC <= 2 ? 85 : 75;
  const lo = Math.max(55, Math.round((base - (4 - life) * 12) / 5) * 5);
  const hi = lo + (dens >= 4 ? 20 : 15);
  let bowl;
  if (items.length >= 5) bowl = 'oblako-trio';
  else if (dens >= 4.0 && hi >= 90) bowl = 'cosmo-phunnel';
  else if (cool || (fams.has('citrus') && minC <= 2)) bowl = 'turkish-curved';
  else if (minC <= 1) bowl = 'turkish-flat';
  else bowl = dens >= 3.8 ? 'cosmo-phunnel' : 'turkish-flat';
  const heat = minC <= 1 ? 'حرارة منخفضة جداً' : minC <= 2 ? 'حرارة منخفضة' : 'حرارة متوسطة';
  const coals = minC <= 1 ? COAL_PLAN[0] : minC <= 2 ? COAL_PLAN[1] : COAL_PLAN[2];
  const pctOf = pred => items.filter(i => pred(i.f)).reduce((s, i) => s + i.pct, 0);
  const pack = pctOf(f => f.id === 'blueberry') >= 40 ? 'كبس محكم'
    : dens >= 4.2 ? 'نثر خفيف'
    : pctOf(f => ['citrus', 'cooling'].includes(f.family)) >= 50 ? 'كبس محكم'
    : dens < 3.8 ? 'كبس متوسط' : 'نثر خفيف';
  return { bowl, minLo: lo, minHi: hi, setup: `${heat} — ${coals} · ${pack} · من ${lo} إلى ${hi} دقيقة` };
}

/* =====================================================================
   المحرك المرتكز على نجاحاتك — يحلّ محلّ «البناء من الصفر»
   ---------------------------------------------------------------------
   لماذا: المحرك القديم يبني من قواعد الكتاب وذوقك العام، فيُنتج خلطات
   «نظيفة» على الورق (مخالفات أقل من وصفاتك الناجحة نفسها!) لكنها لم تُجرَّب،
   وبياناتك لا تكفي لتعلّم نموذج يتنبأ بالفشل (دقة التحقق المتقاطع ≈ الصدفة).
   فبدل التنبؤ نبقى قريبين مما ثبت: نأخذ وصفة نجحت عندك (★4+، بلا «الطعم
   خفّ»، 60 دقيقة فأكثر) ونغيّر فيها نكهة أو اثنتين بنكهة تؤدي نفس الدور.
   دليل من سجلك (فحص رجعي بتاريخين مختلفين): وصفات جديدة فيها نكهة واحدة
   غير موجودة في أقرب وصفة ناجحة سابقة نجحت 8 من 9، وفيها نكهتان فأكثر
   نحو 55–58%. العيّنة صغيرة، فهي تلميح لا إثبات — لذلك يُحسب نجاح كل
   ما يُولَّد (genScoreboard) ويُختار الوضع الأنجح تلقائياً.
   ===================================================================== */
const GEN_LABEL = { safe: 'آمن', balanced: 'متوازن', explore: 'استكشاف', scratch: 'من الصفر' };
const GEN_RULES = {
  safe:     { maxChanges: 1, maxDist: 3.4, protectCore: true,  needEvidence: true,  untriedMax: 0 },
  balanced: { maxChanges: 2, maxDist: 4.4, protectCore: false, needEvidence: false, untriedMax: 1 },
  explore:  { maxChanges: 3, maxDist: 5.6, protectCore: false, needEvidence: false, untriedMax: 2 },
};
let genMode = 'safe';
let GEN_SEEN = new Set();

/* نسخ ناجحة: قُيّمت ★4+ على النسخة نفسها، بلا «الطعم خفّ»، وجلسة 60 دقيقة فأكثر */
function provenUnits() {
  const now = Date.now(), out = [];
  ratedUnits().forEach(u => {
    const avg = meanStars(u.rs);
    if (avg == null || avg < 4) return;
    if (u.items.length < 3 || u.items.some(i => isExternal(i.f) || !DATA.flavors.some(x => x.id === i.f.id))) return;
    const ss = (STATE.sessions || []).filter(s => s.key === u.k && !s.manual && (s.minutes || 0) >= 30
      && sigOf(itemsAt(u.r, s.start)) === u.sig);
    const faded = ss.some(s => (s.marks || []).some(m => m.k === 'الطعم خفّ')) ||
      u.rs.some(x => (x.chips || []).includes('الطعم خفّ'));
    if (faded) return;
    if (ss.length && Math.max(...ss.map(s => s.minutes || 0)) < 60) return;
    const last = Math.max(...u.rs.map(x => x.ts));
    out.push({
      k: u.k, r: u.r, name: u.r.name, avg, n: u.rs.length, last,
      items: u.items.map(i => ({ f: DATA.flavors.find(x => x.id === i.f.id), pct: i.pct })),
      w: (avg >= 4.5 ? 1 : 0.6) * Math.pow(0.5, (now - last) / (60 * 864e5)) + 0.15,
    });
  });
  return out;
}
function flavorEvidence(P) {
  const ev = {};
  P.forEach(u => {
    const lead = leadOf(u.items);
    u.items.forEach(i => { const e = ev[i.f.id] = ev[i.f.id] || { n: 0, lead: 0 }; e.n++; if (i === lead) e.lead++; });
  });
  return ev;
}
const leadOf = items => items.reduce((a, b) => b.pct > a.pct ? b : a);
const leadCap = f => Math.min(f.maxPct || 95, f.hardCap || 95, 50);
const mixKey = items => items.map(i => i.f.id + ':' + i.pct).sort().join('|');
function withPicks(list, fn) {
  const saved = BUILD.picks; BUILD.picks = list.map(i => ({ f: i.f, pct: i.pct }));
  try { return fn(); } finally { BUILD.picks = saved; }
}
/* المخالفات على الخلطة كلها (كل نكهة مقابل الباقي) */
function mixIssues(items) {
  const c = { r: 0, o: 0, y: 0 };
  items.forEach((it, idx) => {
    const seen = new Set();
    withPicks(items.filter((_, j) => j !== idx), () => evaluate(it.f)).issues.forEach(is => {
      if (!seen.has(is.t)) { seen.add(is.t); c[is.sev] = (c[is.sev] || 0) + 1; } });
  });
  return c;
}
const makeableItems = items => items.every(i => { const v = invOf(i.f.id); return v && v.remG >= gramsFor(i.pct); });

/* مسافة «الدور»: هل تؤدي النكهتان الوظيفة نفسها في الخلطة؟ (مراحل، قوة، عمر، تطايُر…) */
function flavorDist(a, b) {
  let d = 0;
  for (let k = 0; k < 3; k++) if (servesPhase(a, k) !== servesPhase(b, k)) d += 1.5;
  d += Math.abs(a.power - b.power) * 0.7 + Math.abs(a.duration - b.duration) * 0.9
     + Math.abs(a.volatility - b.volatility) * 0.6 + Math.abs(a.density - b.density) * 0.4
     + Math.abs(a.sweet - b.sweet) * 0.3 + Math.abs(a.acid - b.acid) * 0.3 + Math.abs(a.cool - b.cool) * 0.4;
  if (a.family !== b.family) {
    const m = (DATA.familyMatrix[a.family] || {})[b.family];
    d += m >= 4 ? 0.6 : m >= 3 ? 1.2 : 2.5;
  }
  if (a.subfamily === b.subfamily) d -= 0.8;
  return Math.max(0, d);
}

/* تغيير واحد على خلطة: استبدال نكهة، أو نقل 5% للقائد، أو حذف لمسة صغيرة */
function mutateOnce(items, ctx) {
  const out = [];
  const lead = leadOf(items), li = items.indexOf(lead);
  const bottom = items.filter(i => i !== lead && servesPhase(i.f, 2)).sort((a, b) => b.pct - a.pct)[0] || null;
  const have = new Set(items.map(i => i.f.id));
  const seedIn = ctx.seed && have.has(ctx.seed.id);
  const finish = (child, change, touchIds) => {
    if (child.reduce((s, i) => s + i.pct, 0) !== 100) return;
    if (child.some(i => i.pct < 5 || i.pct > 95 || i.pct % STEP)) return;
    const l = leadOf(child);
    if (l.pct < 30 || l.pct > leadCap(l.f)) return;
    out.push({ items: child, change, touched: touchIds });
  };
  // 1) استبدال
  items.forEach((x, s) => {
    if (ctx.touched.has(x.f.id)) return;
    if (ctx.seed && x.f.id === ctx.seed.id) return;
    const isLead = x === lead;
    if (ctx.rules.protectCore && (isLead || x === bottom)) return;
    const rest = items.filter((_, j) => j !== s);
    DATA.flavors.forEach(c => {
      if (have.has(c.id)) return;
      if (ctx.seed && !seedIn && c.id !== ctx.seed.id) return;          // يجب إدخال البذرة الآن
      if (ctx.rules.needEvidence && !(ctx.ev[c.id] && ctx.ev[c.id].n) && !(ctx.seed && c.id === ctx.seed.id)) return;
      if (c.id === ctx.excludeId) return;
      const limit = ctx.rules.maxDist + (ctx.seed && c.id === ctx.seed.id ? ctx.seedSlack : 0);
      if (flavorDist(x.f, c) > limit) return;
      if (isLead && !(c.duration >= 4 && c.maxPct >= 40)) return;       // القائد الجديد طويل العمر وبسقف يتسع
      if (ctx.banned && ctx.banned(c, rest)) return;
      const w = withPicks(rest, () => windowFor(c, true));
      let p = Math.min(w.hi, Math.max(w.lo, x.pct));
      const child = items.map((it, j) => j === s ? { f: c, pct: p } : { f: it.f, pct: it.pct });
      let delta = x.pct - p;
      if (delta) {                                                      // الفرق يذهب للقائد (أو لأكبر نكهة أخرى إن كان هو المستبدَل)
        const ti = isLead ? child.reduce((bi, it, j) => j !== s && (bi < 0 || it.pct > child[bi].pct) ? j : bi, -1) : li;
        if (ti < 0) return;
        const np = child[ti].pct + delta;
        if (np < 5 || np > leadCap(child[ti].f)) return;
        child[ti] = { f: child[ti].f, pct: np };
      }
      finish(child, { type: 'swap', out: x.f, in: c, pct: p }, [x.f.id, c.id]);
    });
  });
  // 2) رفع القائد 5% من نكهة غير مقدّسة
  if (lead.pct < 45 && !ctx.rules.protectCore) {
    items.forEach((x, j) => {
      if (x === lead || ctx.touched.has(x.f.id) || (ctx.seed && x.f.id === ctx.seed.id)) return;
      if (x.pct - STEP < Math.min(x.pct, 10) || lead.pct + STEP > leadCap(lead.f)) return;
      const child = items.map((it, k) => k === li ? { f: it.f, pct: it.pct + STEP } : k === j ? { f: it.f, pct: it.pct - STEP } : { f: it.f, pct: it.pct });
      finish(child, { type: 'shift', from: x.f, to: lead.f }, [x.f.id, lead.f.id]);
    });
  }
  // 3) حذف لمسة صغيرة تُعطى للقائد
  if (items.length >= 4 && !ctx.rules.protectCore) {
    items.forEach((x, j) => {
      if (x === lead || x === bottom || x.pct > 15 || ctx.touched.has(x.f.id) || (ctx.seed && x.f.id === ctx.seed.id)) return;
      if (lead.pct + x.pct > leadCap(lead.f)) return;
      const child = items.filter((_, k) => k !== j).map(it => it === lead ? { f: it.f, pct: it.pct + x.pct } : { f: it.f, pct: it.pct });
      finish(child, { type: 'drop', out: x.f }, [x.f.id]);
    });
  }
  return out;
}

function reasonText(oldF, newF, ev, M) {
  const same = [0, 1, 2].filter(k => servesPhase(oldF, k) && servesPhase(newF, k)).length;
  const bits = [`تؤدي دور ${oldF.name} نفسه (${phaseTagFor(newF)})`];
  if (newF.duration >= oldF.duration) bits.push('عمرها مثله أو أطول');
  else if (oldF.duration - newF.duration === 1) bits.push('عمرها أقصر بدرجة');
  const e = ev[newF.id];
  bits.push(e && e.n ? `ظهرت في ${e.n === 1 ? 'وصفة' : e.n + ' وصفات'} ★4+ عندك` : M.tried(newF.id) ? 'جرّبتها ولم تدخل وصفة ★4+' : 'لم تجرّبها بعد');
  return bits.join(' · ');
}

/* خيارات مرتّبة. seed: نكهة يجب أن تكون في الخلطة (أو null). */
function generateOptions(mode, seed, k) {
  const rules = GEN_RULES[mode] || GEN_RULES.safe;
  const P = provenUnits();
  if (P.length < 4) return null;
  const ev = flavorEvidence(P), M = learningModel();
  const banned = (c, rest) => DATA.bans.some(b => b.kind === 'fail' && rest.some(p =>
    (b.a === p.f.name && b.b === c.name) || (b.b === p.f.name && b.a === c.name)));
  let parents = P;
  if (seed) { const withSeed = P.filter(u => u.items.some(i => i.f.id === seed.id)); if (withSeed.length) parents = withSeed; }
  /* لا نقلّب كل الوصفات في كل مرة: عيّنة موزونة (الأحدث والأعلى تقييماً أثقل، وعند وجود بذرة
     الأقرب دوراً منها) — تبقي الزمن قصيراً على الآيفون وتنوّع النتائج بين ضغطة وأخرى */
  const wOf = u => u.w * (seed && !u.items.some(i => i.f.id === seed.id)
    ? Math.exp(-Math.min(...u.items.map(i => flavorDist(i.f, seed))) / 2) : 1);
  { const pool = parents.map(u => ({ u, w: wOf(u) })), pick = [];
    while (pool.length && pick.length < (rules.maxChanges >= 2 ? 7 : 12)) {
      let r = Math.random() * pool.reduce((a, b) => a + b.w, 0), i = 0;
      for (; i < pool.length - 1; i++) { r -= pool[i].w; if (r <= 0) break; }
      pick.push(pool.splice(i, 1)[0].u);
    }
    parents = pick; }
  const cands = new Map();
  const consider = (parent, chain, items) => {
    const key = mixKey(items);
    if (cands.has(key)) return;
    const pi = mixIssues(parent.items), ci = mixIssues(items);
    if (ci.r) return;
    if (!makeableItems(items)) return;
    if (sweetOf(items) > 4.2 && sweetOf(parent.items) <= 4.2) return;
    const changes = chain.map(c => c.change);
    const added = changes.filter(c => c.type === 'swap').map(c => c.in);
    const untried = added.filter(f => !M.tried(f.id) && !(seed && f.id === seed.id)).length;
    if (untried > rules.untriedMax) return;
    let s = parent.w * 1.2 - 1.5 * changes.length - 1.6 * Math.max(0, ci.o - pi.o) - 0.25 * Math.max(0, ci.y - pi.y);
    let swSum = 0, swN = 0;                     // متوسط جودة الاستبدالات لا مجموعها — وإلا يُكافأ كثرة التغيير
    changes.forEach(c => {
      if (c.type === 'swap') {
        const e = ev[c.in.id]; swN++;
        const s0 = s; s = 0;
        s += (e && e.n ? Math.min(1, e.n / 3) * 1.0 : 0) + M.score(c.in, items.filter(i => i.f.id !== c.in.id), 'balanced') * 0.35
           - 0.45 * flavorDist(c.out, c.in) + (mode === 'explore' && !(e && e.n) ? 1.6 : 0);
        if (!(e && e.n) && !M.tried(c.in.id) && !(seed && c.in.id === seed.id)) s -= mode === 'safe' ? 3 : mode === 'balanced' ? 1.2 : 0;
        swSum += s; s = s0;
      }
    });
    s += swN ? swSum / swN : 0;
    if (leadOf(parent.items).pct < 40 && leadOf(items).pct >= 40) s += 0.5;      // القائدة 40%+ تخفت أقل في سجلك
    cands.set(key, { items, parent, changes, score: s, unproven: added.filter(f => !(ev[f.id] && ev[f.id].n)), mode });
  };
  parents.forEach(parent => {
    const base = parent.items.map(i => ({ f: i.f, pct: i.pct }));
    const ctx0 = { rules, ev, seed, banned, touched: new Set(), seedSlack: 2.0 };
    let frontier = mutateOnce(base, ctx0).map(m => ({ items: m.items, chain: [m], touched: new Set(m.touched) }));
    frontier.forEach(f => consider(parent, f.chain, f.items));
    for (let depth = 2; depth <= rules.maxChanges; depth++) {
      // نوسّع فقط أفضل ما سبق (نرتّبه بسرعة بعدد التغييرات والمسافة)
      const top = frontier
        .map(f => ({ f, key: mixKey(f.items) })).filter(x => cands.has(x.key))
        .sort((a, b) => cands.get(b.key).score - cands.get(a.key).score).slice(0, depth === 2 ? 8 : 4).map(x => x.f);
      const next = [];
      top.forEach(f => {
        mutateOnce(f.items, { ...ctx0, touched: f.touched }).forEach(m => {
          const nf = { items: m.items, chain: f.chain.concat([m]), touched: new Set([...f.touched, ...m.touched]) };
          next.push(nf); consider(parent, nf.chain, nf.items);
        });
      });
      frontier = next;
    }
  });
  let list = [...cands.values()];
  if (seed) list = list.filter(c => c.items.some(i => i.f.id === seed.id));
  if (!list.length) return [];
  const fresh = list.filter(c => !GEN_SEEN.has(mixKey(c.items)));
  const use = fresh.length >= Math.min(k, 2) ? fresh : (GEN_SEEN.clear(), list);
  use.forEach(c => { c.rank = c.score + (Math.random() - 0.5) * 1.1; });
  use.sort((a, b) => b.rank - a.rank);
  const chosen = [], perParent = {};
  let checked = 0;
  const tryAdd = c => {
    if ((perParent[c.parent.k] || 0) >= 2) return;
    if (chosen.some(o => mixSimilarity(o.items, c.items) > 0.9)) return;
    // لا نقترح نسخة طبق الأصل من شيء تملكه (حتى لو صارت وصفة محفوظة)
    checked++; const n = nearestExisting(c.items); if (n && n.sim >= 0.9) return;
    perParent[c.parent.k] = (perParent[c.parent.k] || 0) + 1; chosen.push(c);
  };
  /* الاستكشاف والمتوازن يضمنان حصة من الخيارات فيها نكهة لم تدخل وصفة ★4+ — وإلا يغلب المُثبَت دائماً
     فلا يتعلّم المحرك شيئاً جديداً ولا يُقاس الأثر */
  const quota = Math.min(k - 1, mode === 'explore' ? 2 : mode === 'balanced' ? 1 : 0);
  if (quota > 0) for (const c of use) {
    if (chosen.length >= quota || checked > 40) break;
    if (c.unproven.length) tryAdd(c);
  }
  for (const c of use) {
    if (chosen.length >= k || checked > 80) break;
    if (!chosen.includes(c)) tryAdd(c);
  }
  chosen.forEach(c => {
    GEN_SEEN.add(mixKey(c.items));
    const meta = buildMeta(c.items, M, null);
    const parentIds = new Set(c.parent.items.map(i => i.f.id));
    meta.why = c.items.map(i => {
      const sw = c.changes.find(ch => ch.type === 'swap' && ch.in.id === i.f.id);
      let t;
      if (sw) t = `بدل ${sw.out.name} — ${reasonText(sw.out, i.f, ev, M)}`;
      else if (parentIds.has(i.f.id)) {
        const was = c.parent.items.find(p => p.f.id === i.f.id).pct;
        t = was === i.pct ? `من «${c.parent.name}» ★${c.parent.avg.toFixed(1)} كما هي` : `من «${c.parent.name}» — ${was}% صارت ${i.pct}%`;
      } else t = M.why(i.f, c.items.filter(x => x !== i));
      return { id: i.f.id, name: i.f.name, t };
    });
    meta.nearest = null;
    meta.novel = c.items.filter(i => !M.tried(i.f.id)).map(i => i.f.name);
    c.meta = meta;
  });
  return chosen;
}
function changeText(ch) {
  return ch.type === 'swap' ? `${ch.out.name} ← ${ch.in.name} (${ch.pct}%)`
    : ch.type === 'shift' ? `+5% للقائدة ${ch.to.name} من ${ch.from.name}`
    : `حُذفت اللمسة ${ch.out.name}`;
}
function optToPicks(c) {
  const out = c.items.map(i => ({ f: i.f, pct: i.pct }));
  out.meta = c.meta; out.near = null;
  out.anchor = { mode: c.mode, parent: { key: c.parent.k, name: c.parent.name, avg: c.parent.avg },
    changes: c.changes.map(changeText), unproven: c.unproven.map(f => f.name),
    items: c.items.map(i => ({ id: i.f.id, pct: i.pct })) };
  return out;
}
/* رسالة موحّدة بعد التوليد */
function genToast(out, label) {
  if (out.anchor) return `ولّدت خلطة حول ${label} — نسخة من «${out.anchor.parent.name}»: ${out.anchor.changes.join('، ')}`;
  if (out.fallback) return `لا وصفة ناجحة قريبة من ${label} — بنيت خلطة من الصفر، وهي أول تجربة لها`;
  return `ولّدت خلطة حول ${label} — راجعها وعدّل كما تشاء`;
}

/* نتائج ما ولّده المحرك وحفظته: أول تقييم لكل وصفة مولَّدة */
function genScoreboard() {
  const by = { safe: { n: 0, ok: 0 }, balanced: { n: 0, ok: 0 }, explore: { n: 0, ok: 0 }, scratch: { n: 0, ok: 0 } };
  let pending = 0;
  (STATE.myRecipes || []).forEach(r => {
    if (!r.gen) return;
    const rs = ratingsOf(r.id).slice().sort((a, b) => a.ts - b.ts);
    if (!rs.length) { pending++; return; }
    const ok = rs[0].stars >= 4 && !(rs[0].chips || []).includes('الطعم خفّ');
    const m = by[r.gen.mode] = by[r.gen.mode] || { n: 0, ok: 0 };
    m.n++; if (ok) m.ok++;
  });
  const n = Object.values(by).reduce((s, m) => s + m.n, 0), ok = Object.values(by).reduce((s, m) => s + m.ok, 0);
  return { by, n, ok, pending };
}
/* الوضع الأنجح: متوسط بيتا مع سابق يميل للآمن — لا يتغيّر قبل 4 تقييمات */
function bestGenMode() {
  const sb = genScoreboard(); if (sb.n < 4) return 'safe';
  const pri = { safe: [3, 1], balanced: [2, 2], explore: [1, 3] };
  return Object.keys(pri).map(m => ({ m, p: (pri[m][0] + sb.by[m].ok) / (pri[m][0] + pri[m][1] + sb.by[m].n) }))
    .sort((a, b) => b.p - a.p)[0].m;
}

/* سطر في المحرّر: على أي وصفة بُنيت الخلطة وماذا تغيّر (يختفي إن ابتعدتَ عنها بالتعديل) */
function genMetaOf(out) {
  if (!out) return null;
  if (out.anchor) return out.anchor;
  if (out.fallback || out.scratch) return { mode: 'scratch', parent: null, changes: [], unproven: [],
    items: out.map(i => ({ id: i.f.id, pct: i.pct })) };
  return null;
}
function genNoteHTML() {
  const g = BUILD.genMeta; if (!g || !BUILD.picks.length) return '';
  if (!g.parent) {
    const s0 = mixSimilarity(BUILD.picks, g.items.map(i => ({ f: flavorById(i.id), pct: i.pct })));
    return s0 < 0.6 ? '' : '<div class="note" style="margin:0 0 12px">خلطة من الصفر — لم يسبق أن جرّبتها، وسجلك لم يكفِ لبنائها على وصفة ناجحة.</div>';
  }
  const sim = mixSimilarity(BUILD.picks, g.items.map(i => ({ f: flavorById(i.id), pct: i.pct })));
  if (sim < 0.6) return '';
  return `<div class="note" style="margin:0 0 12px">مبنية على <b>«${g.parent.name}»</b> ★${g.parent.avg.toFixed(1)} · الوضع ${GEN_LABEL[g.mode]}<br>${g.changes.join('<br>')}${g.unproven.length ? `<br><b>لم تدخل وصفة ★4+ من قبل:</b> ${g.unproven.join('، ')}` : ''}</div>`;
}

function generateFromTaste(mode = 'balanced') {
  const o = generateOptions(mode, null, 1);
  if (o && o.length) return optToPicks(o[0]);
  const sc = generateFromTasteScratch(mode); if (sc) sc.fallback = true;
  return sc;
}
function generateAroundFlavor(seed) {
  const o = generateOptions(genMode, seed, 1);
  if (o && o.length) return optToPicks(o[0]);
  const sc = generateAroundFlavorScratch(seed); if (sc) sc.fallback = true;
  return sc;
}


/* التوليد يبني على شكل وصفاتك المُقيَّمة ★4 فأكثر (73 وصفة في نسخة 15 أكتوبر):
   4 نكهات في 35، و5 في 32، و3 في 4 فقط — والقائدة 25–35% في 42 منها و40% في 25.
   لذلك الهدف 3 إلى 5 نكهات (غالباً 4) والقائدة 40–45%، لا قائدة 60% وشريك واحد.
   الترتيب: قائد، ثم قاع إن لم يكن القائد طويل العمر، ثم جسر إن وُجد تصادم أو
   قائد بقوة 5، ثم نكهات تُملأ بحسب شكل الهدف. كل نكهة 10% فأكثر (عدا التبريد النقي). */
const GEN_SHAPES = { 3: [45, 30, 25], 4: [40, 25, 20, 15], 5: [40, 25, 15, 10, 10] };
const GEN_BEST_W = [0.30, 0.22, 0.17, 0.12, 0.10, 0.09];     // الاختيار من أفضل 6 لا 3 — تنويع في الشركاء
/* 5 نكهات ممكنة لكن نادرة: أغلب النكهات حدّها الأدنى 15–25% فلا تتسع خمس منها؛
   فإن لم تتسع يرجع المولّد إلى 4 من تلقاء نفسه */
function genTarget() { const r = Math.random(); return r < 0.20 ? 3 : r < 0.90 ? 4 : 5; }
/* كم تأخذ النكهة التالية: الباقي موزَّع على الأماكن المتبقية بنسبة الشكل المستهدف،
   والأخيرة تأخذ ما بقي */
function genWant(T, k, sum) {
  if (k >= T - 1) return Math.max(HARD_MIN, 100 - sum);
  const sh = GEN_SHAPES[T], rest = sh.slice(k).reduce((a, b) => a + b, 0);
  return Math.max(10, Math.round((100 - sum) * sh[k] / rest / STEP) * STEP);
}
/* حلاوة الخلطة الموزونة — فوق 4.2 يظهر تحذير «تُتعب الحنك» نفسه في المحرّر */
const sweetOf = picks => picks.reduce((s, p) => s + p.f.sweet * p.pct, 0) / 100;
const needsBridge = picks => picks.some(a => picks.some(b => a !== b &&
  ((DATA.familyMatrix[a.f.family] || {})[b.f.family] ?? 5) <= 2)) || (picks[0] && picks[0].f.power >= 5);

/* mode: 'safe' مُثبَت فقط · 'explore' يميل للمجهول · 'balanced' افتراضي */
function generateFromTasteScratch(mode = 'balanced') {
  const M = learningModel();
  const avail = DATA.flavors.filter(f => invOf(f.id).remG >= gramsFor(HARD_MIN));
  const snapshot = BUILD.picks;

  const attempt = () => {
    const picks = [];
    BUILD.picks = picks;
    // المولّد لا يضيف نكهة بأقل من 10% (عدا التبريد النقي): حدود النكهات
    // وُسّعت لتشمل لمساتك الناجحة بـ5%، لكن المولّد لا يبني بالحشو
    const bounds = f => { const w = windowFor(f, true);
      return { lo: Math.max(HARD_MIN, w.lo, f.roles.includes('pureCool') ? 0 : 10), hi: Math.min(HARD_MAX, w.hi) }; };
    const blocksCool = f => ['creamy', 'floral'].includes(f.family) ||
      ['قهوة', 'شوكولاتة وبندق', 'شوكولاتة مخبوزة'].includes(f.subfamily);
    const isCool = f => f.roles.includes('pureCool') || (f.family === 'cooling' && f.cool >= 4);
    const banPair = (a, b) => DATA.bans.some(x => x.kind === 'fail' &&
      ((x.a === a.name && x.b === b.name) || (x.a === b.name && x.b === a.name)));
    const legal = f => {
      if (isCool(f) && picks.some(p => blocksCool(p.f))) return false;
      if (blocksCool(f) && picks.some(p => isCool(p.f))) return false;
      if (mode === 'safe' && !M.tried(f.id) && M.hasData) return false;
      if (picks.some(p => banPair(p.f, f))) return false;
      return !evaluate(f).issues.some(i => i.sev === 'r');
    };
    const best = pred => {
      const pool = avail
        .filter(f => !picks.some(p => p.f.id === f.id) && legal(f) && pred(f))
        .map(f => ({ f, s: M.score(f, picks, mode) - 1.5 * evaluate(f).issues.filter(i => i.sev === 'o').length }))
        .sort((a, b) => b.s - a.s).slice(0, GEN_BEST_W.length);
      if (!pool.length) return null;
      const w = GEN_BEST_W.slice(0, pool.length);
      let roll = Math.random() * w.reduce((a, b) => a + b, 0);
      for (let i = 0; i < pool.length; i++) { roll -= w[i]; if (roll <= 0) return pool[i].f; }
      return pool[0].f;
    };
    const add = (f, want) => {
      if (!f) return;
      picks.push({ f, pct: HARD_MIN });
      const b = bounds(f);
      if (b.hi < b.lo) { picks.pop(); return; }
      picks[picks.length - 1].pct = Math.min(b.hi, Math.max(b.lo, Math.round(want / STEP) * STEP));
    };

    const sum = () => picks.reduce((s, i) => s + i.pct, 0);
    const T = genTarget(), wantNext = () => genWant(T, picks.length, sum());
    const isLead = f => f.roles.includes('main') || f.roles.includes('base');
    const lead = best(f => isLead(f) && f.maxPct >= 40) || best(isLead);
    add(lead, wantNext());
    if (!picks.length) return null;
    if (!picks.some(p => servesPhase(p.f, 2))) add(best(f => servesPhase(f, 2)), wantNext());
    if (needsBridge(picks)) add(best(f => f.roles.includes('bridge') || f.roles.includes('support')), wantNext());

    const rebalance = () => {
      for (let g = 0; sum() !== 100 && g < 80; g++) {
        const up = sum() < 100;
        const c = picks.filter(p => { const b = bounds(p.f);
            return up ? p.pct + STEP <= b.hi : p.pct - STEP >= b.lo; })
          .sort((a, d) => { const sa = M.score(a.f, picks, mode), sd = M.score(d.f, picks, mode);
            return up ? sd - sa : sa - sd; })[0];
        if (!c) break;
        c.pct += up ? STEP : -STEP;
      }
    };
    for (let tries = 0; sum() < 100 && tries < 6; tries++) {
      // فجوة صغيرة (≤10%) تُسدّ برفع ما اختير — لا بنكهة جديدة بـ5% لا يشعر بها أحد
      if (100 - sum() <= 10) { rebalance(); if (sum() === 100) break; }
      // ما دمنا دون الهدف نأخذ حصة النكهة التالية فقط، لا كل الباقي
      const need = picks.length < T ? Math.min(wantNext(), 100 - sum()) : 100 - sum();
      // قائد حلو جداً (نوتيلا، وافل، مخمل خوخي…) يحتاج شريكاً يكسر الحلاوة لا يضاعفها
      const curSweet = picks.reduce((t, p) => t + p.f.sweet * p.pct, 0) / (sum() || 1);
      const dry = x => curSweet <= 4 || x.sweet <= 3;
      let f = null, slot = need;
      for (const extra of (picks.length < T ? [0, 5, 10, 15] : [0])) {
        slot = Math.min(need + extra, 100 - sum());
        f = best(x => { const b = bounds(x); return dry(x) && b.lo <= slot && b.hi >= slot && M.score(x, picks, mode) >= 0; })
         || best(x => { const b = bounds(x); return dry(x) && b.lo <= slot && M.score(x, picks, mode) >= 0; })
         || best(x => { const b = bounds(x); return b.lo <= slot && M.score(x, picks, mode) >= 0; })
         || best(x => { const b = bounds(x); return b.lo <= slot; });
        if (f && bounds(f).lo <= slot) break;
        f = null;
      }
      if (!f) break;
      picks.push({ f, pct: HARD_MIN });
      const b = bounds(f);
      if (b.hi < b.lo || b.lo > slot) { picks.pop(); break; }
      picks[picks.length - 1].pct = Math.min(b.hi, Math.max(b.lo, Math.floor(slot / STEP) * STEP));
      if (picks.length >= T) rebalance();
    }
    rebalance();
    return sum() === 100 ? picks.map(p => ({ f: p.f, pct: p.pct })) : null;
  };

  /* (4) نحاول عدة مرات ونرفض ما يقارب وصفة عندك أصلاً — لا فائدة من
     توليد نسخة ثانية من وصفة تملكها. نبقي الأقل تشابهاً كخيار أخير. */
  let fallback = null;
  for (let i = 0; i < 8; i++) {
    const out = attempt();
    if (!out) continue;
    const near = nearestExisting(out);
    const sweetPen = sweetOf(out) > 4.2 ? 1 : 0;   // لا نقترح خلطة سيحذّرك منها المحرّر نفسه
    if ((!near || near.sim < 0.7) && !sweetPen) {
      BUILD.picks = snapshot;
      return Object.assign(out, { meta: buildMeta(out, M, near) });
    }
    const pen = (near ? near.sim : 0) + sweetPen;
    if (!fallback || pen < fallback.pen) fallback = { out, sim: near ? near.sim : 0, near, pen };
  }
  BUILD.picks = snapshot;
  if (!fallback) return null;
  return Object.assign(fallback.out, { meta: buildMeta(fallback.out, M, fallback.near) });
}

/* توليد خلطة كاملة مرتكزة على نكهة بعينها — نفس محرّك «ولّد من ذوقي»
   حرفياً، بفارق واحد: البذرة تُثبَّت أولاً مهما كان دورها، والباقي
   يُختار حولها بنفس منطق التوافق والمراحل وتجنّب الممنوعات والتكرار. */
/* أفضل ممثّل لعائلة كاملة — يُفضَّل من له دور رئيسية/قاعدة داخلها إن وُجد،
   ثم يُفوَّض التوليد لنفس محرّك generateAroundFlavor حرفياً — لا تكرار منطق. */
function generateAroundFamily(key) {
  const M = learningModel();
  const pool = DATA.flavors.filter(f => f.family === key && invOf(f.id).remG >= gramsFor(HARD_MIN));
  if (!pool.length) return null;
  const lead = pool.filter(f => f.roles.includes('main') || f.roles.includes('base'));
  const cands = lead.length ? lead : pool;
  const seed = cands.map(f => ({ f, s: M.score(f, [], 'balanced') })).sort((a, b) => b.s - a.s)[0].f;
  return generateAroundFlavor(seed);
}

function generateAroundFlavorScratch(seed) {
  const M = learningModel();
  const avail = DATA.flavors.filter(f => invOf(f.id).remG >= gramsFor(HARD_MIN));
  const snapshot = BUILD.picks;

  const attempt = () => {
    const picks = [];
    BUILD.picks = picks;
    // المولّد لا يضيف نكهة بأقل من 10% (عدا التبريد النقي): حدود النكهات
    // وُسّعت لتشمل لمساتك الناجحة بـ5%، لكن المولّد لا يبني بالحشو
    const bounds = f => { const w = windowFor(f, true);
      return { lo: Math.max(HARD_MIN, w.lo, f.roles.includes('pureCool') ? 0 : 10), hi: Math.min(HARD_MAX, w.hi) }; };
    const blocksCool = f => ['creamy', 'floral'].includes(f.family) ||
      ['قهوة', 'شوكولاتة وبندق', 'شوكولاتة مخبوزة'].includes(f.subfamily);
    const isCool = f => f.roles.includes('pureCool') || (f.family === 'cooling' && f.cool >= 4);
    const banPair = (a, b) => DATA.bans.some(x => x.kind === 'fail' &&
      ((x.a === a.name && x.b === b.name) || (x.a === b.name && x.b === a.name)));
    const legal = f => {
      if (isCool(f) && picks.some(p => blocksCool(p.f))) return false;
      if (blocksCool(f) && picks.some(p => isCool(p.f))) return false;
      if (picks.some(p => banPair(p.f, f))) return false;
      return !evaluate(f).issues.some(i => i.sev === 'r');
    };
    const best = pred => {
      const pool = avail
        .filter(f => !picks.some(p => p.f.id === f.id) && legal(f) && pred(f))
        .map(f => ({ f, s: M.score(f, picks, 'balanced') - 1.5 * evaluate(f).issues.filter(i => i.sev === 'o').length }))
        .sort((a, b) => b.s - a.s).slice(0, GEN_BEST_W.length);
      if (!pool.length) return null;
      const w = GEN_BEST_W.slice(0, pool.length);
      let roll = Math.random() * w.reduce((a, b) => a + b, 0);
      for (let i = 0; i < pool.length; i++) { roll -= w[i]; if (roll <= 0) return pool[i].f; }
      return pool[0].f;
    };
    const add = (f, want) => {
      if (!f) return;
      picks.push({ f, pct: HARD_MIN });
      const b = bounds(f);
      if (b.hi < b.lo) { picks.pop(); return; }
      picks[picks.length - 1].pct = Math.min(b.hi, Math.max(b.lo, Math.round(want / STEP) * STEP));
    };

    // إن كانت البذرة نفسها قائدة بطبيعتها (main/base) تُضاف أولاً كما هي.
    // غير ذلك (لمسة أو جسر أو مبرّد) — تُضاف بعد قائد حقيقي، وإلا صارت
    // هي "الأعلى نسبة" بالخطأ فيخنق قانون الهيمنة كل ما بعدها تحت سقفها الضئيل
    // ويستحيل الوصول لـ100% رياضياً (خُبرة موثّقة من فشل تكراري في الاختبار).
    // نكهة قوية بسقف منخفض (باشن، كيوي Overdose، ماسالا…) لا تُجعل «الأعلى نسبة»:
    // قانون الهيمنة سيقصّ كل ما بعدها تحتها فتنتهي الخلطة بست نكهات صغيرة.
    const sum = () => picks.reduce((s, i) => s + i.pct, 0);
    const T = genTarget(), wantNext = () => genWant(T, picks.length, sum());
    const seedLeads = (seed.roles.includes('main') || seed.roles.includes('base')) && seed.maxPct >= 40;
    const okWithSeed = f => f.id !== seed.id && !banPair(f, seed)
      && !(isCool(seed) && blocksCool(f)) && !(blocksCool(seed) && isCool(f));
    if (seedLeads) {
      add(seed, Math.max(wantNext(), Math.min(seed.idealPct, 45)));
    } else {
      const isLead = f => f.roles.includes('main') || f.roles.includes('base');
      const lead = best(f => isLead(f) && f.maxPct >= 40 && okWithSeed(f)) || best(f => isLead(f) && okWithSeed(f));
      add(lead, wantNext());
      if (!picks.length) return null;
      add(seed, Math.max(10, seed.idealPct));
    }
    if (!picks.length) return null;
    if (!picks.some(p => servesPhase(p.f, 2))) add(best(f => servesPhase(f, 2)), wantNext());
    if (needsBridge(picks)) add(best(f => f.roles.includes('bridge') || f.roles.includes('support')), wantNext());

    const rebalance = () => {
      for (let g = 0; sum() !== 100 && g < 80; g++) {
        const up = sum() < 100;
        const c = picks.filter(p => { const b = bounds(p.f);
            return up ? p.pct + STEP <= b.hi : p.pct - STEP >= b.lo; })
          .sort((a, d) => { const sa = M.score(a.f, picks, 'balanced'), sd = M.score(d.f, picks, 'balanced');
            return up ? sd - sa : sa - sd; })[0];
        if (!c) break;
        c.pct += up ? STEP : -STEP;
      }
    };
    for (let tries = 0; sum() < 100 && tries < 6; tries++) {
      // فجوة صغيرة (≤10%) تُسدّ برفع ما اختير — لا بنكهة جديدة بـ5% لا يشعر بها أحد
      if (100 - sum() <= 10) { rebalance(); if (sum() === 100) break; }
      // ما دمنا دون الهدف نأخذ حصة النكهة التالية فقط، لا كل الباقي
      const need = picks.length < T ? Math.min(wantNext(), 100 - sum()) : 100 - sum();
      const curSweet = picks.reduce((t, p) => t + p.f.sweet * p.pct, 0) / (sum() || 1);
      const dry = x => curSweet <= 4 || x.sweet <= 3;
      let f = null, slot = need;
      for (const extra of (picks.length < T ? [0, 5, 10, 15] : [0])) {
        slot = Math.min(need + extra, 100 - sum());
        f = best(x => { const b = bounds(x); return dry(x) && b.lo <= slot && b.hi >= slot && M.score(x, picks, 'balanced') >= 0; })
         || best(x => { const b = bounds(x); return dry(x) && b.lo <= slot && M.score(x, picks, 'balanced') >= 0; })
         || best(x => { const b = bounds(x); return b.lo <= slot && M.score(x, picks, 'balanced') >= 0; })
         || best(x => { const b = bounds(x); return b.lo <= slot; });
        if (f && bounds(f).lo <= slot) break;
        f = null;
      }
      if (!f) break;
      picks.push({ f, pct: HARD_MIN });
      const b = bounds(f);
      if (b.hi < b.lo || b.lo > slot) { picks.pop(); break; }
      picks[picks.length - 1].pct = Math.min(b.hi, Math.max(b.lo, Math.floor(slot / STEP) * STEP));
      if (picks.length >= T) rebalance();
    }
    rebalance();
    return sum() === 100 ? picks.map(p => ({ f: p.f, pct: p.pct })) : null;
  };

  /* التشابه: نبدأ صارمين (0.7) وإن لم نجد شيئاً كافي التمايز، نخفّف الحد
     تدريجياً (0.8 ثم 0.9) بدل التوقف الفوري — المحاولة الأوسع أولى من
     الاستسلام المبكر. نُبقي أقرب نتيجة رغم ذلك كحل أخير لا نرفضها أبداً
     طالما صحيحة الجمع والممنوعات، ونُرفق درجة تشابهها ليعرضها المستدعي. */
  let fallback = null;
  for (const thresh of [0.7, 0.8, 0.9]) {
    for (let i = 0; i < 8; i++) {
      const out = attempt();
      if (!out) continue;
      const near = nearestExisting(out);
      const sim = near ? near.sim : 0;
      const sweetPen = sweetOf(out) > 4.2 ? 1 : 0;
      if (!fallback || sim + sweetPen < fallback.pen) fallback = { out, sim, near, pen: sim + sweetPen };
      if (sim < thresh && !sweetPen) { BUILD.picks = snapshot; return Object.assign(out, { near: sim >= 0.5 ? near : null }); }
    }
  }
  BUILD.picks = snapshot;
  if (!fallback) return null;
  return Object.assign(fallback.out, { near: fallback.sim >= 0.5 ? fallback.near : null });
}

function buildMeta(items, M, near) {
  const inf = inferBowl(items);
  return {
    why: items.map(i => ({ id: i.f.id, name: i.f.name, t: M.why(i.f, items.filter(x => x !== i)) })),
    notes: M.notes,
    bowl: inf.bowl, minLo: inf.minLo, minHi: inf.minHi, setup: inf.setup,
    nearest: near && near.sim >= 0.55 ? { name: near.r.name, no: rNum(near.r), sim: Math.round(near.sim * 100) } : null,
    novel: items.filter(i => !M.tried(i.f.id)).map(i => i.f.name),
  };
}

                 ['balanced', 'متوازن', 'حتى تغييرين، ويسمح بنكهة واحدة لم تجرّبها'],
                 ['explore', 'استكشاف', 'حتى ثلاثة تغييرات ونكهتين لم تجرّبهما — الأعلى مخاطرة']];
  const starsTxt = a => '★' + (Math.round(a * 10) / 10);

    const sb = genScoreboard(); if (!sb.n && !sb.pending) return '';
    const parts = Object.keys(GEN_LABEL).filter(m => sb.by[m].n).map(m => `${GEN_LABEL[m]} ${sb.by[m].ok}/${sb.by[m].n}`);
    return `<div class="note" style="margin:0 0 10px">${sb.n
      ? `ما ولّده المحرك وقيّمته: <b>${sb.ok} من ${sb.n}</b> وصلت ★4+ (${parts.join('، ')}).` : ''}${
      sb.pending ? ` ${sb.pending} وصفة مولَّدة بانتظار تقييمك.` : ''}</div>`;
  };
  const optCard = (o, i) => `<div class="grp" style="padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
        <b>${legacy ? 'خلطة من الصفر' : `من «${o.parent.name}»`}</b>${legacy ? '' : `<span class="num" style="color:var(--ember)">${starsTxt(o.parent.avg)}</span>`}</div>
      <div class="ember-bar" style="margin:8px 0">${o.items.map(it => `<span style="width:${it.pct}%;background:${famColor(it.f.family)}"></span>`).join('')}</div>
      <div class="src"><span>${o.items.slice().sort((a, b) => b.pct - a.pct).map(it => `<bdi>${it.f.name}</bdi> ${it.pct}%`).join(' · ')}</span></div>
      ${legacy ? '' : `<div class="note" style="margin-top:8px;padding:6px 0;background:none">${o.changes.map(changeText).join('<br>')}${
        o.unproven.length ? `<br><b>لم تدخل وصفة ★4+ من قبل:</b> ${o.unproven.join('، ')}` : ''}</div>`}
      <button class="btn ghost" data-sel="${i}" style="width:100%;margin-top:8px">اعرضها</button></div>`;
  const draw = () => {
    if (sel == null) {
      sBody.innerHTML = `
        <div class="sh-title">ولّد وصفة من نجاحاتك</div>
        <div class="sh-sub"><span>${MODES.find(x => x[0] === genMode)[2]}</span></div>
        <div class="grp"><div class="chip-grid">${MODES.map(([k, ar]) =>
          `<button class="qchip ${genMode === k ? 'on' : ''}" data-gm="${k}">${ar}</button>`).join('')}</div></div>
        ${scoreLine()}
        ${!opts ? '<div class="empty">اضغط «ولّد» لتقترح عليك نسخاً من وصفاتك الناجحة.</div>'
          : !opts.length ? '<div class="empty">لا تتسع النسخ الممكنة لمخزونك الآن في هذا الوضع. جرّب وضعاً آخر.</div>'
          : `${legacy ? '<div class="alert dup"><b>سجلك لا يكفي بعد</b><p>يلزم 4 نسخ قيّمتها ★4+ ولم يخفت طعمها. هذه خلطة من الصفر — أول تجربة لها.</p></div>' : ''}
             ${opts.map(optCard).join('')}`}
        <button class="btn solid" id="genGo" style="width:100%;margin-top:6px">${opts ? 'ولّد خيارات أخرى' : 'ولّد'}</button>`;
    } else {
      const items = opts[sel].picks, m = items.meta;
      sBody.innerHTML = `
        <div class="sh-title">${legacy ? 'خلطة من الصفر' : `نسخة من «${items.anchor.parent.name}»`}</div>
        <div class="sh-sub"><span>الوضع ${GEN_LABEL[genMode]}</span></div>
        <div class="grp"><h4>الخلطة</h4>
          <div class="ember-bar" style="margin-bottom:10px">${items.map(i =>
            `<span style="width:${i.pct}%;background:${famColor(i.f.family)}"></span>`).join('')}</div>
          ${items.map(i => `<div class="pick" style="padding:8px 0">
            <span class="stripe" style="background:${famColor(i.f.family)}"></span>
            <span class="main"><span class="nm"><bdi>${i.f.name}</bdi>${
              m.novel.includes(i.f.name) ? '<span class="lead" style="background:var(--f-accent)">جديدة</span>' : ''}</span>
              <span class="meta">${(m.why.find(w => w.id === i.f.id) || {}).t || ''}</span></span>
            <span class="pct num">${i.pct}% · ${gramsFor(i.pct)}غ</span></div>`).join('')}
        </div>
        ${items.anchor ? `<div class="grp"><h4>ما تغيّر عن وصفتك</h4><div class="note">${items.anchor.changes.join('<br>')}${
          items.anchor.unproven.length ? `<br><b>لم تدخل وصفة ★4+ من قبل:</b> ${items.anchor.unproven.join('، ')}` : ''}</div></div>` : ''}
        ${m.notes.length ? `<div class="grp"><h4>وجّهه سجلّك</h4>
          ${m.notes.map(t => `<div class="tier y"><span class="sw"></span><span class="t">${t}</span></div>`).join('')}</div>` : ''}
        <div class="grp"><h4>الإعداد المقترح</h4>
